[workspace]
resolver = "2"
members = [
	"agent",
	"cli",
	"crates/billing",
	"crates/cloud",
	"crates/core",
	"crates/crypto",
	"crates/firewall",
	"crates/outbound",
	"crates/proto",
	"crates/ui",
	"server",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["chikof"]
license = "AGPL-3.0-or-later"
rust-version = "1.94"

[workspace.dependencies]
tokio = { version = "=1.54.1", features = ["full"] }
thiserror = "=2.0.21"
anyhow = "=1.0.104"
tracing = "=0.1.44"
better-tracing = { version = "=0.6.0", features = ["env-filter"] }
bollard = { version = "=0.21.1", features = [
	"buildkit",
	"chrono",
	"websocket",
] }
time = "=0.3.55"
sqlx = { version = "=0.9.0", features = [
	"runtime-tokio",
	"tls-rustls",
	"macros",
	"migrate",
	"postgres",
	"time",
	"json",
] }
axum = { version = "=0.8.9", features = ["multipart", "ws"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
axum-extra = { version = "=0.12.6", features = ["typed-header"] }
age = "=0.12.1"
argon2 = "=0.6.0"
bcrypt = { version = "=0.19.3", default-features = false, features = ["std"] }
getrandom = "=0.4.3"
zeroize = "=1.9.2"
tower-cookies = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
forgeconf = { version = "=1.0.0", default-features = false, features = ["toml"] }
dirs = "=7.0.0"
maud = { version = "=0.27.0", features = ["axum"] }
datastar = { version = "=0.4.3", features = ["axum"] }
encre-css = "=0.21.1"
futures-util = "=0.3.34"
tempfile = "=3.27.0"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
tokio-util = { version = "=0.7.20", features = ["rt"] }
bytes = "=1.12.1"
serde_json = "=1.0.154"
toml = "=0.9.12"
sha2 = "=0.11.1"
hmac = "=0.13.0"
base64 = "=0.23.1"
flate2 = "=1.1.11"
tar = "=0.4.46"
url = "=2.5.9"
# The log search of the agent; no perf or unicode-heavy extras, to keep the binary small.
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode"] }
croner = { version = "=4.0.3", default-features = false, features = ["jiff"] }
# The zone database is bundled: a minimal container has no /usr/share/zoneinfo.
jiff = { version = "=0.2.46", default-features = false, features = ["std", "tzdb-bundle-always"] }
ssh-key = { version = "=0.6.7", default-features = false, features = ["alloc", "std", "ed25519", "rsa", "ecdsa", "getrandom"] }
rsa = { version = "=0.9.10", default-features = false, features = ["std", "pem"] }
rusty-s3 = { version = "=0.11.0", default-features = false, features = ["rustcrypto", "xml"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
lettre = { version = "=0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.6.11", default-features = false, features = ["compression-gzip"] }

crypto = { path = "./crates/crypto" }
proto = { path = "./crates/proto" }
outbound = { path = "./crates/outbound" }


[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
redundant_clone = "deny"
needless_collect = "deny"
cast_precision_loss = "allow"
# The toolchain from the devenv update flags `assert!(x.is_empty())`; the
# suggested `assert_eq!(x, [] as [T; 0])` reads worse.
assert_is_empty = "allow"

[workspace.lints.rust]
missing_docs = "warn"

# Generating an RSA-4096 key is a prime search: far too slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
# Every password check is an Argon2id hash of 64 MiB: seconds each unoptimized, which makes
# the sign-in and throttle tests crawl.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

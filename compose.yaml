services:
  server:
    build:
      context: .
      target: final
    ports:
      - 8080:8080
    networks:
      - podkit
    secrets:
      - db-password
    environment:
      - DATABASE_URL=postgres://postgres@database/podkit
      - LOCAL_AGENT_SOCKET=/run/podkit/agent.sock
      - DATA_DIR=/var/lib/podkit
    volumes:
      - ${HOME}/.podkit/agent.sock:/run/podkit/agent.sock
      - podkit-data:/var/lib/podkit
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  database:
    image: postgres:18-alpine3.22
    restart: always
    user: postgres
    secrets:
      - db-password
    volumes:
      - podkit-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=podkit
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    networks:
      - podkit
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  podkit-db:
  podkit-data:

secrets:
  db-password:
    file: secrets/db-password.txt

networks:
  podkit:
    external: true

id = "notifuse"
name = "Notifuse"
description = "Open-source newsletter and notification platform that empowers teams to create, send, and track communications at scale."
category = "communication"
tags = [
    "newsletter",
    "email",
    "communication",
    "notifications",
]
version = "latest"
logo = "logo.png"
website = "https://notifuse.com/"
docs = "https://docs.notifuse.com/"
source = "https://github.com/notifuse/notifuse"
upstream = "Dokploy/templates@6313a2e blueprints/notifuse"

[variables]
main_domain = "${domain}"
secret_key = "${base64:64}"

[config.env]
API_ENDPOINT = "https://${main_domain}"
ROOT_EMAIL = "${email}"
SECRET_KEY = "${secret_key}"

[[config.domains]]
serviceName = "notifuse"
port = 8080
host = "${main_domain}"

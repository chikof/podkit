id = "geoserver"
name = "GeoServer & PostGIS"
description = "An open-source server for sharing geospatial data, paired with a PostGIS database. Template created and maintained by OpenGeoCity Tanzania (info@ogctz.org). For further assistance contact +255759968919 or visit https://opengeocity.org or github: https://github.com/ShabaniMagawila or linkedin: htt..."
category = "other"
tags = [
    "geospatial",
    "gis",
    "postgis",
]
version = "2.24.1"
logo = "logo.png"
website = "https://geoserver.org/"
docs = "https://docs.geoserver.org/"
source = "https://github.com/geoserver/geoserver"
upstream = "Dokploy/templates@6313a2e blueprints/geoserver"

[variables]
GEOSERVER_ADMIN_PASSWORD = "geoserver_secure"
GEOSERVER_ADMIN_USER = "admin"
INITIAL_MEMORY = "2G"
MAXIMUM_MEMORY = "4G"
POSTGRES_DB = "gis"
POSTGRES_PASSWORD = "postgres_secure"
POSTGRES_USER = "postgres"

[[config.domains]]
serviceName = "geoserver"
port = 8080

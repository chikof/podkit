id = "mealie"
name = "Mealie (sqlite version)"
description = "Mealie is an intuitive and easy to use recipe management app. It's designed to make your life easier by being the best recipes management experience on the web and providing you with an easy to use interface to manage your growing collection of recipes."
category = "other"
tags = [
    "recipes",
    "shopping-list",
    "meal-planning",
]
version = "latest"
logo = "logo.png"
website = "https://mealie.io/"
docs = "https://docs.mealie.io/"
source = "https://github.com/mealie-recipes/mealie"
upstream = "Dokploy/templates@6313a2e blueprints/mealie"

[variables]
ALLOW_SIGNUP = "false"
API_DOCS = "False"
BASE_URL = "https://${main_domain}"
SMTP_AUTH_STRATEGY = "TLS"
SMTP_FROM_EMAIL = ""
SMTP_FROM_NAME = "Mealie"
SMTP_HOST = ""
SMTP_PASSWORD = ""
SMTP_PORT = "587"
SMTP_USER = ""
TZ = "Europe/London"
main_domain = "${domain}"

[config.env]
ALLOW_SIGNUP = "${ALLOW_SIGNUP}"
API_DOCS = "${API_DOCS}"
BASE_URL = "${BASE_URL}"
DAILY_SCHEDULE_TIME = "01:00"
DEFAULT_GROUP = "Home"
DEFAULT_HOUSEHOLD = "Family"
SECURITY_MAX_LOGIN_ATTEMPTS = "10"
SECURITY_USER_LOCKOUT_TIME = "24"
SMTP_AUTH_STRATEGY = "${SMTP_AUTH_STRATEGY}"
SMTP_FROM_EMAIL = "${SMTP_FROM_EMAIL}"
SMTP_FROM_NAME = "${SMTP_FROM_NAME}"
SMTP_HOST = "${SMTP_HOST}"
SMTP_PASSWORD = "${SMTP_PASSWORD}"
SMTP_PORT = "${SMTP_PORT}"
SMTP_USER = "${SMTP_USER}"
TZ = "${TZ}"

[[config.domains]]
serviceName = "mealie"
port = 9000
host = "${main_domain}"

id = "classicpress"
name = "ClassicPress"
description = "ClassicPress is a community-led open source content management system for creators. It is a fork of WordPress 6.2 that preserves the TinyMCE classic editor as the default option."
category = "cms"
tags = [
    "cms",
    "wordpress",
    "content-management",
]
version = "php8.3-apache"
logo = "@mono-classicpress"
website = "https://www.classicpress.net/"
docs = "https://docs.classicpress.net/"
source = "https://github.com/ClassicPress/"
upstream = "Dokploy/templates@6313a2e blueprints/classicpress"

[variables]
DB_PASSWORD = "${password:16}"
DB_ROOT_PASSWORD = "${password:16}"

[config.env]
DB_PASSWORD = "${DB_PASSWORD}"
DB_ROOT_PASSWORD = "${DB_ROOT_PASSWORD}"

[[config.domains]]
serviceName = "classicpress"
port = 80
host = "${domain}"

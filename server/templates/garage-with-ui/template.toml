id = "garage-with-ui"
name = "Garage S3 with Web UI"
description = "Garage is an open-source distributed object storage service tailored for self-hosting. For authentication in the web-ui please go to https://github.com/khairul169/garage-webui?tab=readme-ov-file#authentication"
category = "storage"
tags = [
    "storage",
    "object-storage",
]
version = "latest"
logo = "logo.svg"
website = "https://garagehq.deuxfleurs.fr"
docs = "https://garagehq.deuxfleurs.fr/documentation/quick-start/"
source = "https://git.deuxfleurs.fr/Deuxfleurs/garage"
upstream = "Dokploy/templates@6313a2e blueprints/garage-with-ui"

[variables]
admin_token = "${base64:32}"
main_domain = "${domain}"
metrics_token = "${base64:32}"
webui_domain = "web-ui.${domain}"

[config.env]
API_BASE_URL = "http://garage:3903"
AUTH_USER_PASS = ""
S3_ENDPOINT_URL = "http://garage:3900"

[[config.domains]]
serviceName = "garage"
port = 3900
host = "${main_domain}"

[[config.domains]]
serviceName = "garage-webui"
port = 3909
host = "${webui_domain}"

[[config.mounts]]
filePath = "garage.toml"
content = """
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
metadata_auto_snapshot_interval = "6h"

replication_factor = 1
compression_level = 2

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "localhost:3901" # Required
rpc_secret = "${hash:64}"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.domain.com"

[s3_web] # Optional, if you want to expose bucket as web
bind_addr = "[::]:3902"
root_domain = ".web.domain.com"
index = "index.html"

[admin] # Required
api_bind_addr = "[::]:3903"
admin_token = "${admin_token}"
metrics_require_token = true
metrics_token = "${metrics_token}"
"""

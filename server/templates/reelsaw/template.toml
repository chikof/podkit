id = "reelsaw"
name = "Reelsaw"
description = "Reelsaw is a self-hosted, AI-powered video clipper: paste a YouTube link or upload a video and it transcribes it, asks a language model for the most clippable moments, reframes the speaker into vertical 9:16 with face tracking, cuts fillers and burns in word-highlight captions. Open source (AGPL-..."
category = "media"
tags = [
    "video",
    "ai",
    "self-hosted",
]
version = "v0.18.2"
logo = "logo.png"
website = "https://reelsaw.com"
docs = "https://github.com/osbytes/reelsaw#readme"
source = "https://github.com/osbytes/reelsaw"
upstream = "Dokploy/templates@6313a2e blueprints/reelsaw"

[variables]
main_domain = "${domain}"

[config.env]
AI_MODEL = "openai:gpt-4o-mini"
ANTHROPIC_API_KEY = ""
APP_URL = "https://${main_domain}"
BETTER_AUTH_SECRET = "${base64:48}"
DB_PASSWORD = "${password:32}"
DEEPGRAM_API_KEY = ""
GOOGLE_GENERATIVE_AI_API_KEY = ""
GROQ_API_KEY = ""
OPENAI_API_KEY = ""
SIGNUP_MODE = "open"
TRANSCRIPTION_MODEL = "openai:whisper-1"

[[config.domains]]
serviceName = "reelsaw"
port = 3000
host = "${main_domain}"

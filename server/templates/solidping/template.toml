id = "solidping"
name = "SolidPing"
description = "Distributed, self-hostable uptime monitoring: 40+ check types, multi-region workers, private agents, status pages, incidents and on-call escalation, in a single Go binary."
category = "monitoring"
tags = [
    "monitoring",
    "uptime",
    "status-page",
    "observability",
    "alerts",
]
version = "0.41.0"
logo = "logo.svg"
website = "https://www.solidping.io"
docs = "https://docs.solidping.io"
source = "https://github.com/fclairamb/solidping"
upstream = "Dokploy/templates@6313a2e blueprints/solidping"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "solidping"
port = 4000
host = "${main_domain}"

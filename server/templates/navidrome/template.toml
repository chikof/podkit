id = "navidrome"
name = "Navidrome"
description = "Navidrome is a modern music server and streamer compatible with Subsonic/Airsonic. Stream your music collection anywhere."
category = "media"
tags = [
    "music",
    "streaming",
    "media-server",
    "subsonic",
    "self-hosted",
    "audio",
]
version = "latest"
logo = "logo.png"
website = "https://www.navidrome.org/"
docs = "https://www.navidrome.org/docs/"
source = "https://github.com/navidrome/navidrome"
upstream = "Dokploy/templates@6313a2e blueprints/navidrome"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "navidrome"
port = 4533
host = "${main_domain}"

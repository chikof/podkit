id = "matomo"
name = "Matomo"
description = "Matomo is an open-source web analytics platform that gives you full ownership of your data."
category = "analytics"
tags = [
    "analytics",
    "metrics",
    "privacy",
    "self-hosted",
]
version = "5.1-apache"
logo = "@matomo"
website = "https://matomo.org"
docs = "https://matomo.org/docs"
source = "https://github.com/matomo-org/matomo"
upstream = "Dokploy/templates@6313a2e blueprints/matomo"

[variables]
MATOMO_DATABASE_DB = "matomo"
MATOMO_DATABASE_HOST = "db"
MATOMO_DATABASE_PASSWORD = "${password:32}"
MATOMO_DATABASE_USER = "matomo"
MYSQL_ROOT_PASSWORD = "${password:32}"

[config.env]
MATOMO_DATABASE_DB = "${MATOMO_DATABASE_DB}"
MATOMO_DATABASE_HOST = "${MATOMO_DATABASE_HOST}"
MATOMO_DATABASE_PASSWORD = "${MATOMO_DATABASE_PASSWORD}"
MATOMO_DATABASE_USER = "${MATOMO_DATABASE_USER}"
MYSQL_DATABASE = "${MATOMO_DATABASE_DB}"
MYSQL_PASSWORD = "${MATOMO_DATABASE_PASSWORD}"
MYSQL_ROOT_PASSWORD = "${MYSQL_ROOT_PASSWORD}"
MYSQL_USER = "${MATOMO_DATABASE_USER}"

[[config.domains]]
serviceName = "matomo"
port = 80
host = "${domain}"

id = "keycloak"
name = "Keycloak"
description = "Keycloak is an open-source identity and access management tool with single sign-on (SSO)."
category = "security"
tags = [
    "authentication",
    "identity",
    "sso",
    "oauth2",
    "openid-connect",
]
version = "26.0"
logo = "logo.svg"
website = "https://www.keycloak.org/"
docs = "https://www.keycloak.org/documentation"
source = "https://github.com/keycloak/keycloak"
upstream = "Dokploy/templates@6313a2e blueprints/keycloak"
reveal = ["KEYCLOAK_ADMIN_PASSWORD"]

[variables]
KC_HOSTNAME = "${main_domain}"
KEYCLOAK_ADMIN = "admin"
KEYCLOAK_ADMIN_PASSWORD = "${password:32}"
POSTGRES_DB = "keycloak"
POSTGRES_PASSWORD = "${password:32}"
POSTGRES_USER = "keycloakuser"
main_domain = "${domain}"

[config.env]
KC_HOSTNAME = "${KC_HOSTNAME}"
KEYCLOAK_ADMIN = "${KEYCLOAK_ADMIN}"
KEYCLOAK_ADMIN_PASSWORD = "${KEYCLOAK_ADMIN_PASSWORD}"
POSTGRES_DB = "${POSTGRES_DB}"
POSTGRES_PASSWORD = "${POSTGRES_PASSWORD}"
POSTGRES_USER = "${POSTGRES_USER}"

[[config.domains]]
serviceName = "keycloak"
port = 8080
host = "${main_domain}"

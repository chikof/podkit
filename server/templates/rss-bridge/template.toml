id = "rss-bridge"
name = "RSS-Bridge"
description = "RSS-Bridge is a PHP project capable of generating Atom feeds for websites that don't have one."
category = "productivity"
tags = [
    "rss",
    "feeds",
    "news",
    "content",
]
version = "latest"
logo = "logo.png"
website = "https://rss-bridge.github.io/rss-bridge/"
docs = "https://rss-bridge.github.io/rss-bridge/General/Project_goals.html"
source = "https://github.com/RSS-Bridge/rss-bridge"
upstream = "Dokploy/templates@6313a2e blueprints/rss-bridge"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "rss-bridge"
port = 80
host = "${main_domain}"

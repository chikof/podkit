id = "opentodo"
name = "OpenTodo"
description = "Open-source, local-first task manager. Works offline and syncs every device from one small container."
category = "productivity"
tags = [
    "productivity",
    "tasks",
    "todo",
    "self-hosted",
]
version = "1.4.2"
logo = "logo.svg"
website = "https://open-todo.app"
docs = "https://open-todo.app/docs/self-hosting/dokploy/"
source = "https://github.com/OpenTodoApp/OpenTodo"
upstream = "Dokploy/templates@6313a2e blueprints/opentodo"

[variables]
main_domain = "${domain}"
setup_token = "${password:32}"

[config.env]
OPENTODO_ALLOW_SIGNUP = "false"
OPENTODO_BASE_URL = ""
OPENTODO_SETUP_TOKEN = "${setup_token}"
OPENTODO_TRUSTED_PROXIES = ""

[[config.domains]]
serviceName = "opentodo"
port = 8080
host = "${main_domain}"

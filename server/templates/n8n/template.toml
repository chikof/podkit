id = "n8n"
name = "n8n"
description = "Workflow automation with a visual editor and AI nodes. Link a podkit model to the application and its OpenAI-compatible endpoint is in the environment (OPENAI_BASE_URL, OPENAI_API_KEY, PODKIT_MODEL), readable in workflows as $env."
category = "automation"
tags = ["automation", "workflow", "ai", "low-code"]
version = "1.123.0"
logo = "@n8n"
website = "https://n8n.io"
docs = "https://docs.n8n.io"
source = "https://github.com/n8n-io/n8n"
gateway = true

[requires]
ram_mb = 1024

[variables]
main_domain = "${domain}"
encryption_key = "${password:32}"
timezone = { type = "string", default = "UTC", label = "Time zone", description = "Used by schedules, e.g. Europe/Berlin" }

[config.env]
N8N_HOST = "${main_domain}"
GENERIC_TIMEZONE = "${timezone}"
N8N_ENCRYPTION_KEY = "${encryption_key}"

[[config.domains]]
serviceName = "n8n"
port = 5678
host = "${main_domain}"

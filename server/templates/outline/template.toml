id = "outline"
name = "Outline"
description = "Outline is a self-hosted knowledge base for team documentation."
category = "productivity"
tags = [
    "documentation",
    "knowledge-base",
    "self-hosted",
]
version = "0.82.0"
logo = "logo.png"
website = "https://getoutline.com/"
docs = "https://docs.getoutline.com/s/guide"
source = "https://github.com/outline/outline"
upstream = "Dokploy/templates@6313a2e blueprints/outline"

[variables]
client_secret = "${base64:32}"
dex_domain = "dex-${domain}"
main_domain = "${domain}"
postgres_password = "${password}"
secret_key = "${hash:64}"
utils_secret = "${base64:32}"

[config.env]
CLIENT_SECRET = "${client_secret}"
DEX_URL = "https://${dex_domain}"
DOMAIN_NAME = "${main_domain}"
POSTGRES_PASSWORD = "${postgres_password}"
SECRET_KEY = "${secret_key}"
URL = "https://${main_domain}"
UTILS_SECRET = "${utils_secret}"

[[config.domains]]
serviceName = "outline"
port = 3000
host = "${main_domain}"

[[config.domains]]
serviceName = "dex"
port = 5556
host = "${dex_domain}"

[[config.mounts]]
filePath = "/etc/dex/config.yaml"
content = """
issuer: https://${dex_domain}

web:
  http: 0.0.0.0:5556

storage:
  type: memory

enablePasswordDB: true

frontend:
   issuer: Outline

logger:
  level: debug

staticPasswords:
  - email: "admin@example.com"
    # bcrypt hash of the string "password": $(echo password | htpasswd -BinC 10 admin | cut -d: -f2)
    hash: "$2y$10$jsRWHw54uxTUIfhjgUrB9u8HSzPk7TUuQri9sXZrKzRXcScvwYor."
    username: "admin"
    userID: "1"


oauth2:
  skipApprovalScreen: true
  alwaysShowLoginScreen: false
  passwordConnector: local

staticClients:
  - id: "outline"
    redirectURIs:
      - https://${main_domain}/auth/oidc.callback
    name: "Outline"
    secret: "${client_secret}" 
"""

[[config.mounts]]
filePath = "/etc/nginx/conf.d/default.conf"
content = """
server {
  listen 5556;

  location = / {
    add_header Content-Type text/plain;
    return 200 "Dex ready
";
  }

  location / {
    proxy_pass http://dex-server:5556;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
"""

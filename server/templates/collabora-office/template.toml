id = "collabora-office"
name = "Collabora Office"
description = "Collabora Online is a powerful, flexible, and secure online office suite designed to break free from vendor lock-in and put you in full control of your documents."
category = "productivity"
tags = [
    "office",
    "documents",
    "collaboration",
]
version = "latest"
logo = "logo.svg"
website = "https://collaboraonline.com"
docs = "https://sdk.collaboraonline.com/docs"
source = "https://github.com/CollaboraOnline"
upstream = "Dokploy/templates@6313a2e blueprints/collabora-office"

[variables]
DOMAIN = "${domain}"
PASSWORD = "${password:16}"
USERNAME = "user"

[config.env]
DOMAIN = "${DOMAIN}"
PASSWORD = "${PASSWORD}"
USERNAME = "${USERNAME}"

[[config.domains]]
serviceName = "collabora"
port = 9980
host = "${domain}"

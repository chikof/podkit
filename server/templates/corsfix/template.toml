id = "corsfix"
name = "Corsfix"
description = "Corsfix is an open source CORS proxy platform for fetching APIs from browser applications, with origin and target allowlists, encrypted API secrets, response caching, and a management dashboard."
category = "networking"
tags = [
    "proxy",
    "developer-tools",
    "networking",
]
version = "8899bb15e71c7238285ccefc4c95a0cd47daeaf0"
logo = "logo.svg"
website = "https://corsfix.com"
docs = "https://corsfix.com/docs/open-source/self-hosting"
source = "https://github.com/corsfix/corsfix"
upstream = "Dokploy/templates@6313a2e blueprints/corsfix"

[variables]
app_domain = "${domain}"
auth_secret = "${base64:32}"
kek_version_1 = "${base64:32}"
mongodb_password = "${hash:64}"
proxy_domain = "${domain}"
redis_password = "${hash:64}"

[config.env]
ALLOWED_ORIGINS = ""
ALLOWED_TARGETS = ""
APP_DOMAIN = "${app_domain}"
AUTH_SECRET = "${auth_secret}"
AUTH_URL = "http://${app_domain}"
DISABLE_SIGNUP = "false"
KEK_VERSION_1 = "${kek_version_1}"
MONGODB_PASSWORD = "${mongodb_password}"
PROXY_DOMAIN = "${proxy_domain}"
REDIS_PASSWORD = "${redis_password}"
RPM = "180"

[[config.domains]]
serviceName = "corsfix"
port = 3000
host = "${app_domain}"

[[config.domains]]
serviceName = "corsfix-proxy"
port = 80
host = "${proxy_domain}"

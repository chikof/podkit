id = "databasement"
name = "Databasement"
description = "Self-hosted database backup manager with a web UI. Schedule, backup, and restore MySQL, PostgreSQL, MariaDB, Microsoft SQL Server, MongoDB, SQLite, Firebird and Redis to S3, SFTP, Samba or local storage. SSH tunnel support."
category = "backup"
tags = [
    "backup",
    "database",
    "mysql",
    "postgres",
    "mongodb",
]
version = "1.8.4"
logo = "logo.png"
website = "https://david-crty.github.io/databasement/"
docs = "https://david-crty.github.io/databasement/self-hosting/docker"
source = "https://github.com/David-Crty/databasement"
upstream = "Dokploy/templates@6313a2e blueprints/databasement"

[variables]
app_key = "${base64:32}"
main_domain = "${domain}"
timezone = "UTC"

[config.env]
APP_DISPLAY_TIMEZONE = "${timezone}"
APP_KEY = "base64:${app_key}"
APP_URL = "https://${main_domain}"
DB_CONNECTION = "sqlite"
DB_DATABASE = "/data/database.sqlite"
ENABLE_QUEUE_WORKER = "true"
LOG_CHANNEL = "stderr"
TRUSTED_PROXIES = "*"

[[config.domains]]
serviceName = "databasement"
port = 2226
host = "${main_domain}"

id = "grist"
name = "Grist"
description = "Grist is an open-source spreadsheet and database alternative that combines the flexibility of spreadsheets with the power of databases."
category = "database"
tags = [
    "spreadsheet",
    "database",
    "productivity",
    "self-hosted",
    "data-management",
]
version = "latest"
logo = "logo.png"
website = "https://www.getgrist.com/"
docs = "https://support.getgrist.com/self-managed/"
source = "https://github.com/gristlabs/grist-core"
upstream = "Dokploy/templates@6313a2e blueprints/grist"

[variables]
default_email = "${email}"
main_domain = "${domain}"

[config.env]
GRIST_DEFAULT_EMAIL = "${default_email}"

[[config.domains]]
serviceName = "grist"
port = 8484
host = "${main_domain}"

id = "vault"
name = "Vault"
description = "Vault is HashiCorp's tool for securely storing and managing secrets and encryption keys."
category = "security"
tags = [
    "security",
    "secrets",
    "devops",
    "infrastructure",
]
version = "2.0.3"
logo = "logo.svg"
website = "https://www.vaultproject.io/"
docs = "https://developer.hashicorp.com/vault/docs"
source = "https://github.com/hashicorp/vault"
upstream = "Dokploy/templates@6313a2e blueprints/vault"

[variables]
main_domain = "${domain}"
root_token = "${password:32}"

[config.env]
VAULT_DEV_LISTEN_ADDRESS = "0.0.0.0:8200"
VAULT_DEV_ROOT_TOKEN_ID = "${root_token}"

[[config.domains]]
serviceName = "vault"
port = 8200
host = "${main_domain}"

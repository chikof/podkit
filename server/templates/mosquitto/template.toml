id = "mosquitto"
name = "Eclipse Mosquitto"
description = "A lightweight, open-source MQTT broker for IoT and home automation with persistent messaging and WebSocket support."
category = "other"
tags = [
    "broker",
    "iot",
    "mqtt",
]
version = "2.1.2"
logo = "logo.svg"
website = "https://mosquitto.org/"
docs = "https://mosquitto.org/documentation/"
source = "https://github.com/eclipse-mosquitto/mosquitto"
upstream = "Dokploy/templates@6313a2e blueprints/mosquitto"

[variables]
broker_domain = "${domain}"
mqtt_password = "${password:32}"
mqtt_username = "mqtt"

[config.env]
MQTT_DOMAIN = "${broker_domain}"
MQTT_PASSWORD = "${mqtt_password}"
MQTT_USERNAME = "${mqtt_username}"

[[config.domains]]
serviceName = "mosquitto"
port = 9001
host = "${broker_domain}"

[[config.mounts]]
filePath = "mosquitto.conf"
content = """
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/data/passwordfile
"""

id = "i18n-blog"
name = "i18n Blog (Kuno)"
description = "Kuno is an internationalized blogging platform with a backend built in Go and a frontend in Next.js."
category = "cms"
tags = [
    "blog",
    "i18n",
    "nextjs",
    "go",
    "web",
]
version = "latest"
logo = "@mono-i18n-blog"
website = "https://qut.edu.kg/"
docs = "https://github.com/xuemian168/kuno#readme"
source = "https://github.com/xuemian168/kuno"
upstream = "Dokploy/templates@6313a2e blueprints/i18n-blog"

[variables]
jwt_secret = "${password:32}"
main_domain = "${domain}"
recovery_mode = "false"

[config.env]
DB_PATH = "/app/data/blog.db"
GIN_MODE = "release"
JWT_SECRET = "${jwt_secret}"
NEXT_PUBLIC_API_URL = "https://${main_domain}/api"
NODE_ENV = "production"
RECOVERY_MODE = "${recovery_mode}"
UPLOAD_DIR = "/app/data/uploads"

[[config.domains]]
serviceName = "kuno"
port = 80
host = "${main_domain}"

id = "akaunting"
name = "Akaunting"
description = "Akaunting is a self-hosted, open-source accounting app for small businesses."
category = "finance"
tags = [
    "finance",
    "accounting",
    "php",
    "mariadb",
    "self-hosted",
]
version = "latest"
logo = "logo.png"
website = "https://akaunting.com"
docs = "https://akaunting.com/docs"
source = "https://github.com/akaunting/akaunting"
upstream = "Dokploy/templates@6313a2e blueprints/akaunting"
reveal = ["admin_password"]

[variables]
admin_email = "${email}"
admin_password = "${password:24}"
company_email = "${email}"
company_name = "My Company"
db_name = "akaunting"
db_prefix = "${hash:3}_"
db_user = "admin"
locale = "en-US"
main_domain = "${domain}"
mysql_password = "${password:24}"

[config.env]
ADMIN_EMAIL = "${admin_email}"
ADMIN_PASSWORD = "${admin_password}"
APP_URL = "${main_domain}"
COMPANY_EMAIL = "${company_email}"
COMPANY_NAME = "${company_name}"
DB_HOST = "akaunting-db"
DB_NAME = "${db_name}"
DB_PASSWORD = "${mysql_password}"
DB_PORT = "3306"
DB_PREFIX = "${db_prefix}"
DB_USERNAME = "${db_user}"
LOCALE = "${locale}"
MYSQL_DATABASE = "${db_name}"
MYSQL_PASSWORD = "${mysql_password}"
MYSQL_RANDOM_ROOT_PASSWORD = "yes"
MYSQL_USER = "${db_user}"

[[config.domains]]
serviceName = "akaunting"
port = 80
host = "${main_domain}"

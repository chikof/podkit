id = "velix-api"
name = "Velix API"
description = "Self-hosted WhatsApp API with multi-instance support, webhooks, n8n node, and Chatwoot integration."
category = "communication"
tags = [
    "whatsapp",
    "api",
    "messaging",
    "chatbot",
    "automation",
]
version = "1.1.0"
logo = "logo.svg"
website = "https://velix.dev"
docs = "https://github.com/paulolinder/velix-api#readme"
source = "https://github.com/paulolinder/velix-api"
upstream = "Dokploy/templates@6313a2e blueprints/velix-api"

[variables]
DB_PASSWORD = "${password:32}"
JWT_SECRET = "${password:64}"
main_domain = "${domain}"

[config.env]
DB_PASSWORD = "${DB_PASSWORD}"
JWT_SECRET = "${JWT_SECRET}"

[[config.domains]]
serviceName = "velix-api"
port = 8080
host = "${main_domain}"

id = "photoprism"
name = "Photoprism"
description = "PhotoPrism is an AI-powered app for browsing, organizing, and sharing your photo library."
category = "media"
tags = [
    "media",
    "photos",
    "self-hosted",
]
version = "latest"
logo = "logo.svg"
website = "https://www.photoprism.app/"
docs = "https://docs.photoprism.app/"
source = "https://github.com/photoprism/photoprism"
upstream = "Dokploy/templates@6313a2e blueprints/photoprism"
reveal = ["admin_password"]

[variables]
admin_password = "${password}"
main_domain = "${domain}"

[config.env]
ADMIN_PASSWORD = "${admin_password}"
BASE_URL = "http://${main_domain}"

[[config.domains]]
serviceName = "photoprism"
port = 2342
host = "${main_domain}"

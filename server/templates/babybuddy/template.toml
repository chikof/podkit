id = "babybuddy"
name = "BabyBuddy"
description = "BabyBuddy is a comprehensive, user-friendly platform designed to help parents and caregivers manage essential details about their child's growth and development. It provides tools for tracking feedings, sleep schedules, diaper changes, and milestones."
category = "other"
tags = [
    "parenting",
    "tracking",
    "family",
]
version = "2.7.0"
logo = "logo.png"
website = "https://babybuddy.app"
docs = "https://docs.baby-buddy.net/"
source = "https://github.com/babybuddy/babybuddy"
upstream = "Dokploy/templates@6313a2e blueprints/babybuddy"

[variables]
main_domain = "${domain}"
secret_key = "${password:32}"
time_zone = "America/New_York"

[config.env]
DOMAIN = "${main_domain}"
SECRET_KEY = "${secret_key}"
TIME_ZONE = "${time_zone}"

[[config.domains]]
serviceName = "babybuddy"
port = 8000
host = "${main_domain}"

id = "docmost"
name = "Docmost"
description = "Docmost is a collaborative wiki and documentation tool."
category = "other"
tags = [
    "self-hosted",
    "open-source",
    "manager",
]
version = "0.4.1"
logo = "logo.png"
website = "https://docmost.com/"
docs = "https://docmost.com/docs/"
source = "https://github.com/docmost/docmost"
upstream = "Dokploy/templates@6313a2e blueprints/docmost"

[variables]
app_secret = "${password}"
main_domain = "${domain}"
postgres_password = "${password}"

[config.env]
APP_SECRET = "${app_secret}"
APP_URL = "http://${main_domain}:3000"
POSTGRES_DB = "docmost"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_USER = "docmost"

[[config.domains]]
serviceName = "docmost"
port = 3000
host = "${main_domain}"

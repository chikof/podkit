id = "ponos"
name = "Ponos"
description = "A harness around Claude Code that runs your tasks — code or not — from Notion or its own board: a ticket comes back as a pull request on GitHub, a text, an action carried out or a post, and nothing ships until you say yes. Web console, Telegram and Slack."
category = "ai"
tags = [
    "ai",
    "ai-agent",
    "automation",
    "claude",
    "developer-tools",
    "notion",
    "github",
]
version = "0.2.0"
logo = "logo.svg"
website = "https://the-ponos.app/"
docs = "https://github.com/hermez-agency/ponos/blob/main/guide/server.md#install-with-dokploy"
source = "https://github.com/hermez-agency/ponos"
upstream = "Dokploy/templates@6313a2e blueprints/ponos"
reveal = ["admin_password"]

[variables]
admin_password = "${password:32}"
api_token = "${password:48}"
main_domain = "${domain}"

[config.env]
ANTHROPIC_API_KEY = ""
CLAUDE_CODE_OAUTH_TOKEN = ""
GH_TOKEN = ""
OPENROUTER_API_KEY = ""
PONOS_LANGUAGE = "en"
PONOS_NOTION_TOKEN = ""
PONOS_SLACK_TOKEN = ""
PONOS_TELEGRAM_TOKEN = ""
PONOS_WEB_EMAIL = "admin@${main_domain}"
PONOS_WEB_PASSWORD = "${admin_password}"
PONOS_WEB_TOKEN = "${api_token}"
TZ = "UTC"

[[config.domains]]
serviceName = "ponos"
port = 8787
host = "${main_domain}"

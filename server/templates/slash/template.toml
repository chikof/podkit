id = "slash"
name = "Slash"
description = "Slash is a modern, self-hosted bookmarking service and link shortener that helps you organize and share your favorite links."
category = "productivity"
tags = [
    "bookmarks",
    "link-shortener",
    "self-hosted",
]
version = "latest"
logo = "logo.png"
website = "https://github.com/yourselfhosted/slash#readme"
docs = "https://github.com/yourselfhosted/slash/wiki"
source = "https://github.com/yourselfhosted/slash"
upstream = "Dokploy/templates@6313a2e blueprints/slash"

[variables]
db_name = "slash"
db_password = "${password}"
db_user = "slash"
main_domain = "${domain}"

[config.env]
DB_NAME = "${db_name}"
DB_PASSWORD = "${db_password}"
DB_USER = "${db_user}"

[[config.domains]]
serviceName = "slash-app"
port = 5231
host = "${main_domain}"

id = "hyperdx"
name = "HyperDX"
description = "HyperDX searches and visualizes logs, traces, metrics, and session replays. Includes ClickHouse, MongoDB, and the ClickStack OpenTelemetry collector."
category = "monitoring"
tags = [
    "monitoring",
    "logging",
    "observability",
]
version = "2.38.0"
logo = "logo.svg"
website = "https://hyperdx.io/"
docs = "https://clickhouse.com/docs/use-cases/observability/clickstack"
source = "https://github.com/hyperdxio/hyperdx"
upstream = "Dokploy/templates@6313a2e blueprints/hyperdx"

[variables]
clickhouse_password = "${password:32}"
main_domain = "${domain}"
session_secret = "${password:64}"

[config.env]
CLICKHOUSE_PASSWORD = "${clickhouse_password}"
HYPERDX_URL = "http://${main_domain}"
SESSION_SECRET = "${session_secret}"

[[config.domains]]
serviceName = "hyperdx"
port = 8080
host = "${main_domain}"

[[config.mounts]]
filePath = "clickhouse-config.xml"
content = """
<clickhouse>
  <logger>
    <level>warning</level>
  </logger>
  <custom_settings_prefixes>hyperdx</custom_settings_prefixes>
  <max_server_memory_usage>2147483648</max_server_memory_usage>
  <mark_cache_size>134217728</mark_cache_size>
  <uncompressed_cache_size>67108864</uncompressed_cache_size>
</clickhouse>
"""

id = "evershop"
name = "Evershop"
description = "Your All-in-One open source ecommerce solution."
category = "other"
tags = [
    "e-commerce",
    "shopping",
]
version = "latest"
logo = "@mono-evershop"
website = "https://evershop.io/"
docs = "https://evershop.io/docs/development/getting-started/introduction"
source = "https://github.com/evershopcommerce/evershop"
upstream = "Dokploy/templates@6313a2e blueprints/evershop"

[variables]
db_name = "evershop"
db_password = "postgres"
db_port = "5432"
db_user = "postgres"
main_domain = "${domain}"

[config.env]
DB_NAME = "${db_name}"
DB_PASSWORD = "${db_password}"
DB_PORT = "${db_port}"
DB_USER = "${db_user}"

[[config.domains]]
serviceName = "evershop-app"
port = 3000
host = "${main_domain}"

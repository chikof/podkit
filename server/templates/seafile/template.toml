id = "seafile"
name = "Seafile"
description = "Seafile is an open-source file sync and sharing platform."
category = "storage"
tags = [
    "file-manager",
    "file-sharing",
    "storage",
]
version = "14.0.9"
logo = "logo.svg"
website = "https://seafile.com"
docs = "https://manual.seafile.com/14.0"
source = "https://github.com/haiwen/seafile"
upstream = "Dokploy/templates@6313a2e blueprints/seafile"
reveal = ["admin_password"]

[variables]
admin_password = "${password:32}"
jwt_private_key = "${password:32}"
main_domain = "${domain}"
mysql_root_password = "${password:32}"
mysql_user_password = "${password:32}"
redis_password = "${password:32}"

[config.env]
CACHE_PROVIDER = "redis"
ENABLE_GO_FILESERVER = "true"
ENABLE_SEADOC = "true"
ENABLE_SEAFDAV = "false"
INIT_SEAFILE_ADMIN_EMAIL = "admin@example.com"
INIT_SEAFILE_ADMIN_PASSWORD = "${admin_password}"
INIT_SEAFILE_MYSQL_ROOT_PASSWORD = "${mysql_root_password}"
JWT_PRIVATE_KEY = "${jwt_private_key}"
REDIS_HOST = "redis"
REDIS_PASSWORD = "${redis_password}"
REDIS_PORT = "6379"
SEADOC_SERVER_URL = "https://${main_domain}/sdoc-server"
SEAFDAV_WORKERS = "5"
SEAFILE_MYSQL_DB_HOST = "seafile-db"
SEAFILE_MYSQL_DB_PASSWORD = "${mysql_user_password}"
SEAFILE_MYSQL_DB_USER = "seafile"
SEAFILE_SERVER_HOSTNAME = "${main_domain}"
SEAFILE_SERVER_PROTOCOL = "https"
TIME_ZONE = "Etc/UTC"

[[config.domains]]
serviceName = "seafile"
port = 80
host = "${main_domain}"

id = "budget-board"
name = "Budget Board"
description = "Self-hosted budgeting app with a web UI and a server backed by PostgreSQL."
category = "finance"
tags = [
    "finance",
    "postgres",
    "self-hosted",
    "docker",
    "compose",
]
version = "release"
logo = "logo.png"
website = "https://budgetboard.net/"
docs = "https://budgetboard.net/"
source = "https://github.com/teelur/budget-board"
upstream = "Dokploy/templates@6313a2e blueprints/budget-board"

[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"

[config.env]
POSTGRES_PASSWORD = "${postgres_password}"

[[config.domains]]
serviceName = "budget-board-client"
port = 6253
host = "${main_domain}"
path = "/"

id = "etherpad"
name = "Etherpad"
description = "Etherpad is a real-time collaborative text editor that allows multiple users to edit documents simultaneously."
category = "productivity"
tags = [
    "collaboration",
    "text-editor",
    "real-time",
]
version = "latest"
logo = "logo.png"
website = "https://etherpad.org/"
docs = "https://github.com/ether/etherpad-lite/wiki"
source = "https://github.com/ether/etherpad-lite"
upstream = "Dokploy/templates@6313a2e blueprints/etherpad"
reveal = ["admin_password"]

[variables]
admin_password = "${password:32}"
main_domain = "${domain}"
postgres_password = "${password:32}"

[config.env]
ADMIN_PASSWORD = "${admin_password}"
DB_CHARSET = "utf8mb4"
DB_HOST = "postgres"
DB_NAME = "etherpad"
DB_PASS = "${postgres_password}"
DB_PORT = "5432"
DB_TYPE = "postgres"
DB_USER = "admin"
DEFAULT_PAD_TEXT = " "
DISABLE_IP_LOGGING = "false"
NODE_ENV = "production"
POSTGRES_DB = "etherpad"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_USER = "admin"
SOFFICE = "null"
TRUST_PROXY = "true"

[[config.domains]]
serviceName = "app"
port = 9001
host = "${main_domain}"

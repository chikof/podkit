id = "didacta"
name = "Didacta"
description = "Didacta is a fair-code, self-hosted learning platform (LMS) with multi-tenant isolation, a public course catalog, enrollment flows, gamification and a module marketplace."
category = "other"
tags = [
    "education",
    "lms",
    "elearning",
    "courses",
]
version = "0.0.1-alpha.107"
logo = "@mono-didacta"
website = "https://didacta.io"
docs = "https://docs.didacta.io"
source = "https://github.com/va360labs/didacta-io"
upstream = "Dokploy/templates@6313a2e blueprints/didacta"

[variables]
auth_secret = "${password:64}"
main_domain = "${domain}"
postgres_password = "${password:32}"
setup_token = "${password:32}"

[config.env]
ADMIN_DATABASE_URL = "postgresql://didacta:${postgres_password}@postgres:5432/didacta?schema=public"
API_PORT = "4000"
AUTH_SECRET = "${auth_secret}"
DIDACTA_CORE_VERSION = "0.0.1-alpha.107"
DIDACTA_LICENSE_KEY = ""
DIDACTA_SETUP_TOKEN = "${setup_token}"
NODE_ENV = "production"
POSTGRES_DB = "didacta"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_USER = "didacta"
REDIS_URL = "redis://redis:6379"
SMTP_FROM = ""
SMTP_HOST = ""
SMTP_PASS = ""
SMTP_PORT = "587"
SMTP_SECURE = "false"
SMTP_USER = ""
STORAGE_DRIVER = "local"
STORAGE_ROOT = "/app/data/storage"
WEB_PORT = "3000"
WEB_PUBLIC_ALLOWED_HOSTS = "${main_domain}"
WEB_PUBLIC_URL = "https://${main_domain}"

[[config.domains]]
serviceName = "didacta"
port = 3000
host = "${main_domain}"

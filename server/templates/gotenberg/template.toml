id = "gotenberg"
name = "Gotenberg"
description = "Gotenberg is a Docker-powered stateless API for PDF files."
category = "development"
tags = [
    "api",
    "backend",
    "pdf",
    "tools",
]
version = "latest"
logo = "@mono-gotenberg"
website = "https://gotenberg.dev"
docs = "https://gotenberg.dev/docs/getting-started/introduction"
source = "https://github.com/gotenberg/gotenberg"
upstream = "Dokploy/templates@6313a2e blueprints/gotenberg"

[variables]
main_domain = "${domain}"
password = "changethis"
username = "gotenberg"

[config.env]
GOTENBERG_API_BASIC_AUTH_PASSWORD = "${password}"
GOTENBERG_API_BASIC_AUTH_USERNAME = "${username}"

[[config.domains]]
serviceName = "gotenberg"
port = 3000
host = "${main_domain}"

id = "networking-toolbox"
name = "Networking Toolbox"
description = "A collection of handy networking utilities by Lissy93, packaged as a self-hostable web app."
category = "networking"
tags = [
    "networking",
    "tools",
    "utilities",
    "web",
]
version = "latest"
logo = "@networking-toolbox"
website = "https://networkingtoolbox.net"
docs = "https://github.com/lissy93/networking-toolbox#readme"
source = "https://github.com/lissy93/networking-toolbox"
upstream = "Dokploy/templates@6313a2e blueprints/networking-toolbox"

[variables]
main_domain = "${domain}"

[config.env]
HOST = "0.0.0.0"
NODE_ENV = "production"
PORT = "3000"

[[config.domains]]
serviceName = "app"
port = 3000
host = "${main_domain}"

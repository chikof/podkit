id = "open-webui"
name = "Open WebUI"
description = "Open WebUI is an OpenSource ChatGPT-style chat interface for running AI models."
category = "communication"
tags = ["chat"]
version = "v0.3.7"
logo = "logo.png"
website = "https://openwebui.com/"
docs = "https://docs.openwebui.com/"
source = "https://github.com/open-webui/open-webui"
upstream = "Dokploy/templates@6313a2e blueprints/open-webui"

[variables]
main_domain = "${domain}"
webui_secret_key = "${password:32}"

[config.env]
webui_secret_key = "${webui_secret_key}"

[[config.domains]]
serviceName = "open-webui"
port = 8080
host = "${main_domain}"

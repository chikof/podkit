id = "domain-locker"
name = "Domain Locker"
description = "Domain Locker is an open-source tool for tracking domain expirations and sending renewal reminders."
category = "monitoring"
tags = [
    "domains",
    "monitoring",
    "utilities",
    "postgres",
]
version = "latest"
logo = "logo.png"
website = "https://domain-locker.com/"
docs = "https://github.com/Lissy93/domain-locker#readme"
source = "https://github.com/Lissy93/domain-locker"
upstream = "Dokploy/templates@6313a2e blueprints/domain-locker"

[variables]
main_domain = "${domain}"
pg_password = "${password:32}"

[config.env]
DL_ENV_TYPE = "selfHosted"
DL_PG_HOST = "postgres"
DL_PG_NAME = "domain_locker"
DL_PG_PASSWORD = "${pg_password}"
DL_PG_PORT = "5432"
DL_PG_USER = "postgres"
NODE_ENV = "production"

[[config.domains]]
serviceName = "app"
port = 3000
host = "${main_domain}"

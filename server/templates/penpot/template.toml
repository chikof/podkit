id = "penpot"
name = "Penpot"
description = "Penpot is the web-based open-source design tool that bridges the gap between designers and developers."
category = "productivity"
tags = [
    "design",
    "collaboration",
]
version = "2.3.2"
logo = "logo.svg"
website = "https://penpot.app/"
docs = "https://docs.penpot.app/"
source = "https://github.com/penpot/penpot"
upstream = "Dokploy/templates@6313a2e blueprints/penpot"

[variables]
main_domain = "${domain}"

[config.env]
DOMAIN_NAME = "${main_domain}"

[[config.domains]]
serviceName = "penpot-frontend"
port = 8080
host = "${main_domain}"

id = "obsidian-livesync"
name = "Obsidian LiveSync"
description = "Obsidian LiveSync with CouchDB for real-time note synchronization."
category = "database"
tags = [
    "database",
    "sync",
    "obsidian",
]
version = "latest"
logo = "@mono-obsidian-livesync"
website = "https://obsidian.md/sync"
docs = "https://docs.couchdb.apache.org/"
source = "https://github.com/vrtmrz/obsidian-livesync"
upstream = "Dokploy/templates@6313a2e blueprints/obsidian-livesync"

[variables]
COUCHDB_PASSWORD = "${password:32}"
COUCHDB_USER = "${username}"
main_domain = "${domain}"

[config.env]
COUCHDB_PASSWORD = "${COUCHDB_PASSWORD}"
COUCHDB_USER = "${COUCHDB_USER}"

[[config.domains]]
serviceName = "couchdb"
port = 5984
host = "${main_domain}"

[[config.mounts]]
filePath = "local.ini"
content = """
[couchdb]
single_node = true
max_document_size = 50000000

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[chttpd]
bind_address = 0.0.0.0
enable_cors = true
require_valid_user = true
max_http_request_size = 4294967296

[cors]
credentials = true
origins = app://obsidian.md,capacitor://localhost,http://localhost,
"""

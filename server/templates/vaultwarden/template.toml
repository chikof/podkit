id = "vaultwarden"
name = "Vaultwarden"
description = "Vaultwarden is a lightweight password manager that works with Bitwarden apps."
category = "other"
tags = ["open-source"]
version = "1.37.5"
logo = "logo.svg"
website = ""
docs = "https://github.com/dani-garcia/vaultwarden/wiki"
source = "https://github.com/dani-garcia/vaultwarden"
upstream = "Dokploy/templates@6313a2e blueprints/vaultwarden"

[variables]
main_domain = "${domain}"

[config.env]
DOMAIN = "https://${main_domain}"
SIGNUPS_ALLOWED = "true"

[[config.domains]]
serviceName = "vaultwarden"
port = 80
host = "${main_domain}"

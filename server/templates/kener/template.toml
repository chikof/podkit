id = "kener"
name = "Kener"
description = "Kener is an open-source status page system for monitoring and alerting. It provides a modern interface for tracking service uptime and sending notifications."
category = "monitoring"
tags = [
    "monitoring",
    "status-page",
    "alerting",
    "self-hosted",
]
version = "4.1.1"
logo = "logo.png"
website = "https://kener.ing/"
docs = "https://kener.ing/docs/"
source = "https://github.com/rajnandan1/kener"
upstream = "Dokploy/templates@6313a2e blueprints/kener"

[variables]
KENER_SECRET_KEY = "${password:64}"
main_domain = "${domain}"

[config.env]
DATABASE_URL = "sqlite://./database/kener.sqlite.db"
KENER_SECRET_KEY = "${KENER_SECRET_KEY}"
ORIGIN = "http://localhost:3000"
REDIS_URL = "redis://redis:6379"
RESEND_API_KEY = ""
RESEND_SENDER_EMAIL = ""
TZ = "Etc/UTC"

[[config.domains]]
serviceName = "kener"
port = 3000
host = "${main_domain}"

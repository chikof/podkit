id = "victoriametrics"
name = "VictoriaMetrics"
description = "VictoriaMetrics is a fast, cost-effective, and scalable monitoring solution and time series database. It is a drop-in replacement for Prometheus."
category = "monitoring"
tags = [
    "monitoring",
    "metrics",
    "time-series",
    "prometheus",
]
version = "v1.108.1"
logo = "logo.png"
website = "https://victoriametrics.com/"
docs = "https://docs.victoriametrics.com/"
source = "https://github.com/VictoriaMetrics/VictoriaMetrics"
upstream = "Dokploy/templates@6313a2e blueprints/victoriametrics"

[variables]
main_domain = "${domain}"
retention_period = "90d"

[config.env]
RETENTION_PERIOD = "${retention_period}"

[[config.domains]]
serviceName = "victoriametrics"
port = 8428
host = "${main_domain}"

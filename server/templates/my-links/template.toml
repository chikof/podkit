id = "my-links"
name = "MyLinks"
description = "Self-hostable bookmark manager to organize, search and share your favorite links."
category = "productivity"
tags = [
    "bookmarks",
    "link-sharing",
]
version = "5.3.0"
logo = "logo.svg"
website = "https://www.mylinks.app"
docs = "https://docs.mylinks.app"
source = "https://github.com/my-links/my-links"
upstream = "Dokploy/templates@6313a2e blueprints/my-links"

[variables]
app_key = "${base64:32}"
db_password = "${password}"
main_domain = "${domain}"

[config.env]
APP_KEY = "${app_key}"
APP_URL = "http://${main_domain}"
DB_PASSWORD = "${db_password}"

[[config.domains]]
serviceName = "my-links"
port = 3333
host = "${main_domain}"

id = "dumbpad"
name = "DumbPad"
description = "DumbPad is a simple, self-hosted notepad service with PIN protection and no database required."
category = "other"
tags = [
    "notepad",
    "self-hosted",
    "simple",
]
version = "latest"
logo = "logo.svg"
website = "https://dumbware.io/DumbPad/"
docs = "https://github.com/dumbwareio/dumbpad"
source = "https://github.com/dumbwareio/dumbpad"
upstream = "Dokploy/templates@6313a2e blueprints/dumbpad"

[variables]
main_domain = "${domain}"

[config.env]
BASE_URL = "https://${main_domain}"
COOKIE_MAX_AGE = "24"
DUMBPAD_PIN = ""
LOCKOUT_TIME = "15"
MAX_ATTEMPTS = "5"
NODE_ENV = "production"
PAGE_HISTORY_COOKIE_AGE = "365"
SITE_TITLE = "DumbPad"

[[config.domains]]
serviceName = "dumbpad"
port = 3000
host = "${main_domain}"

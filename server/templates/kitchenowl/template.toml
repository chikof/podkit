id = "kitchenowl"
name = "KitchenOwl"
description = "KitchenOwl is a self-hosted grocery list and recipe manager."
category = "other"
tags = [
    "self-hosted",
    "recipes",
    "grocery",
    "personal",
]
version = "v0.7.1"
logo = "logo.png"
website = "https://kitchenowl.org/"
docs = "https://github.com/TomBursch/kitchenowl/wiki"
source = "https://github.com/TomBursch/kitchenowl"
upstream = "Dokploy/templates@6313a2e blueprints/kitchenowl"

[variables]
app_password = "${password:32}"
db_name = "kitchenowl"
db_password = "${password:24}"
db_user = "kitchenowl"
main_domain = "${domain}"

[config.env]
DB_DRIVER = "postgresql"
DB_HOST = "db"
DB_NAME = "${db_name}"
DB_PASSWORD = "${db_password}"
DB_USER = "${db_user}"
JWT_SECRET_KEY = "${app_password}"

[[config.domains]]
serviceName = "web"
port = 8080
host = "${main_domain}"

id = "otterwiki"
name = "Otter Wiki"
description = "An Otter Wiki is a simple, lightweight, and fast wiki engine built with Python and Flask. It provides a user-friendly interface for creating and managing wiki content with markdown support."
category = "productivity"
tags = [
    "wiki",
    "documentation",
    "knowledge-base",
    "markdown",
]
version = "2"
logo = "logo.png"
website = "https://otterwiki.com/"
docs = "https://github.com/redimp/otterwiki/wiki"
source = "https://github.com/redimp/otterwiki"
upstream = "Dokploy/templates@6313a2e blueprints/otterwiki"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "otterwiki"
port = 80
host = "${main_domain}"

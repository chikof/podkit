id = "senddock"
name = "SendDock"
description = "Open-source, self-hosted email marketing platform with BYO SMTP. Manage subscribers, templates, broadcasts, and scheduled campaigns from one place."
category = "communication"
tags = [
    "email",
    "newsletter",
    "mailing-list",
    "marketing",
]
version = "0.8.3"
logo = "logo.svg"
website = "https://senddock.dev"
docs = "https://docs.senddock.dev"
source = "https://github.com/SendDock/senddock"
upstream = "Dokploy/templates@6313a2e blueprints/senddock"

[variables]
jwt_secret = "${password:64}"
main_domain = "${domain}"
postgres_password = "${password:32}"

[config.env]
JWT_SECRET = "${jwt_secret}"
POSTGRES_PASSWORD = "${postgres_password}"
PUBLIC_URL = "https://${main_domain}"

[[config.domains]]
serviceName = "senddock"
port = 8080
host = "${main_domain}"

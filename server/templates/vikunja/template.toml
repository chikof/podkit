id = "vikunja"
name = "Vikunja"
description = "Vikunja is an open-source to-do list and task management app."
category = "productivity"
tags = [
    "productivity",
    "tasks",
    "self-hosted",
    "project-management",
]
version = "0.23.0"
logo = "logo.png"
website = "https://vikunja.io/"
docs = "https://vikunja.io/docs/"
source = "https://github.com/go-vikunja/vikunja"
upstream = "Dokploy/templates@6313a2e blueprints/vikunja"

[variables]
db_password = "${password:32}"
jwt_secret = "${jwt:db_password}"
main_domain = "${domain}"

[config.env]
VIKUNJA_DATABASE_DATABASE = "vikunja"
VIKUNJA_DATABASE_HOST = "db"
VIKUNJA_DATABASE_PASSWORD = "${db_password}"
VIKUNJA_DATABASE_TYPE = "postgres"
VIKUNJA_DATABASE_USER = "vikunja"
VIKUNJA_SERVICE_JWTSECRET = "${jwt_secret}"
VIKUNJA_SERVICE_PUBLICURL = "https://${main_domain}"

[[config.domains]]
serviceName = "vikunja"
port = 3456
host = "${main_domain}"

id = "evolutiongo"
name = "Evolution GO"
description = "Evolution Go is a high-performance implementation of the WhatsApp API, written in Go. Built with Go’s standard library and modern development practices, it provides a robust and efficient solution for WhatsApp integration using the whatsmeow library."
category = "development"
tags = [
    "api",
    "whatsapp",
    "messaging",
]
version = "latest"
logo = "logo.png"
website = "https://docs.evolutionfoundation.com.br/evolution-go"
docs = "https://docs.evolutionfoundation.com.br/evolution-go"
source = "https://github.com/evolution-foundation/evolution-go"
upstream = "Dokploy/templates@6313a2e blueprints/evolutiongo"

[variables]
api_key = "${base64:64}"
main_domain = "${domain}"
postgres_password = "${password}"

[config.env]
AUTHENTICATION_API_KEY = "${api_key}"
CLIENT_NAME = "Evolution"
DATABASE_CONNECTION_URI = "postgres://postgresql:${postgres_password}@evolution-postgres:5432"
DATABASE_SAVE_MESSAGES = "false"
LOGTYPE = "console"
POSTGRES_DATABASE = "evolution"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_USERNAME = "postgresql"
SERVER_PORT = "8080"
SERVER_URL = "https://${main_domain}"
WADEBUG = "INFO"

[[config.domains]]
serviceName = "evolution-gateway"
port = 80
host = "${main_domain}"

[[config.mounts]]
filePath = "gateway.conf"
content = """
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 100m;

    # Evolution GO has no route on "/" (and the API answers 503 until the
    # license is activated), so send visitors to the bundled manager UI.
    location = / {
        return 302 /manager/login;
    }

    location / {
        proxy_pass http://evolution-go:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
"""

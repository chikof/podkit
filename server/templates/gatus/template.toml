id = "gatus"
name = "Gatus"
description = "Gatus is an automated service health dashboard for monitoring HTTP, DNS, TCP, ICMP, and other endpoints."
category = "monitoring"
tags = [
    "monitoring",
    "status-page",
    "uptime",
    "observability",
]
version = "v5.36.0"
logo = "logo.svg"
website = "https://gatus.io/"
docs = "https://github.com/TwiN/gatus#configuration"
source = "https://github.com/TwiN/gatus"
upstream = "Dokploy/templates@6313a2e blueprints/gatus"

[variables]
main_domain = "${domain}"
monitor_name = "Example website"
monitor_url = "https://example.org/"

[[config.domains]]
serviceName = "gatus"
port = 8080
host = "${main_domain}"

[[config.mounts]]
filePath = "config.yaml"
content = """
storage:
  type: sqlite
  path: /data/data.db

ui:
  title: Gatus
  header: Gatus

endpoints:
  - name: ${monitor_name}
    group: external
    url: "${monitor_url}"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"
"""

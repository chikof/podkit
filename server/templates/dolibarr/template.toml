id = "dolibarr"
name = "Dolibarr"
description = "Dolibarr ERP & CRM is a modern software package that helps manage your organization's activities (contacts, quotes, invoices, orders, stocks, agenda, human resources, ecm, manufacturing)."
category = "productivity"
tags = [
    "erp",
    "crm",
    "business",
    "management",
    "invoicing",
]
version = "21.0.0"
logo = "logo.svg"
website = "https://www.dolibarr.org/"
docs = "https://wiki.dolibarr.org/"
source = "https://github.com/Dolibarr/dolibarr"
upstream = "Dokploy/templates@6313a2e blueprints/dolibarr"
reveal = ["admin_password"]

[variables]
admin_password = "${password:32}"
db_name = "dolibarr"
db_password = "${password:32}"
db_root_password = "${password:32}"
db_user = "dolibarr"
main_domain = "${domain}"

[config.env]
ADMIN_PASSWORD = "${admin_password}"
DB_NAME = "${db_name}"
DB_PASSWORD = "${db_password}"
DB_ROOT_PASSWORD = "${db_root_password}"
DB_USER = "${db_user}"
DOLIBARR_HOST = "${main_domain}"

[[config.domains]]
serviceName = "dolibarr"
port = 80
host = "${main_domain}"

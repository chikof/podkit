id = "drawnix"
name = "Drawnix"
description = "Drawnix is an application for generating and managing visual content, powered by pubuzhixing/drawnix Docker image."
category = "other"
tags = [
    "visualization",
    "content-generation",
]
version = "latest"
logo = "logo.png"
website = "https://drawnix.com/"
docs = "https://github.com/plait-board/drawnix/blob/develop/README_en.md#docker"
source = "https://github.com/plait-board/drawnix/"
upstream = "Dokploy/templates@6313a2e blueprints/drawnix"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "drawnix"
port = 3000
host = "${main_domain}"

[[config.mounts]]
filePath = "/app/config.txt"
content = """
# Placeholder content - customize if the application requires persistent configuration
"""

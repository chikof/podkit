id = "waxum"
name = "Waxum"
description = "Waxum is a WhatsApp REST API gateway written in Rust, shipped as a single native binary. Multi-session, multi-database (SQLite/Postgres/MySQL), 130+ REST endpoints: text/image/video/audio/document/sticker/location/contact/poll messages, reactions, scheduled and bulk (blast) sending, voice/video c..."
category = "development"
tags = [
    "api",
    "whatsapp",
    "messaging",
    "automation",
]
version = "0.13.5"
logo = "@mono-waxum"
website = "https://waxum.imtaqin.id"
docs = "https://waxum.imtaqin.id"
source = "https://github.com/imtaqin/waxum"
upstream = "Dokploy/templates@6313a2e blueprints/waxum"

[variables]
main_domain = "${domain}"
superadmin_token = "${password:32}"

[config.env]
SUPERADMIN_TOKEN = "${superadmin_token}"

[[config.domains]]
serviceName = "waxum"
port = 3451
host = "${main_domain}"

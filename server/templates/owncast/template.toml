id = "owncast"
name = "Owncast"
description = "Owncast is a self-hosted live video streaming and chat server for use with existing broadcasting software."
category = "media"
tags = [
    "streaming",
    "live-video",
    "chat",
    "broadcasting",
    "self-hosted",
    "rtmp",
]
version = "latest"
logo = "@owncast"
website = "https://owncast.online/"
docs = "https://owncast.online/docs/"
source = "https://github.com/owncast/owncast"
upstream = "Dokploy/templates@6313a2e blueprints/owncast"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "owncast"
port = 8080
host = "${main_domain}"

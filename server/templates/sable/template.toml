id = "sable"
name = "Sable"
description = "Sable is a modern, high-performance DNS platform with recursive and authoritative DNS, blocking, DNSSEC, observability, clustering, and a polished web console."
category = "networking"
tags = [
    "dns",
    "security",
    "privacy",
    "ad-blocking",
]
version = "1.6.1"
logo = "logo.svg"
website = "https://www.sabledns.io"
docs = "https://www.sabledns.io/docs"
source = "https://github.com/drudge/sable"
upstream = "Dokploy/templates@6313a2e blueprints/sable"

[variables]
main_domain = "${domain}"

[config.env]
SABLE_DNS_PORT = "1053"
SABLE_WEB_UPDATES = "true"
TZ = "UTC"

[[config.domains]]
serviceName = "sable"
port = 5380
host = "${main_domain}"

id = "opencloud"
name = "OpenCloud"
description = "Open source cloud platform for secure file sync, sharing, and content collaboration"
category = "storage"
tags = [
    "storage",
    "cloud",
    "files",
    "productivity",
]
version = "7.2"
logo = "logo.svg"
website = "https://opencloud.eu"
docs = "https://docs.opencloud.eu"
source = "https://github.com/opencloud-eu/opencloud"
upstream = "Dokploy/templates@6313a2e blueprints/opencloud"
reveal = ["admin_password"]

[variables]
admin_password = "${password:32}"
main_domain = "${domain}"

[config.env]
IDM_ADMIN_PASSWORD = "${admin_password}"
INITIAL_ADMIN_PASSWORD = "${admin_password}"
OC_INSECURE = "false"
OC_LOG_LEVEL = "info"
OC_URL = "https://${main_domain}"
PROXY_HTTP_ADDR = "0.0.0.0:9200"
PROXY_TLS = "false"

[[config.domains]]
serviceName = "opencloud"
port = 9200
host = "${main_domain}"

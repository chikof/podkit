id = "poke"
name = "Poke"
description = "Poke is an open-source, self-hosted alternative to YouTube. A privacy-focused video platform that allows you to watch and share videos without tracking."
category = "media"
tags = [
    "video",
    "youtube-alternative",
    "self-hosted",
    "privacy",
    "streaming",
]
version = "latest"
logo = "logo.png"
website = "https://poketube.fun/"
docs = "https://codeberg.org/ashleyirispuppy/poke"
source = "https://codeberg.org/ashleyirispuppy/poke"
upstream = "Dokploy/templates@6313a2e blueprints/poke"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "poke"
port = 6003
host = "${main_domain}"

[[config.mounts]]
filePath = "/poketube/config.json"
content = """
{
  "server_port": 6003,
  "image_proxy": "" 
}
"""

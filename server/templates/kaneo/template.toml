id = "kaneo"
name = "Kaneo"
description = "Kaneo - an open source project management platform focused on simplicity and efficiency. Self-host it, customize it, make it yours."
category = "other"
tags = ["task-tracking"]
version = "2.35.0"
logo = "logo.png"
website = "https://kaneo.app/"
docs = "https://kaneo.app/docs/"
source = "https://github.com/usekaneo/kaneo"
upstream = "Dokploy/templates@6313a2e blueprints/kaneo"

[variables]
auth_secret = "${hash:64}"
main_domain = "${domain}"
postgres_password = "${password:32}"

[config.env]
AUTH_SECRET = "${auth_secret}"
KANEO_CLIENT_URL = "http://${main_domain}"
POSTGRES_DB = "kaneo"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_USER = "kaneo"

[[config.domains]]
serviceName = "kaneo"
port = 5173
host = "${main_domain}"

id = "mediacms"
name = "MediaCMS"
description = "MediaCMS is an open-source video and media CMS. It is a modern, full-featured solution for managing and streaming media content."
category = "media"
tags = [
    "media",
    "video",
    "cms",
    "streaming",
    "self-hosted",
]
version = "latest"
logo = "logo.svg"
website = "https://mediacms.io/"
docs = "https://docs.mediacms.io/"
source = "https://github.com/mediacms/mediacms"
upstream = "Dokploy/templates@6313a2e blueprints/mediacms"
reveal = ["admin_password"]

[variables]
admin_password = "${password}"
main_domain = "${domain}"
postgres_password = "${password}"

[config.env]
ADMIN_PASSWORD = "${admin_password}"
POSTGRES_PASSWORD = "${postgres_password}"

[[config.domains]]
serviceName = "web"
port = 80
host = "${main_domain}"

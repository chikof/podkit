id = "postiz"
name = "Postiz"
description = "Postiz is a modern, open-source platform for managing and publishing content across multiple channels."
category = "cms"
tags = [
    "cms",
    "content-management",
    "publishing",
]
version = "latest"
logo = "logo.png"
website = "https://postiz.com"
docs = "https://docs.postiz.com"
source = "https://github.com/gitroomhq/postiz"
upstream = "Dokploy/templates@6313a2e blueprints/postiz"

[variables]
db_name = "postiz"
db_password = "${password}"
db_user = "postiz"
jwt_secret = "${base64:32}"
main_domain = "${domain}"
temporal_password = "${password}"
temporal_user = "temporal"

[config.env]
DB_NAME = "${db_name}"
DB_PASSWORD = "${db_password}"
DB_USER = "${db_user}"
FACEBOOK_APP_ID = ""
FACEBOOK_APP_SECRET = ""
INSTAGRAM_APP_ID = ""
INSTAGRAM_APP_SECRET = ""
JWT_SECRET = "${jwt_secret}"
LINKEDIN_CLIENT_ID = ""
LINKEDIN_CLIENT_SECRET = ""
POSTIZ_HOST = "${main_domain}"
TEMPORAL_PASSWORD = "${temporal_password}"
TEMPORAL_USER = "${temporal_user}"
TIKTOK_CLIENT_ID = ""
TIKTOK_CLIENT_SECRET = ""
X_API_KEY = ""
X_API_SECRET = ""
YOUTUBE_CLIENT_ID = ""
YOUTUBE_CLIENT_SECRET = ""

[[config.domains]]
serviceName = "postiz-app"
port = 5000
host = "${main_domain}"

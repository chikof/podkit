id = "chiefonboarding"
name = "Chief-Onboarding"
description = "Chief-Onboarding is a comprehensive, self-hosted onboarding and employee management platform designed for businesses to streamline their onboarding processes."
category = "other"
tags = [
    "employee-onboarding",
    "hr-management",
    "task-tracking",
    "role-based-access",
    "document-management",
]
version = "v2.2.5"
logo = "logo.png"
website = "https://chiefonboarding.com/"
docs = "https://docs.chiefonboarding.com/"
source = "https://github.com/chiefonboarding/chiefonboarding"
upstream = "Dokploy/templates@6313a2e blueprints/chiefonboarding"

[variables]
db_password = "${password:16}"
main_domain = "${domain}"
secret_key = "${password:16}"

[config.env]
DB_PASSWORD = "${db_password}"
DOMAIN = "${main_domain}"
SECRET_KEY = "${secret_key}"

[[config.domains]]
serviceName = "chiefonboarding"
port = 8000
host = "${main_domain}"

id = "rustdesk"
name = "RustDesk"
description = "RustDesk is a remote desktop tool and an open-source alternative to TeamViewer."
category = "productivity"
tags = [
    "remote-desktop",
    "self-hosted",
    "productivity",
]
version = "latest"
logo = "logo.png"
website = "https://rustdesk.com/"
docs = "https://rustdesk.com/docs/"
source = "https://github.com/rustdesk/rustdesk-server"
upstream = "Dokploy/templates@6313a2e blueprints/rustdesk"

[variables]
encryption_key = "${password:32}"
server_domain = "${domain}"

[config.env]
ENCRYPTION_KEY = "${encryption_key}"
RELAY_HOST = "${server_domain}"
RUSTDESK_API_SERVER = "http://${server_domain}:21118"
RUSTDESK_ID_SERVER = "${server_domain}:21116"
RUSTDESK_RELAY_SERVER = "${server_domain}:21117"

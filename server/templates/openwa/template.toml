id = "openwa"
name = "OpenWA"
description = "OpenWA is a free, self-hosted WhatsApp API gateway with a REST API, webhooks, multi-session support, and a bundled web dashboard."
category = "communication"
tags = [
    "whatsapp",
    "api",
    "gateway",
    "automation",
    "messaging",
]
version = "0.25.0"
logo = "logo.svg"
website = "https://www.open-wa.org"
docs = "https://github.com/rmyndharis/OpenWA/tree/main/docs"
source = "https://github.com/rmyndharis/OpenWA"
upstream = "Dokploy/templates@6313a2e blueprints/openwa"

[variables]
auto_start_sessions = "true"
csp_upgrade_insecure_requests = "false"
enable_swagger = "true"
engine_type = "whatsapp-web.js"
main_domain = "${domain}"
mcp_enabled = "true"
mcp_readonly = "true"
timezone = "UTC"

[config.env]
AUTO_START_SESSIONS = "${auto_start_sessions}"
CSP_UPGRADE_INSECURE_REQUESTS = "${csp_upgrade_insecure_requests}"
ENABLE_SWAGGER = "${enable_swagger}"
ENGINE_TYPE = "${engine_type}"
MCP_ENABLED = "${mcp_enabled}"
MCP_READONLY = "${mcp_readonly}"
NODE_ENV = "production"
PORT = "2785"
TZ = "${timezone}"

[[config.domains]]
serviceName = "openwa"
port = 2785
host = "${main_domain}"

id = "argilla"
name = "Argilla"
description = "Argilla is a robust platform designed to help engineers and data scientists streamline the management of machine learning data workflows. It simplifies tasks like data labeling, annotation, and quality control."
category = "ai"
tags = [
    "machine-learning",
    "data-labeling",
    "ai",
]
version = "latest"
logo = "logo.svg"
website = "https://www.argilla.io/"
docs = "https://docs.argilla.io/"
source = "https://github.com/argilla-io/argilla"
upstream = "Dokploy/templates@6313a2e blueprints/argilla"
reveal = ["login_password"]

[variables]
db_password = "${password:16}"
login_password = "${password:8}"
login_username = "${username}"
main_domain = "${domain}"
redis_password = "${password:16}"

[config.env]
BACKGROUND_NUM_WORKERS = "2"
DB_PASSWORD = "${db_password}"
LOGIN_PASSWORD = "${login_password}"
LOGIN_USERNAME = "${login_username}"
REDIS_PASSWORD = "${redis_password}"

[[config.domains]]
serviceName = "argilla-web"
port = 6900
host = "${main_domain}"

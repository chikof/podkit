id = "ollama-chat-tone"
name = "Ollama Chat Tone"
description = "Self-contained Ollama chat client with local auth, streaming responses, and per-user conversations."
category = "ai"
tags = [
    "chatbot",
    "ai",
    "ollama",
    "docker",
]
version = "latest"
logo = "logo.svg"
website = "https://hub.docker.com/r/billnice250/chattone"
docs = "https://hub.docker.com/r/billnice250/chattone"
source = "https://github.com/billnice250/ollama-chat-client"
upstream = "Dokploy/templates@6313a2e blueprints/ollama-chat-tone"

[variables]
basic_auth_password = "change-me"
basic_auth_user = "admin"
default_model = "llama3.2"
main_domain = "${domain}"
ollama_timeout = "5"
ollama_url = "http://your-ollama-host:11434"
session_secret = "change-me......32charsOrMore"

[config.env]
ADDR = ":8080"
APP_NAME = "Ollama Chat Tone"
BASIC_AUTH_PASSWORD = "${basic_auth_password}"
BASIC_AUTH_USER = "${basic_auth_user}"
DB_PATH = "/data/app.db"
DEFAULT_MODEL = "${default_model}"
OLLAMA_TIMEOUT = "${ollama_timeout}"
OLLAMA_URL = "${ollama_url}"
OPEN_BROWSER = "false"
SESSION_SECRET = "${session_secret}"

[[config.domains]]
serviceName = "ollama-chat-tone"
port = 8080
host = "${main_domain}"
path = "/"

[[config.mounts]]
filePath = "/data/app.db"
content = ""

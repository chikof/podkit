id = "evolutionapi"
name = "Evolution API"
description = "Evolution API is a robust platform dedicated to empowering small businesses with limited resources, going beyond a simple messaging solution via WhatsApp."
category = "development"
tags = [
    "api",
    "whatsapp",
    "messaging",
]
version = "v2.3.7"
logo = "logo.png"
website = "https://evolutionfoundation.com.br/"
docs = "https://docs.evolutionfoundation.com.br/en"
source = "https://github.com/evolution-foundation/evolution-api"
upstream = "Dokploy/templates@6313a2e blueprints/evolutionapi"

[variables]
api_key = "${base64:64}"
main_domain = "${domain}"
postgres_password = "${password}"

[config.env]
AUTHENTICATION_API_KEY = "${api_key}"
AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES = "true"
AUTHENTICATION_TYPE = "apikey"
CACHE_REDIS_ENABLED = "true"
CACHE_REDIS_PREFIX_KEY = "evolution"
CACHE_REDIS_SAVE_INSTANCES = "true"
CACHE_REDIS_URI = "redis://evolution-redis:6379"
CHATWOOT_ENABLED = "true"
CONFIG_SESSION_PHONE_CLIENT = "Evolution API"
CONFIG_SESSION_PHONE_NAME = "Chrome"
DATABASE_CONNECTION_URI = "postgres://postgresql:${postgres_password}@evolution-postgres:5432/evolution"
DATABASE_ENABLED = "true"
DATABASE_PROVIDER = "postgresql"
DATABASE_SAVE_DATA_CHATS = "true"
DATABASE_SAVE_DATA_CONTACTS = "true"
DATABASE_SAVE_DATA_HISTORIC = "true"
DATABASE_SAVE_DATA_INSTANCE = "true"
DATABASE_SAVE_DATA_LABELS = "true"
DATABASE_SAVE_DATA_NEW_MESSAGE = "true"
DATABASE_SAVE_MESSAGE_UPDATE = "true"
DIFY_ENABLED = "true"
EVOAI_ENABLED = "true"
LANGUAGE = "en"
N8N_ENABLED = "true"
OPENAI_ENABLED = "true"
POSTGRES_DATABASE = "evolution"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_USERNAME = "postgresql"
SERVER_URL = "https://${main_domain}"
TELEMETRY = "false"
TELEMETRY_URL = ""
TYPEBOT_API_VERSION = "latest"
TYPEBOT_ENABLED = "true"

[[config.domains]]
serviceName = "evolution-api"
port = 8080
host = "${main_domain}"

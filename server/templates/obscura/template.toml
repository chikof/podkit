id = "obscura"
name = "Obscura Browser"
description = "Headless browser for AI agents with authenticated remote MCP and Chrome DevTools Protocol endpoints."
category = "ai"
tags = [
    "ai",
    "browser",
    "automation",
    "mcp",
    "cdp",
]
version = "0.2.1"
logo = "logo.png"
website = "https://github.com/h4ckf0r0day/obscura"
docs = "https://github.com/h4ckf0r0day/obscura/blob/master/docs/Use-the-MCP-server.md"
source = "https://github.com/h4ckf0r0day/obscura"
upstream = "Dokploy/templates@6313a2e blueprints/obscura"

[variables]
api_token = "${password:48}"
main_domain = "${domain}"

[config.env]
OBSCURA_API_TOKEN = "${api_token}"
OBSCURA_HOST = "${main_domain}"

[[config.domains]]
serviceName = "caddy"
port = 80
host = "${main_domain}"

[[config.mounts]]
filePath = "Caddyfile"
content = """
:80 {
    @mcp path /mcp /mcp/*
    @cdpVersion path /json/version /json/version/

    handle @mcp {
        @authorized header Authorization "Bearer {$OBSCURA_API_TOKEN}"

        handle @authorized {
            reverse_proxy obscura-mcp:3000
        }

        respond "Unauthorized" 401
    }

    handle @cdpVersion {
        @authorized header Authorization "Bearer {$OBSCURA_API_TOKEN}"

        handle @authorized {
            header Content-Type application/json
            respond `{"Browser":"Obscura","Protocol-Version":"1.3","webSocketDebuggerUrl":"wss://{$OBSCURA_HOST}/devtools/browser?access_token={$OBSCURA_API_TOKEN}"}` 200
        }

        respond "Unauthorized" 401
    }

    handle {
        @authorizedByHeader header Authorization "Bearer {$OBSCURA_API_TOKEN}"
        @authorizedByQuery {
            path /devtools/*
            query access_token={$OBSCURA_API_TOKEN}
        }

        handle @authorizedByHeader {
            reverse_proxy obscura-cdp:9222
        }

        handle @authorizedByQuery {
            reverse_proxy obscura-cdp:9222
        }

        respond "Unauthorized" 401
    }
}
"""

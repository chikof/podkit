id = "hi-events"
name = "Hi.events"
description = "Hi.Events is a self-hosted event management and ticket selling platform that allows you to create, manage and promote events easily."
category = "other"
tags = [
    "self-hosted",
    "open-source",
    "manager",
]
version = "1.9.0-beta"
logo = "logo.svg"
website = "https://hi.events/"
docs = "https://hi.events/docs"
source = "https://github.com/HiEventsDev/hi.events"
upstream = "Dokploy/templates@6313a2e blueprints/hi-events"

[variables]
app_key = "${password}"
jwt_secret = "${password}"
main_domain = "${domain}"
postgres_password = "${password}"

[config.env]
APP_KEY = "${app_key}"
DOMAIN = "${main_domain}"
JWT_SECRET = "${jwt_secret}"
MAIL_FROM_ADDRESS = ""
MAIL_FROM_NAME = ""
MAIL_HOST = ""
MAIL_MAILER = ""
MAIL_PASSWORD = ""
MAIL_PORT = ""
MAIL_USERNAME = ""
POSTGRES_DB = "hievents"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_USER = "hievents"
VITE_STRIPE_PUBLISHABLE_KEY = ""

[[config.domains]]
serviceName = "all-in-one"
port = 80
host = "${main_domain}"

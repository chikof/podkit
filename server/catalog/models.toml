# Curated model catalog: models and the recipes (engine x quant x files) that run them.
#
# Embedded into the server with include_str!. Hand-edit the identity fields; the
# `revision`, `total_bytes` and `est_*_mb` lines are written by
# `scripts/catalog-verify.sh --fix` from the Hugging Face API (never guess them).
# `scripts/catalog-verify.sh` (no flag) re-checks them against Hugging Face.
#
# Model fields:
#   params_b / active_params_b  billions; total comes from the safetensors count
#                               Hugging Face reports for `base_repo`, active only where
#                               the model's own name says (A3B, A17B)
#   tier                        chiko's tier list (S, A, B, D); absent = not ranked
#   size_class                  Tiny < 8B <= Small < 16B <= Medium < 40B <= Large
#   tags                        curated: coding, reasoning, vision
# Recipe fields:
#   engine        preferred engine; GGUF recipes say llama_cuda and fall back to
#                 llama_cpu when the server has no usable GPU
#   include/files globs and exact paths of the download; both empty = whole repo
#   model_path    what the engine loads inside the download ("." = the directory)
#   verified      true only for the tiny models the engine spike ran
#   measured      decode tokens/s from docs/spikes/engines.json (same variant, same file)
#   est_*_mb      weights + 15% + 512 MB + 8192 tokens of KV cache, like models::service::estimate


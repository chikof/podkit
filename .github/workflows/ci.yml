name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-fmt:
    name: rust / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Rust version is pinned here, in devenv.nix and in the Dockerfile: bump all three together.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    name: rust / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-test:
    name: rust / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SQLX_OFFLINE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
      - name: run migrations
        run: sqlx migrate run --source crates/core/migrations
      - name: cargo test
        run: cargo test --workspace --all-features

  footprint:
    name: footprint / idle RSS budgets
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-ordered.sh
      # Starts the server and the agent (no Podman: the agent gets a stub socket),
      # leaves them idle and fails when an idle RSS is over scripts/footprint.budget.
      - name: idle RSS budgets
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: scripts/footprint.sh --check --out footprint.txt
      - if: always()
        run: cat footprint.txt || true

  rust-audit:
    name: rust / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  docker:
    name: docker / build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          target: final

  # A commit on main is published only once every other job has passed on it, so
  # podkit-templates' CI can run `podkit check-templates` from an image that is known good.
  publish:
    name: docker / publish
    if: github.event_name == 'push'
    needs: [rust-fmt, rust-clippy, rust-test, footprint, rust-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          target: final
          tags: |
            ghcr.io/podoes/podkit:main
            ghcr.io/podoes/podkit:${{ github.sha }}
          # Links the package to this repository on GHCR.
          labels: org.opencontainers.image.source=https://github.com/podoes/podkit

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-fmt:
    name: rust / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Rust version is pinned here, in devenv.nix and in the Dockerfile: bump all three together.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    name: rust / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-test:
    name: rust / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SQLX_OFFLINE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
      - name: run migrations
        run: sqlx migrate run --source crates/core/migrations
      - name: cargo test
        run: cargo test --workspace --all-features

  footprint:
    name: footprint / idle RSS budgets
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-ordered.sh
      # The catalog the server downloads in the load pass, at one commit: "after use" is a
      # server that holds it, and the numbers move with podkit, not with the catalog.
      - uses: actions/checkout@v7
        with:
          repository: podoes/podkit-templates
          ref: 9e23422721df01fae91e149866ddb36bc61c1b08
          path: podkit-templates
      - run: python3 podkit-templates/scripts/build.py
      # Starts the server and the agent (no Podman: the agent gets a stub socket),
      # leaves them idle and fails when an idle RSS is over scripts/footprint.budget.
      - name: idle RSS budgets
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: scripts/footprint.sh --check --catalog podkit-templates/dist --out footprint.txt
      - if: always()
        run: cat footprint.txt || true

  rust-audit:
    name: rust / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  docker:
    name: docker / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          target: final

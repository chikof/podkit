# Source of truth for repo labels. Synced by .github/workflows/labels.yml
# on push to main (or manually via workflow_dispatch).

# type
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: docs
  color: "0075ca"
  description: Documentation only
- name: chore
  color: "cfd3d7"
  description: Tooling, deps, CI, refactors with no behavior change

# workflow
- name: triage
  color: "ededed"
  description: Needs a first look to confirm/scope
- name: confirmed
  color: "0e8a16"
  description: Reproduced / scoped, ready to work
- name: blocked
  color: "b60205"
  description: Can't proceed until something else lands
- name: wontfix
  color: "ffffff"
  description: This will not be worked on
- name: duplicate
  color: "cfd3d7"
  description: Already tracked elsewhere
- name: good first issue
  color: "7057ff"
  description: Good for newcomers

# priority
- name: "priority: high"
  color: "e11d21"
  description: Breaks core deploy loop or is a security issue
- name: "priority: low"
  color: "c2e0c6"
  description: Nice to have, no urgency

# area: mirrors the workspace layout
- name: "area: server"
  color: "1d76db"
  description: server/, crates/core, crates/database
- name: "area: runtime"
  color: "1d76db"
  description: crates/runtime, podman, ssh tunnel, nixpacks, traefik
- name: "area: dashboard"
  color: "1d76db"
  description: dashboard/ (SvelteKit)
- name: "area: ci"
  color: "1d76db"
  description: .github/, devenv.nix, build pipeline

# security
- name: security
  color: "b60205"
  description: Security-relevant; see SECURITY.md for private reporting

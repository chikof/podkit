[package]
name = "podkit-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
podkit-core = { path = "../core" }
axum.workspace = true
image.workspace = true
tokio.workspace = true
tracing.workspace = true
time.workspace = true
serde.workspace = true
tower-cookies.workspace = true
maud.workspace = true
datastar.workspace = true
sha2.workspace = true
proto.workspace = true
outbound.workspace = true
tokio-util.workspace = true
bytes.workspace = true
serde_json.workspace = true
toml.workspace = true
futures-util.workspace = true
base64.workspace = true
url.workspace = true
podkit-firewall = { path = "../firewall" }
tower.workspace = true

[lints]
workspace = true

[build-dependencies]
encre-css.workspace = true

[dev-dependencies]
# The shared test state, requests and fixtures (`podkit_core::tests`).
podkit-core = { path = "../core", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
outbound = { workspace = true, features = ["test-util"] }
agent = { path = "../../agent" }
sqlx.workspace = true
crypto.workspace = true
rsa.workspace = true
rustls.workspace = true
bcrypt.workspace = true
tempfile.workspace = true
reqwest.workspace = true
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
webauthn-rs = { version = "=0.6.2", features = ["danger-allow-state-serialisation"] }
webauthn-authenticator-rs = { version = "=0.6.2", features = ["softpasskey"] }

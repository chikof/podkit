id = "palmr"
name = "Palmr"
description = "Palmr the open-source, self-hosted alternative to WeTransfer. Share files securely, without tracking or limitations."
category = "storage"
tags = [
    "file-sharing",
    "self-hosted",
    "open-source",
]
version = "latest"
logo = "logo.png"
website = "https://palmr.kyantech.com.br/"
docs = "https://palmr.kyantech.com.br/docs/3.0-beta"
source = "https://github.com/kyantech/Palmr"
upstream = "Dokploy/templates@6313a2e blueprints/palmr"

[variables]
main_domain = "${domain}"

[config.env]
ENCRYPTION_KEY = ""

[[config.domains]]
serviceName = "palmr"
port = 5487
host = "${main_domain}"

id = "systemprompt"
name = "systemprompt"
description = "Self-owned AI control plane: governance gateway for Claude, OpenAI, and Gemini with policy checks, audit trails, rate limits, and MCP orchestration. Requires at least one AI provider API key."
category = "ai"
tags = [
    "ai",
    "self-hosted",
]
version = "0.21.0"
logo = "logo.svg"
website = "https://systemprompt.io"
docs = "https://systemprompt.io/documentation/"
source = "https://github.com/systempromptio/systemprompt-template"
upstream = "Dokploy/templates@6313a2e blueprints/systemprompt"

[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"

[config.env]
ANTHROPIC_API_KEY = ""
EXTERNAL_URL = "https://${main_domain}"
GEMINI_API_KEY = ""
OPENAI_API_KEY = ""
POSTGRES_PASSWORD = "${postgres_password}"

[[config.domains]]
serviceName = "systemprompt"
port = 8080
host = "${main_domain}"

id = "paymenter"
name = "Paymenter"
description = "Paymenter is a modern billing and payment management system for hosting providers, with automation, invoicing, and client management features."
category = "development"
tags = [
    "billing",
    "payment",
    "hosting",
    "invoicing",
    "business",
    "automation",
    "client-management",
]
version = "latest"
logo = "logo.png"
website = "https://paymenter.org/"
docs = "https://paymenter.org/docs/getting-started/introduction"
source = "https://github.com/Paymenter/Paymenter"
upstream = "Dokploy/templates@6313a2e blueprints/paymenter"

[variables]
app_key = "${base64:32}"
main_domain = "${domain}"
mysql_password = "${password:16}"
mysql_root_password = "${password:20}"

[config.env]
APP_KEY = "base64:${app_key}"
APP_URL = "https://${main_domain}"
MYSQL_DATABASE = "paymenter"
MYSQL_PASSWORD = "${mysql_password}"
MYSQL_ROOT_PASSWORD = "${mysql_root_password}"
MYSQL_USER = "paymenter"

[[config.domains]]
serviceName = "paymenter"
port = 80
host = "${main_domain}"
path = "/"

id = "tianji"
name = "Tianji"
description = "Tianji is a lightweight web analytic service and uptime monitoring tool."
category = "analytics"
tags = [
    "analytics",
    "monitoring",
    "web",
    "uptime",
]
version = "latest"
logo = "logo.svg"
website = "https://tianji.dev/"
docs = "https://tianji.dev/docs/intro"
source = "https://github.com/msgbyte/tianji"
upstream = "Dokploy/templates@6313a2e blueprints/tianji"

[variables]
jwt_secret = "${password:32}"
main_domain = "${domain}"

[[config.domains]]
serviceName = "tianji"
port = 12345
host = "${main_domain}"

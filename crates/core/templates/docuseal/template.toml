id = "docuseal"
name = "Docuseal"
description = "Docuseal is a self-hosted document management system."
category = "other"
tags = ["document-signing"]
version = "latest"
logo = "logo.png"
website = "https://www.docuseal.com/"
docs = "https://www.docuseal.com/"
source = "https://github.com/docusealco/docuseal"
upstream = "Dokploy/templates@6313a2e blueprints/docuseal"

[variables]
main_domain = "${domain}"

[config.env]
POSTGRES_DB = "docuseal"
POSTGRES_PASSWORD = "postgres"
POSTGRES_USER = "postgres"

[[config.domains]]
serviceName = "app"
port = 3000
host = "${main_domain}"

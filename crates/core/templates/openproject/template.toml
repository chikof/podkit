id = "openproject"
name = "OpenProject"
description = "OpenProject 17 slim: web, worker, cron, Postgres 17, memcached. Optional IMAP/SMTP and S3."
category = "productivity"
tags = [
    "project-management",
    "productivity",
]
version = "17"
logo = "logo.svg"
website = "https://www.openproject.org/"
docs = "https://www.openproject.org/docs/installation-and-operations/installation/docker-compose/"
source = "https://github.com/opf/openproject"
upstream = "Dokploy/templates@6313a2e blueprints/openproject"

[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"
secret_key_base = "${base64:64}"

[config.env]
ATTACHMENTS_STORAGE = "file"
IMAP_ALLOW_OVERRIDE = "type,project,priority,status,responsible,assigned_to,estimated_hours,remaining_hours"
IMAP_CHECK_INTERVAL = "600"
IMAP_ENABLED = "false"
IMAP_HOST = ""
IMAP_PASSWORD = ""
IMAP_PORT = "993"
IMAP_USERNAME = ""
OPENPROJECT_CACHE__EXPIRES__IN__SECONDS = "3600"
OPENPROJECT_HOST__NAME = "${main_domain}"
OPENPROJECT_HTTPS = "true"
POSTGRES_PASSWORD = "${postgres_password}"
S3_ACCESS_KEY = ""
S3_BUCKET = ""
S3_ENDPOINT = ""
S3_REGION = ""
S3_SECRET_KEY = ""
SECRET_KEY_BASE = "${secret_key_base}"
SMTP_AUTHENTICATION = "login"
SMTP_DOMAIN = ""
SMTP_HOST = ""
SMTP_PASSWORD = ""
SMTP_PORT = "587"
SMTP_STARTTLS = "true"
SMTP_USERNAME = ""
SMTP_VERIFY_MODE = "peer"

[[config.domains]]
serviceName = "web"
port = 8080
host = "${main_domain}"

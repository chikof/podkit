id = "kutt"
name = "Kutt"
description = "Kutt is a modern URL shortener with support for custom domains. Create and edit links, view statistics, manage users, and more."
category = "other"
tags = [
    "link-shortener",
    "link-sharing",
]
version = "latest"
logo = "logo.png"
website = "https://kutt.it"
docs = "https://github.com/thedevs-network/kutt#kuttit"
source = "https://github.com/thedevs-network/kutt"
upstream = "Dokploy/templates@6313a2e blueprints/kutt"

[variables]
jwt_secret = "${password:32}"
main_domain = "${domain}"

[config.env]
CONTACT_EMAIL = "''"
CUSTOM_DOMAIN_USE_HTTPS = "true"
DEFAULT_DOMAIN = "${main_domain}"
DISALLOW_ANONYMOUS_LINKS = "true"
JWT_SECRET = "${jwt_secret}"
MAIL_ENABLED = "false"
MAIL_FROM = "''"
MAIL_HOST = "''"
MAIL_PASSWORD = "''"
MAIL_PORT = "'22'"
MAIL_SECURE = "true"
MAIL_USER = "''"
TRUST_PROXY = "false"

[[config.domains]]
serviceName = "kutt"
port = 3000
host = "${main_domain}"

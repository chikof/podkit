id = "filebrowser"
name = "File Browser"
description = "Filebrowser is a standalone file manager for uploading, deleting, previewing, renaming, and editing files, with support for multiple users, each with their own directory."
category = "storage"
tags = [
    "file-manager",
    "storage",
]
version = "2.31.2"
logo = "logo.svg"
website = "https://filebrowser.org/"
docs = "https://filebrowser.org/"
source = "https://github.com/filebrowser/filebrowser"
upstream = "Dokploy/templates@6313a2e blueprints/filebrowser"

[variables]
main_domain = "${domain}"

[config.env]
FB_BASEURL = "/filebrowser"

[[config.domains]]
serviceName = "filebrowser"
port = 8080
host = "${main_domain}"

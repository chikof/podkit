id = "cut"
name = "Cut"
description = "A tiny, self-hosted URL shortener — short links that are entirely yours, with per-link passwords, expiries, and click limits."
category = "other"
tags = [
    "url-shortener",
    "links",
]
version = "0.1.0"
logo = "logo.svg"
website = "https://github.com/MendyLanda/cut"
docs = "https://github.com/MendyLanda/cut#readme"
source = "https://github.com/MendyLanda/cut"
upstream = "Dokploy/templates@6313a2e blueprints/cut"
reveal = ["admin_password"]

[variables]
admin_password = "${password:24}"
main_domain = "${domain}"

[config.env]
ADMIN_PASSWORD = "${admin_password}"

[[config.domains]]
serviceName = "cut"
port = 3000
host = "${main_domain}"

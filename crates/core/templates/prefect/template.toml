id = "prefect"
name = "Prefect"
description = "Prefect is an open-source workflow orchestration platform for building, scheduling, monitoring, and managing data pipelines and Python workflows."
category = "automation"
tags = [
    "automation",
    "workflow",
    "data",
]
version = "3.7.5-python3.12"
logo = "logo.svg"
website = "https://www.prefect.io/"
docs = "https://docs.prefect.io/"
source = "https://github.com/PrefectHQ/prefect"
upstream = "Dokploy/templates@6313a2e blueprints/prefect"
reveal = ["auth_password"]

[variables]
auth_password = "${password:32}"
main_domain = "${domain}"
postgres_password = "${password:32}"

[config.env]
POSTGRES_PASSWORD = "${postgres_password}"
PREFECT_AUTH_PASSWORD = "${auth_password}"
PREFECT_AUTH_USER = "admin"
PREFECT_DOMAIN = "${main_domain}"
USE_AUTH = "False"

[[config.domains]]
serviceName = "prefect"
port = 4200
host = "${main_domain}"

id = "keyzori"
name = "Keyzori"
description = "Self-hosted software license server with customer management, device access controls, sessions, and usage metering through an HTTP API and CLI."
category = "security"
tags = [
    "licensing",
    "security",
    "developer-tools",
]
version = "93b5d75ac8e5a4cd0740bfe1a46b5663674767fb"
logo = "logo.png"
website = ""
docs = "https://github.com/keyzori/keyzori/wiki"
source = "https://github.com/keyzori/keyzori"
upstream = "Dokploy/templates@6313a2e blueprints/keyzori"

[variables]
admin_key = "${hash:32}"
main_domain = "${domain}"
postgres_password = "${hash:32}"

[config.env]
KEYZORI_ADMIN_KEY = "${admin_key}"
KEYZORI_POSTGRES_PASSWORD = "${postgres_password}"

[[config.domains]]
serviceName = "keyzori"
port = 6284
host = "${main_domain}"

id = "grafana"
name = "Grafana"
description = "Grafana is an open-source dashboard tool for monitoring and visualizing data."
category = "monitoring"
tags = ["monitoring"]
version = "12.4"
logo = "logo.svg"
website = "https://grafana.com/"
docs = "https://grafana.com/docs/"
source = "https://github.com/grafana/grafana"
upstream = "Dokploy/templates@6313a2e blueprints/grafana"


id = "uptimekit"
name = "Uptimekit"
description = "The modern open-source status page and monitoring solution."
category = "monitoring"
tags = [
    "monitoring",
    "uptime",
    "status-page",
    "distributed",
]
version = "5.2.1"
logo = "logo.svg"
website = "https://uptimekit.dev/"
docs = "https://docs.uptimekit.dev/"
source = "https://github.com/uptimekit/uptimekit"
upstream = "Dokploy/templates@6313a2e blueprints/uptimekit"

[variables]
clickhouse_password = "${password:32}"
db_password = "${password:32}"
main_domain = "${domain}"
second_domain = "${domain}"
secret_base = "${base64:64}"

[config.env]
BETTER_AUTH_SECRET = "${secret_base}"
BETTER_AUTH_URL = "http://${main_domain}"
CLICKHOUSE_PASSWORD = "${clickhouse_password}"
NEXT_PUBLIC_URL = "http://${main_domain}"
POSTGRES_PASSWORD = "${db_password}"

[[config.domains]]
serviceName = "dash"
port = 3000
host = "${main_domain}"

id = "activepieces"
name = "Activepieces"
description = "Open-source no-code business automation tool. An alternative to Zapier, Make.com, and Tray."
category = "automation"
tags = [
    "automation",
    "workflow",
    "no-code",
]
version = "0.91.2"
logo = "logo.svg"
website = "https://www.activepieces.com/"
docs = "https://www.activepieces.com/docs"
source = "https://github.com/activepieces/activepieces"
upstream = "Dokploy/templates@6313a2e blueprints/activepieces"

[variables]
api_key = "${password:32}"
encryption_key = "${password:32}"
jwt_secret = "${password:32}"
main_domain = "${domain}"
postgres_password = "${password:32}"

[config.env]
AP_API_KEY = "${api_key}"
AP_ENCRYPTION_KEY = "${encryption_key}"
AP_HOST = "${main_domain}"
AP_JWT_SECRET = "${jwt_secret}"
AP_POSTGRES_PASSWORD = "${postgres_password}"

[[config.domains]]
serviceName = "activepieces"
port = 80
host = "${main_domain}"

id = "qbittorrent"
name = "qBittorrent"
description = "qBittorrent is an open-source BitTorrent client you can control from a web interface."
category = "media"
tags = [
    "torrent",
    "download",
    "file-sharing",
]
version = "latest"
logo = "logo.svg"
website = "https://www.qbittorrent.org/"
docs = "https://github.com/qbittorrent/qBittorrent/wiki"
source = "https://github.com/qbittorrent/qBittorrent"
upstream = "Dokploy/templates@6313a2e blueprints/qbittorrent"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "qbittorrent"
port = 8080
host = "${main_domain}"

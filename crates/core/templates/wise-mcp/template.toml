id = "wise-mcp"
name = "Wise MCP (unofficial)"
description = "Self-hosted MCP connector that lets Claude and ChatGPT read your Wise balances, card payments and transfers, and prepare transfers you approve twice."
category = "ai"
tags = [
    "ai",
    "mcp",
    "finance",
]
version = "1.1.1"
logo = "logo.svg"
website = "https://blanketbyte.com"
docs = "https://github.com/BlanketByte/wise-mcp#readme"
source = "https://github.com/BlanketByte/wise-mcp"
upstream = "Dokploy/templates@6313a2e blueprints/wise-mcp"

[variables]
encryption_key = "${password:48}"
main_domain = "${domain}"

[config.env]
ALLOWED_WISE_USERS = ""
PUBLIC_URL = "https://${main_domain}"
TOKEN_ENCRYPTION_KEY = "${encryption_key}"
WRITES_ENABLED = "true"

[[config.domains]]
serviceName = "wise-mcp"
port = 3000
host = "${main_domain}"

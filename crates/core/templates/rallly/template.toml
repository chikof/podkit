id = "rallly"
name = "Rallly"
description = "Rallly is an open-source scheduling and collaboration tool for organizing events and meetings."
category = "productivity"
tags = [
    "scheduling",
    "polls",
    "collaboration",
]
version = "4.11.1"
logo = "logo.svg"
website = "https://rallly.co/"
docs = "https://support.rallly.co/self-hosting/introduction"
source = "https://github.com/lukevella/rallly"
upstream = "Dokploy/templates@6313a2e blueprints/rallly"

[variables]
initial_admin_email = "${email}"
main_domain = "${domain}"
noreply_email = "${email}"
postgres_password = "${password:32}"
s3_access_key_id = "rallly"
s3_secret_access_key = "${password:32}"
secret_password = "${password:32}"
smtp_host = "smtp.example.com"
smtp_password = "${password:32}"
smtp_port = "587"
smtp_secure = "false"
smtp_user = "change-me"
support_email = "${email}"

[config.env]
DATABASE_URL = "postgres://postgres:${postgres_password}@db:5432/rallly"
INITIAL_ADMIN_EMAIL = "${initial_admin_email}"
NEXT_PUBLIC_BASE_URL = "https://${main_domain}"
NOREPLY_EMAIL = "${noreply_email}"
POSTGRES_PASSWORD = "${postgres_password}"
S3_ACCESS_KEY_ID = "${s3_access_key_id}"
S3_BUCKET_NAME = "rallly"
S3_ENDPOINT = "http://minio:9000"
S3_REGION = "us-east-1"
S3_SECRET_ACCESS_KEY = "${s3_secret_access_key}"
SECRET_PASSWORD = "${secret_password}"
SMTP_HOST = "${smtp_host}"
SMTP_PORT = "${smtp_port}"
SMTP_PWD = "${smtp_password}"
SMTP_SECURE = "${smtp_secure}"
SMTP_USER = "${smtp_user}"
SUPPORT_EMAIL = "${support_email}"

[[config.domains]]
serviceName = "rallly"
port = 3000
host = "${main_domain}"

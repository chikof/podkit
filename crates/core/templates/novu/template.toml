id = "novu"
name = "Novu"
description = "Open-source notification infrastructure for multi-channel workflows — in-app Inbox, email, SMS, push, and chat — with a unified API and dashboard."
category = "communication"
tags = [
    "notifications",
    "email",
    "sms",
    "push",
    "inbox",
    "self-hosted",
    "api",
]
version = "3.18.0"
logo = "logo.png"
website = "https://novu.co/"
docs = "https://docs.novu.co/community/self-hosting-novu/deploy-with-docker"
source = "https://github.com/novuhq/novu"
upstream = "Dokploy/templates@6313a2e blueprints/novu"

[variables]
api_domain = "${domain}"
jwt_secret = "${password:64}"
main_domain = "${domain}"
mongo_password = "${password:32}"
mongo_user = "root"
novu_secret_key = "${password:64}"
store_encryption_key = "${password:32}"
ws_domain = "${domain}"

[config.env]
API_CONTEXT_PATH = ""
API_PORT = "3000"
API_ROOT_URL = "https://${api_domain}"
AWS_ACCESS_KEY_ID = "test"
AWS_SECRET_ACCESS_KEY = "test"
BROADCAST_QUEUE_CHUNK_SIZE = "100"
FRONT_BASE_URL = "https://${main_domain}"
IS_API_IDEMPOTENCY_ENABLED = "false"
IS_API_RATE_LIMITING_ENABLED = "false"
IS_EMAIL_INLINE_CSS_DISABLED = "false"
IS_NEW_MESSAGES_API_RESPONSE_ENABLED = "true"
IS_SELF_HOSTED = "true"
IS_USE_MERGED_DIGEST_ID_ENABLED = "false"
IS_V2_ENABLED = "true"
JWT_SECRET = "${jwt_secret}"
MONGO_AUTO_CREATE_INDEXES = "true"
MONGO_INITDB_ROOT_PASSWORD = "${mongo_password}"
MONGO_INITDB_ROOT_USERNAME = "${mongo_user}"
MONGO_MAX_POOL_SIZE = "10"
MONGO_MIN_POOL_SIZE = "5"
MONGO_URL = "mongodb://${mongo_user}:${mongo_password}@mongodb:27017/novu-db?authSource=admin"
MULTICAST_QUEUE_CHUNK_SIZE = "100"
NEW_RELIC_APP_NAME = ""
NEW_RELIC_ENABLED = "false"
NEW_RELIC_LICENSE_KEY = ""
NODE_ENV = "production"
NOVU_SECRET_KEY = "${novu_secret_key}"
REDIS_CACHE_SERVICE_HOST = "redis"
REDIS_CACHE_SERVICE_PORT = "6379"
REDIS_HOST = "redis"
REDIS_PASSWORD = ""
REDIS_PORT = "6379"
S3_BUCKET_NAME = "novu-local"
S3_LOCAL_STACK = ""
S3_REGION = "us-east-1"
SENTRY_DSN = ""
STORE_ENCRYPTION_KEY = "${store_encryption_key}"
SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME = "15d"
VITE_API_HOSTNAME = "https://${api_domain}"
VITE_WEBSOCKET_HOSTNAME = "https://${ws_domain}"
WORKER_PORT = "3004"
WS_CONTEXT_PATH = ""
WS_PORT = "3002"

[[config.domains]]
serviceName = "novu"
port = 4000
host = "${main_domain}"

[[config.domains]]
serviceName = "api"
port = 3000
host = "${api_domain}"

[[config.domains]]
serviceName = "ws"
port = 3002
host = "${ws_domain}"

id = "poste-io"
name = "Poste.io"
description = "Complete mail server solution with SMTP, IMAP, POP3, antispam, antivirus, web administration and webmail client."
category = "communication"
tags = [
    "email",
    "mail-server",
    "smtp",
    "imap",
    "pop3",
    "antispam",
    "antivirus",
    "webmail",
]
version = "latest"
logo = "logo.svg"
website = "https://poste.io/"
docs = "https://poste.io/doc/"
source = "https://bitbucket.org/analogic/mailserver"
upstream = "Dokploy/templates@6313a2e blueprints/poste.io"

[variables]
main_domain = "${domain}"

[config.env]
TZ = "UTC"

[[config.domains]]
serviceName = "mailserver"
port = 8080
host = "${main_domain}"

id = "rote"
name = "Rote"
description = "Rote is an open-source multi-platform personal note system featuring an open API, full data ownership, and effortless Docker deployment."
category = "productivity"
tags = [
    "notes",
    "productivity",
    "postgres",
    "bun",
]
version = "latest"
logo = "logo.png"
website = "https://rote.ink"
docs = "https://github.com/Rabithua/Rote/tree/main/doc/userguide"
source = "https://github.com/Rabithua/Rote"
upstream = "Dokploy/templates@6313a2e blueprints/rote"

[variables]
backend_domain = "${domain}"
frontend_domain = "${domain}"
image_tag = "latest"
postgres_password = "${password:32}"

[config.env]
IMAGE_TAG = "${image_tag}"
POSTGRES_PASSWORD = "${postgres_password}"
VITE_API_BASE = "http://${backend_domain}"

[[config.domains]]
serviceName = "rote-frontend"
port = 80
host = "${frontend_domain}"

[[config.domains]]
serviceName = "rote-backend"
port = 3000
host = "${backend_domain}"

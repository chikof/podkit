id = "paperless-ngx"
name = "Paperless-ngx"
description = "Paperless-ngx is a document management system that turns scanned paperwork into a searchable archive."
category = "productivity"
tags = [
    "documents",
    "ocr",
    "productivity",
    "self-hosted",
]
version = "2.20.15"
logo = "logo.svg"
website = "https://paperless-ngx.com/"
docs = "https://docs.paperless-ngx.com/"
source = "https://github.com/paperless-ngx/paperless-ngx"
upstream = "Dokploy/templates@6313a2e blueprints/paperless-ngx"

[variables]
main_domain = "${domain}"
paperless_ocr_language = "eng"
paperless_secret_key = "${password:64}"
paperless_timezone = "UTC"
paperless_url = "http://${main_domain}"
postgres_password = "${password:32}"

[config.env]
PAPERLESS_OCR_LANGUAGE = "${paperless_ocr_language}"
PAPERLESS_SECRET_KEY = "${paperless_secret_key}"
PAPERLESS_TIME_ZONE = "${paperless_timezone}"
PAPERLESS_URL = "${paperless_url}"
POSTGRES_PASSWORD = "${postgres_password}"

[[config.domains]]
serviceName = "paperless-ngx"
port = 8000
host = "${main_domain}"

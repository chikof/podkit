id = "mage-ai"
name = "Mage AI"
description = "Build, run, and manage data pipelines for integrating and transforming data."
category = "database"
tags = [
    "data",
    "dbt",
    "etl",
    "pipelines",
]
version = "0.9.78"
logo = "logo.svg"
website = "https://mage.ai"
docs = "https://docs.mage.ai"
source = "https://github.com/mage-ai/mage-ai"
upstream = "Dokploy/templates@6313a2e blueprints/mage-ai"

[variables]
main_domain = "${domain}"

[config.env]
ENV = "production"
PROJECT_NAME = "mage-ai"

[[config.domains]]
serviceName = "mage-ai"
port = 6789
host = "${main_domain}"

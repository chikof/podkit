id = "influxdb"
name = "InfluxDB"
description = "InfluxDB 2.7 is the platform purpose-built to collect, store, process and visualize time series data."
category = "storage"
tags = [
    "self-hosted",
    "open-source",
    "storage",
    "database",
]
version = "2.7.10"
logo = "logo.png"
website = "https://www.influxdata.com/"
docs = "https://docs.influxdata.com/influxdb/v2/"
source = "https://github.com/influxdata/influxdb"
upstream = "Dokploy/templates@6313a2e blueprints/influxdb"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "influxdb"
port = 8086
host = "${main_domain}"

id = "code-server"
name = "code-server"
description = "code-server is a version of VS Code that runs in your browser."
category = "development"
tags = [
    "ide",
    "development",
    "vscode",
    "self-hosted",
]
version = "4.121.0"
logo = "logo.png"
website = "https://coder.com/docs/code-server"
docs = "https://coder.com/docs/code-server"
source = "https://github.com/coder/code-server"
upstream = "Dokploy/templates@6313a2e blueprints/code-server"

[variables]
main_domain = "${domain}"
password = "${password:32}"

[config.env]
PASSWORD = "${password}"
TZ = "UTC"

[[config.domains]]
serviceName = "code-server"
port = 8080
host = "${main_domain}"

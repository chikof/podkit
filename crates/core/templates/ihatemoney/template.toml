id = "ihatemoney"
name = "I Hate Money"
description = "I Hate Money is a web application for managing shared expenses among groups of people. It helps you track who owes what to whom, making it easy to split bills and manage group finances."
category = "finance"
tags = [
    "budget",
    "finance",
    "expense-sharing",
    "self-hosted",
    "money-management",
    "group-finances",
]
version = "latest"
logo = "logo.png"
website = "https://ihatemoney.org/"
docs = "https://ihatemoney.readthedocs.io/"
source = "https://github.com/spiral-project/ihatemoney"
upstream = "Dokploy/templates@6313a2e blueprints/ihatemoney"
reveal = ["ADMIN_PASSWORD"]

[variables]
ADMIN_PASSWORD = "${password:32}"
MAIL_PASSWORD = "${password:32}"
MAIL_USERNAME = "${username}"
SECRET_KEY = "${password:64}"
main_domain = "${domain}"

[config.env]
ACTIVATE_ADMIN_DASHBOARD = "False"
ACTIVATE_DEMO_PROJECT = "True"
ADMIN_PASSWORD = "${ADMIN_PASSWORD}"
ALLOW_PUBLIC_PROJECT_CREATION = "True"
APPLICATION_ROOT = "/"
BABEL_DEFAULT_TIMEZONE = "UTC"
DEBUG = "False"
ENABLE_CAPTCHA = "False"
GREENLET_TEST_CPP = "no"
LEGAL_LINK = ""
MAIL_DEFAULT_SENDER = "Budget manager <admin@example.com>"
MAIL_PASSWORD = "${MAIL_PASSWORD}"
MAIL_PORT = "25"
MAIL_SERVER = "localhost"
MAIL_USERNAME = "${MAIL_USERNAME}"
MAIL_USE_SSL = "False"
MAIL_USE_TLS = "False"
PGID = "0"
PORT = "8000"
PUID = "0"
SECRET_KEY = "${SECRET_KEY}"
SESSION_COOKIE_SECURE = "True"
SHOW_ADMIN_EMAIL = "True"
SQLALCHEMY_DATABASE_URI = "sqlite:////database/ihatemoney.db"
SQLALCHEMY_TRACK_MODIFICATIONS = "False"

[[config.domains]]
serviceName = "ihatemoney"
port = 8000
host = "${main_domain}"

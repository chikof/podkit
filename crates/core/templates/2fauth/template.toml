id = "2fauth"
name = "2FAuth"
description = "2FAuth is a self-hosted web app for managing two-factor authentication tokens: organize all your 2FA accounts, generate codes in the browser, and sign in with passkeys or WebAuthn."
category = "security"
tags = [
    "security",
    "2fa",
    "authentication",
]
version = "9.0.1"
logo = "logo.svg"
website = "https://2fauth.app"
docs = "https://docs.2fauth.app"
source = "https://github.com/Bubka/2FAuth"
upstream = "Dokploy/templates@6313a2e blueprints/2fauth"

[variables]
app_key = "${password:32}"
main_domain = "${domain}"

[config.env]
APP_KEY = "${app_key}"
APP_URL = "https://${main_domain}"

[[config.domains]]
serviceName = "2fauth"
port = 8000
host = "${main_domain}"

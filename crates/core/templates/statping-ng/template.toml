id = "statping-ng"
name = "Statping-NG"
description = "Statping-NG is an easy-to-use status page for monitoring websites and applications with beautiful metrics, analytics, and health checks."
category = "monitoring"
tags = [
    "monitoring",
    "status-page",
]
version = "latest"
logo = "logo.png"
website = "https://statping-ng.github.io/"
docs = "https://statping-ng.github.io/install.html"
source = "https://github.com/adamboutcher/statping-ng"
upstream = "Dokploy/templates@6313a2e blueprints/statping-ng"

[variables]
main_domain = "${domain}"

[config.env]
DB_CONN = "sqlite"
TZ = "UTC"

[[config.domains]]
serviceName = "statping-ng"
port = 8080
host = "${main_domain}"

id = "booklore"
name = "Booklore"
description = "Booklore is an application for managing and serving book-related data, backed by a MariaDB database."
category = "media"
tags = [
    "books",
    "library",
    "database",
    "mariadb",
]
version = "latest"
logo = "logo.png"
website = "https://github.com/booklore-app/BookLore"
docs = "https://github.com/booklore-app/BookLore/tree/develop/docs"
source = "https://github.com/booklore-app/BookLore"
upstream = "Dokploy/templates@6313a2e blueprints/booklore"

[variables]
app_password = "${password:32}"
db_root_password = "${password:32}"
main_domain = "${domain}"

[config.env]
BOOKLORE_IMAGE_TAG = "latest"
MYSQL_DATABASE = "booklore"
MYSQL_PASSWORD = "${app_password}"
MYSQL_ROOT_PASSWORD = "${db_root_password}"
MYSQL_USER = "booklore"
PGID = "1000"
PUID = "1000"
TZ = "Etc/UTC"

[[config.domains]]
serviceName = "booklore"
port = 6060
host = "${main_domain}"

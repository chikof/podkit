id = "strapi"
name = "Strapi"
description = "Strapi is an open-source headless CMS for building APIs and managing content."
category = "cms"
tags = [
    "headless",
    "cms",
    "content-management",
]
version = "v5.33.0"
logo = "logo.svg"
website = "https://strapi.io"
docs = "https://docs.strapi.io"
source = "https://github.com/strapi/strapi"
upstream = "Dokploy/templates@6313a2e blueprints/strapi"

[variables]
admin_jwt_secret = "${password:32}"
jwt_secret = "${password:32}"
main_domain = "${domain}"
postgres_password = "${password:32}"

[config.env]
ADMIN_JWT_SECRET = "${admin_jwt_secret}"
JWT_SECRET = "${jwt_secret}"
POSTGRES_PASSWORD = "${postgres_password}"

[[config.domains]]
serviceName = "strapi"
port = 1337
host = "${main_domain}"

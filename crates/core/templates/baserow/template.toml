id = "baserow"
name = "Baserow"
description = "Baserow is an open source database management tool that allows you to create and manage databases."
category = "database"
tags = ["database"]
version = "1.25.2"
logo = "@baserow"
website = "https://baserow.io/"
docs = "https://baserow.io/docs/index"
source = "https://github.com/Baserow/baserow"
upstream = "Dokploy/templates@6313a2e blueprints/baserow"

[variables]
main_domain = "${domain}"

[config.env]
BASEROW_HOST = "${main_domain}"

[[config.domains]]
serviceName = "baserow"
port = 80
host = "${main_domain}"

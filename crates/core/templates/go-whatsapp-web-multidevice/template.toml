id = "go-whatsapp-web-multidevice"
name = "WhatsApp API Multi Device Version"
description = "WhatsApp API Multi Device Version the open-source, self-hosted whatsapp api. Send a chat, image and voice note with your own server."
category = "communication"
tags = [
    "whatsapp",
    "self-hosted",
    "open-source",
    "api",
]
version = "latest"
logo = "logo.svg"
website = "https://github.com/aldinokemal/go-whatsapp-web-multidevice"
docs = "https://github.com/aldinokemal/go-whatsapp-web-multidevice"
source = "https://github.com/aldinokemal/go-whatsapp-web-multidevice"
upstream = "Dokploy/templates@6313a2e blueprints/go-whatsapp-web-multidevice"

[variables]
main_domain = "${domain}"
wa_password = "${password:32}"
wa_user = "admin"

[config.env]
WA_PASSWORD = "${wa_password}"
WA_USER = "${wa_user}"

[[config.domains]]
serviceName = "whatsapp"
port = 3080
host = "${main_domain}"

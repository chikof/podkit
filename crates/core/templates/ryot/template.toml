id = "ryot"
name = "Ryot"
description = "A self-hosted platform for tracking various media types including movies, TV shows, video games, books, audiobooks, and more."
category = "media"
tags = [
    "media",
    "tracking",
    "self-hosted",
]
version = "v7.10"
logo = "logo.png"
website = "https://ryot.io/"
docs = "https://docs.ryot.io/"
source = "https://github.com/IgnisDa/ryot"
upstream = "Dokploy/templates@6313a2e blueprints/ryot"

[variables]
admin_access_token = "${base64:32}"
main_domain = "${domain}"
postgres_password = "${password}"

[config.env]
ADMIN_ACCESS_TOKEN = "${admin_access_token}"
POSTGRES_PASSWORD = "${postgres_password}"

[[config.domains]]
serviceName = "ryot-app"
port = 8000
host = "${main_domain}"

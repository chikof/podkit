id = "kortix"
name = "Kortix"
description = "Kortix is an open source AI Operating System: AI agents that do real work for your team, with your own models and tools."
category = "ai"
tags = [
    "ai",
    "agents",
    "automation",
    "self-hosted",
]
version = "0.14.19"
logo = "logo.svg"
website = "https://kortix.com"
docs = "https://kortix.com/docs/developers#self-hosting"
source = "https://github.com/kortix-ai/suna"
upstream = "Dokploy/templates@6313a2e blueprints/kortix"

[variables]
api_domain = "${domain}"
jwt_secret = "${password:128}"
kortix_secret_seed = "${password:64}"
main_domain = "${domain}"
postgres_password = "${password:64}"
supabase_domain = "${domain}"

[config.env]
API_PUBLIC_URL = "https://${api_domain}"
COMPOSIO_API_KEY = ""
DISABLE_SIGNUP = "false"
EMAIL_FROM = ""
EMAIL_URL = ""
JWT_SECRET = "${jwt_secret}"
KORTIX_ADMIN_EMAIL = "REPLACE_ME"
KORTIX_SECRET_SEED = "${kortix_secret_seed}"
PLATINUM_API_KEY = "REPLACE_ME"
POSTGRES_PASSWORD = "${postgres_password}"
PUBLIC_URL = "https://${main_domain}"
SUPABASE_PUBLIC_URL = "https://${supabase_domain}"

[[config.domains]]
serviceName = "frontend"
port = 3000
host = "${main_domain}"

[[config.domains]]
serviceName = "api"
port = 8008
host = "${api_domain}"

[[config.domains]]
serviceName = "kong"
port = 8000
host = "${supabase_domain}"

id = "memos"
name = "Memos"
description = "Memos is a self-hosted, open-source note-taking application that allows you to create, organize, and share notes with ease. It provides a simple and effective solution for managing your notes from anywhere."
category = "productivity"
tags = [
    "productivity",
    "notes",
    "bookmarks",
]
version = "latest"
logo = "logo.png"
website = "https://www.usememos.com/"
docs = "https://www.usememos.com/docs"
source = "https://github.com/usememos/memos"
upstream = "Dokploy/templates@6313a2e blueprints/memos"

[variables]
main_domain = "${domain}"

[config.env]
MEMOS_MODE = "prod"
MEMOS_PORT = "5230"

[[config.domains]]
serviceName = "memos"
port = 5230
host = "${main_domain}"

id = "yt-dlp-webui"
name = "yt-dlp-webui"
description = "yt-dlp-webui is a web interface for yt-dlp, allowing you to download videos and audio from various platforms with a simple web UI."
category = "media"
tags = [
    "downloader",
    "youtube",
    "media",
    "webui",
]
version = "latest"
logo = "@mono-yt-dlp-webui"
website = "https://github.com/marcopiovanello/yt-dlp-web-ui"
docs = "https://github.com/marcopiovanello/yt-dlp-web-ui"
source = "https://github.com/marcopiovanello/yt-dlp-web-ui"
upstream = "Dokploy/templates@6313a2e blueprints/yt-dlp-webui"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "yt-dlp-webui"
port = 3033
host = "${main_domain}"

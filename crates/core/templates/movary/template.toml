id = "movary"
name = "Movary"
description = "Movary is a self-hosted platform for tracking and managing your watched movies using TMDB."
category = "media"
tags = [
    "media",
    "movies",
    "movie-tracker",
    "self-hosted",
    "plex",
    "jellyfin",
    "emby",
    "kodi",
    "trakt",
    "letterboxd",
    "netflix",
    "tmdb",
    "statistics",
    "rating",
]
version = "latest"
logo = "logo.png"
website = "https://movary.org/"
docs = "https://docs.movary.org/"
source = "https://github.com/leepeuker/movary"
upstream = "Dokploy/templates@6313a2e blueprints/movary"

[variables]
main_domain = "${domain}"
mysql_password = "${password:32}"
mysql_root_password = "${password:32}"
tmdb_api_key = ""

[config.env]
APP_ENV = "production"
APP_URL = "http://${main_domain}"
MOVARY_VERSION = "latest"
MYSQL_PASSWORD = "${mysql_password}"
MYSQL_ROOT_PASSWORD = "${mysql_root_password}"
MYSQL_VERSION = "8.0"
TMDB_API_KEY = "${tmdb_api_key}"

[[config.domains]]
serviceName = "movary"
port = 8080
host = "${main_domain}"

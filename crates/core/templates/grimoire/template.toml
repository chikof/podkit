id = "grimoire"
name = "Grimoire"
description = "Grimoire is a self-hosted bookmarking app designed for speed and simplicity."
category = "productivity"
tags = [
    "bookmarks",
    "self-hosted",
    "knowledge-management",
]
version = "latest"
logo = "@mono-grimoire"
website = "https://github.com/goniszewski/grimoire"
docs = "https://github.com/goniszewski/grimoire"
source = "https://github.com/goniszewski/grimoire"
upstream = "Dokploy/templates@6313a2e blueprints/grimoire"

[variables]
main_domain = "${domain}"

[config.env]
PORT = "5173"
PUBLIC_HTTPS_ONLY = "true"
PUBLIC_ORIGIN = "https://${main_domain}"
PUBLIC_SIGNUP_DISABLED = "false"

[[config.domains]]
serviceName = "grimoire"
port = 5173
host = "${main_domain}"

id = "carbone"
name = "Carbone"
description = "Carbone is a high-performance, self-hosted document generation engine. It allows you to generate reports, invoices, and documents in various formats (e.g., PDF, DOCX, XLSX) using JSON data and template-based rendering."
category = "automation"
tags = [
    "document-generation",
    "automation",
    "reporting",
    "productivity",
]
version = "4.25.5"
logo = "logo.png"
website = "https://carbone.io/"
docs = "https://carbone.io/documentation/design/overview/getting-started.html"
source = "https://github.com/carboneio/carbone"
upstream = "Dokploy/templates@6313a2e blueprints/carbone"

[variables]
carbone_key = "${password:32}"
main_domain = "${domain}"

[config.env]
CARBONE_KEY = "${carbone_key}"

[[config.domains]]
serviceName = "carbone"
port = 4000
host = "${main_domain}"

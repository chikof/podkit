id = "zeqqat"
name = "Zeqqat"
description = "Per-tool permissions, team roles and a full log of every call."
category = "ai"
tags = [
    "ai",
    "mcp",
    "devops",
    "security",
]
version = "latest"
logo = "logo.svg"
website = "https://zeqqat.com"
docs = "https://zeqqat.com/docs/self-host"
source = "https://github.com/zeqqat/zeqqat"
upstream = "Dokploy/templates@6313a2e blueprints/zeqqat"

[variables]
auth_secret = "${base64:32}"
encryption_key = "${base64:32}"
main_domain = "${domain}"
postgres_password = "${password:32}"

[config.env]
BETTER_AUTH_SECRET = "${auth_secret}"
POSTGRES_PASSWORD = "${postgres_password}"
ZEQQAT_ENCRYPTION_KEY = "${encryption_key}"
ZEQQAT_PUBLIC_URL = "https://${main_domain}"

[[config.domains]]
serviceName = "zeqqat"
port = 3000
host = "${main_domain}"

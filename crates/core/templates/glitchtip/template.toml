id = "glitchtip"
name = "Glitchtip"
description = "Glitchtip is simple, open source error tracking"
category = "development"
tags = ["hosting"]
version = "6.1.0"
logo = "logo.png"
website = "https://glitchtip.com/"
docs = "https://glitchtip.com/documentation"
source = "https://gitlab.com/glitchtip/"
upstream = "Dokploy/templates@6313a2e blueprints/glitchtip"

[variables]
main_domain = "${domain}"
secret_key = "${base64:32}"

[config.env]
DEFAULT_FROM_EMAIL = "${email}"
GLITCHTIP_DOMAIN = "https://${main_domain}"
GLITCHTIP_PORT = "8000"
SECRET_KEY = "${secret_key}"

[[config.domains]]
serviceName = "web"
port = 8000
host = "${main_domain}"

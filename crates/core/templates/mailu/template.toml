id = "mailu"
name = "Mailu"
description = "Full-featured open-source mail server as a set of Docker containers: SMTP (Postfix), IMAP (Dovecot), Rspamd antispam, admin UI with DKIM management and Roundcube webmail."
category = "communication"
tags = [
    "email",
    "mail-server",
    "smtp",
    "imap",
    "antispam",
    "webmail",
]
version = "2024.06"
logo = "logo.svg"
website = "https://mailu.io/"
docs = "https://mailu.io/2024.06/"
source = "https://github.com/Mailu/Mailu"
upstream = "Dokploy/templates@6313a2e blueprints/mailu"
reveal = ["admin_password"]

[variables]
admin_password = "${password:32}"
main_domain = "${domain}"
secret_key = "${password:16}"

[config.env]
DOMAIN = "${main_domain}"
INITIAL_ADMIN_ACCOUNT = "admin"
INITIAL_ADMIN_PW = "${admin_password}"
SECRET_KEY = "${secret_key}"
SUBNET = "172.16.0.0/12"

[[config.domains]]
serviceName = "front"
port = 80
host = "${main_domain}"

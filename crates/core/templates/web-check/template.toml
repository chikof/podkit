id = "web-check"
name = "Web-Check"
description = "Web-Check is a powerful all-in-one website analyzer that provides detailed insights into any website's security, performance, and functionality."
category = "security"
tags = [
    "website-analyzer",
    "security",
    "performance",
    "seo",
]
version = "latest"
logo = "logo.png"
website = "https://github.com/lissy93/web-check"
docs = "https://github.com/lissy93/web-check"
source = "https://github.com/lissy93/web-check"
upstream = "Dokploy/templates@6313a2e blueprints/web-check"

[variables]
main_domain = "${domain}"

[config.env]
API_CORS_ORIGIN = "*"
API_ENABLE_RATE_LIMIT = "true"
API_TIMEOUT_LIMIT = "10000"
BUILT_WITH_API_KEY = ""
CLOUDMERSIVE_API_KEY = ""
DISABLE_GUI = "false"
ENABLE_ANALYTICS = "false"
GOOGLE_CLOUD_API_KEY = ""
PORT = "3000"
REACT_APP_SHODAN_API_KEY = ""
REACT_APP_WHO_API_KEY = ""
SECURITY_TRAILS_API_KEY = ""
TORRENT_IP_API_KEY = ""
TRANCO_API_KEY = ""
TRANCO_USERNAME = ""
URL_SCAN_API_KEY = ""

[[config.domains]]
serviceName = "web-check"
port = 3000
host = "${main_domain}"

id = "codex-docs"
name = "CodeX Docs"
description = "CodeX is a comprehensive platform that brings together passionate engineers, designers, and specialists to create high-quality open-source projects. It includes Editor.js, Hawk.so, CodeX Notes, and more."
category = "productivity"
tags = [
    "documentation",
    "development",
    "collaboration",
]
version = "v2.2"
logo = "logo.svg"
website = "https://codex.so"
docs = "https://docs.codex.so"
source = "https://github.com/codex-team/codex.docs"
upstream = "Dokploy/templates@6313a2e blueprints/codex-docs"
reveal = ["AUTH_PASSWORD"]

[variables]
AUTH_PASSWORD = "${password:16}"
AUTH_SECRET = "${password:32}"
MONGO_PASSWORD = "${password:16}"

[config.env]
AUTH_PASSWORD = "${AUTH_PASSWORD}"
AUTH_SECRET = "${AUTH_SECRET}"
MONGO_PASSWORD = "${MONGO_PASSWORD}"
MONGO_USERNAME = "mongo"

[[config.domains]]
serviceName = "codex"
port = 3000
host = "${domain}"

[[config.mounts]]
filePath = "/docs-config.yaml"
content = """
# Custom Config, view Here https://github.com/codex-team/codex.docs/blob/main/docs-config.yaml
# Can Also Be configured with ENV, see here https://docs.codex.so/configuration#override-properties-with-environment-variables
"""

id = "heyform"
name = "HeyForm"
description = "Allows anyone to create engaging conversational forms for surveys, questionnaires, quizzes, and polls. No coding skills required."
category = "other"
tags = [
    "form",
    "builder",
    "questionnaire",
    "quiz",
    "survey",
]
version = "v0.1.0"
logo = "logo.svg"
website = "https://heyform.net"
docs = "https://docs.heyform.net"
source = "https://github.com/heyform/heyform"
upstream = "Dokploy/templates@6313a2e blueprints/heyform"

[variables]
form_encryption_key = "${base64:64}"
main_domain = "${domain}"
session_key = "${base64:64}"

[config.env]
APP_HOMEPAGE_URL = "http://${main_domain}"
FORM_ENCRYPTION_KEY = "${form_encryption_key}"
SESSION_KEY = "${session_key}"
SMTP_FROM = "HeyForm <noreply@${main_domain}>"
SMTP_HOST = ""
SMTP_IGNORE_CERT = "false"
SMTP_PASSWORD = ""
SMTP_PORT = "587"
SMTP_SECURE = "false"
SMTP_USER = ""

[[config.domains]]
serviceName = "heyform"
port = 8000
host = "${main_domain}"

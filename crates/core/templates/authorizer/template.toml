id = "authorizer"
name = "Authorizer"
description = "Authorizer is a powerful tool designed to simplify the process of user authentication and authorization in your applications. It allows you to build secure apps 10x faster with its low code tool and low-cost deployment."
category = "security"
tags = [
    "authentication",
    "authorization",
    "security",
]
version = "1.4.4"
logo = "logo.png"
website = "https://authorizer.dev"
docs = "https://docs.authorizer.dev/"
source = "https://github.com/authorizerdev/authorizer"
upstream = "Dokploy/templates@6313a2e blueprints/authorizer"

[variables]
admin_secret = "${password:32}"
db_password = "${password:16}"
jwt_secret = "${password:32}"
main_domain = "${domain}"

[config.env]
ADMIN_SECRET = "${admin_secret}"
DB_PASSWORD = "${db_password}"
JWT_SECRET = "${jwt_secret}"

[[config.domains]]
serviceName = "authorizer"
port = 8080
host = "${main_domain}"

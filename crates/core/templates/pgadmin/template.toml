id = "pgadmin"
name = "pgAdmin"
description = "pgAdmin is an administration and management tool for PostgreSQL databases."
category = "database"
tags = [
    "database",
    "postgres",
    "admin",
]
version = "8.3"
logo = "@pgadmin"
website = "https://www.pgadmin.org/"
docs = "https://www.pgadmin.org/docs/"
source = "https://github.com/pgadmin-org/pgadmin4"
upstream = "Dokploy/templates@6313a2e blueprints/pgadmin"
reveal = ["admin_password"]

[variables]
admin_email = "user@example.com"
admin_password = "${password:16}"
main_domain = "${domain}"

[config.env]
PGADMIN_DEFAULT_EMAIL = "${admin_email}"
PGADMIN_DEFAULT_PASSWORD = "${admin_password}"

[[config.domains]]
serviceName = "pgadmin"
port = 80
host = "${main_domain}"

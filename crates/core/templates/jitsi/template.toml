id = "jitsi"
name = "Jitsi Meet"
description = "Jitsi Meet is an open-source video conferencing platform for secure, self-hosted meetings."
category = "other"
tags = [
    "video-conferencing",
    "meetings",
    "self-hosted",
    "webrtc",
]
version = "1.0.0"
logo = "logo.svg"
website = "https://jitsi.org/jitsi-meet/"
docs = "https://jitsi.github.io/handbook/docs/devops-guide/devops-guide-docker"
source = "https://github.com/jitsi/docker-jitsi-meet"
upstream = "Dokploy/templates@6313a2e blueprints/jitsi"
reveal = [
    "jicofo_auth_password",
    "jvb_auth_password",
]

[variables]
jicofo_auth_password = "${password:32}"
jicofo_component_secret = "${password:32}"
jitsi_image_version = "unstable"
jvb_auth_password = "${password:32}"
main_domain = "${domain}"

[config.env]
DISABLE_HTTPS = "1"
ENABLE_AUTH = "0"
ENABLE_COLIBRI_WEBSOCKET = "1"
ENABLE_GUESTS = "1"
ENABLE_HTTP_REDIRECT = "0"
ENABLE_LETSENCRYPT = "0"
ENABLE_XMPP_WEBSOCKET = "1"
JICOFO_AUTH_PASSWORD = "${jicofo_auth_password}"
JICOFO_AUTH_USER = "focus"
JICOFO_COMPONENT_SECRET = "${jicofo_component_secret}"
JITSI_IMAGE_VERSION = "${jitsi_image_version}"
JVB_ADVERTISE_IPS = ""
JVB_AUTH_PASSWORD = "${jvb_auth_password}"
JVB_AUTH_USER = "jvb"
JVB_BREWERY_MUC = "jvbbrewery"
JVB_PORT = "10000"
JWT_APP_ID = ""
JWT_APP_SECRET = ""
PUBLIC_URL = "https://${main_domain}"
TZ = "UTC"
XMPP_AUTH_DOMAIN = "auth.meet.jitsi"
XMPP_BOSH_URL_BASE = "http://prosody:5280"
XMPP_DOMAIN = "meet.jitsi"
XMPP_GUEST_DOMAIN = "guest.meet.jitsi"
XMPP_INTERNAL_MUC_DOMAIN = "internal-muc.meet.jitsi"
XMPP_MUC_DOMAIN = "muc.meet.jitsi"
XMPP_RECORDER_DOMAIN = "recorder.meet.jitsi"

[[config.domains]]
serviceName = "web"
port = 8000
host = "${main_domain}"

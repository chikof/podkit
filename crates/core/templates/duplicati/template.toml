id = "duplicati"
name = "Duplicati"
description = "Duplicati is a free, open-source backup solution that offers zero-trust, fully encrypted backups for your data"
category = "backup"
tags = [
    "backup",
    "self-hosted",
    "simple",
]
version = "2.3.0"
logo = "@duplicati"
website = "https://duplicati.com/"
docs = "https://docs.duplicati.com/"
source = "https://github.com/duplicati/duplicati"
upstream = "Dokploy/templates@6313a2e blueprints/duplicati"

[variables]
main_domain = "${domain}"

[config.env]
APP_RELEASE = "2.3.0"
DUPLICATI__WEBSERVICE_PASSWORD = "${password:16}"
SETTINGS_ENCRYPTION_KEY = "${password:32}"
TZ = "Europe/Vienna"

[[config.domains]]
serviceName = "duplicati"
port = 8200
host = "${main_domain}"

id = "opengist"
name = "OpenGist"
description = "OpenGist is a self-hosted pastebin alternative."
category = "development"
tags = [
    "pastebin",
    "code",
    "snippets",
    "self-hosted",
]
version = "1"
logo = "logo.svg"
website = "https://github.com/thomiceli/opengist"
docs = "https://github.com/thomiceli/opengist"
source = "https://github.com/thomiceli/opengist"
upstream = "Dokploy/templates@6313a2e blueprints/opengist"

[variables]
main_domain = "${domain}"

[config.env]
GID = "1001"
OG_LOG_LEVEL = "info"
UID = "1001"

[[config.domains]]
serviceName = "opengist"
port = 6157
host = "${main_domain}"

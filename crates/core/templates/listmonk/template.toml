id = "listmonk"
name = "Listmonk"
description = "High performance, self-hosted, newsletter and mailing list manager with a modern dashboard."
category = "communication"
tags = [
    "email",
    "newsletter",
    "mailing-list",
]
version = "v3.0.0"
logo = "logo.png"
website = "https://listmonk.app/"
docs = "https://listmonk.app/docs/"
source = "https://github.com/knadh/listmonk"
upstream = "Dokploy/templates@6313a2e blueprints/listmonk"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "app"
port = 9000
host = "${main_domain}"

[[config.mounts]]
filePath = "config.toml"
content = """
[app]
address = "0.0.0.0:9000"

[db]
host = "db"
port = 5432
user = "listmonk"
password = "listmonk"
database = "listmonk"

ssl_mode = "disable"
max_open = 25
max_idle = 25
max_lifetime = "300s"

params = ""
"""

id = "langflow"
name = "Langflow"
description = "Langflow is a low-code app builder for RAG and multi-agent AI applications. It's Python-based and agnostic to any model, API, or database."
category = "ai"
tags = ["ai"]
version = "1.1.1"
logo = "logo.svg"
website = "https://www.langflow.org/"
docs = "https://docs.langflow.org/"
source = "https://github.com/langflow-ai/langflow/tree/main"
upstream = "Dokploy/templates@6313a2e blueprints/langflow"

[variables]
db_password = "${password}"
db_username = "langflow"
main_domain = "${domain}"

[config.env]
DB_PASSWORD = "${db_password}"
DB_USERNAME = "${db_username}"

[[config.domains]]
serviceName = "langflow"
port = 7860
host = "${main_domain}"

id = "firefly-iii"
name = "Firefly III"
description = "Firefly III is a personal finance manager for tracking budgets and expenses."
category = "finance"
tags = [
    "finance",
    "budgeting",
    "self-hosted",
]
version = "6.6.3"
logo = "logo.svg"
website = "https://www.firefly-iii.org/"
docs = "https://docs.firefly-iii.org/"
source = "https://github.com/firefly-iii/firefly-iii"
upstream = "Dokploy/templates@6313a2e blueprints/firefly-iii"

[variables]
app_key = "${base64:32}"
cron_token = "${hash:32}"
db_name = "firefly"
db_password = "${password:32}"
db_user = "firefly"
default_language = "en_US"
default_locale = "equal"
main_domain = "${domain}"
site_owner = "${email}"
timezone = "UTC"

[config.env]
APP_KEY = "base64:${app_key}"
APP_URL = "https://${main_domain}"
DB_DATABASE = "${db_name}"
DB_PASSWORD = "${db_password}"
DB_USERNAME = "${db_user}"
DEFAULT_LANGUAGE = "${default_language}"
DEFAULT_LOCALE = "${default_locale}"
MYSQL_DATABASE = "${db_name}"
MYSQL_PASSWORD = "${db_password}"
MYSQL_RANDOM_ROOT_PASSWORD = "yes"
MYSQL_USER = "${db_user}"
SITE_OWNER = "${site_owner}"
STATIC_CRON_TOKEN = "${cron_token}"
TRUSTED_PROXIES = "**"
TZ = "${timezone}"

[[config.domains]]
serviceName = "firefly-iii"
port = 8080
host = "${main_domain}"

id = "emaki-video-starter"
name = "Seedance 2.5 Video Generator"
description = "One-page text-to-video and image-to-video web app on the Seedance 2.5 API from emaki. Set EMAKI_API_KEY; an access password is generated so only people you share it with can spend your credits."
category = "ai"
tags = [
    "ai",
    "video-generation",
    "text-to-video",
]
version = "1.0.0"
logo = "logo.png"
website = "https://emaki.ai/seedance-2-5"
docs = "https://emaki.readthedocs.io/"
source = "https://github.com/hanshs474/emaki-video-starter"
upstream = "Dokploy/templates@6313a2e blueprints/emaki-video-starter"

[variables]
access_password = "${password:16}"
main_domain = "${domain}"

[config.env]
ACCESS_PASSWORD = "${access_password}"
EMAKI_API_KEY = ""
EMAKI_MODEL = "seedance_2_5"

[[config.domains]]
serviceName = "emaki-video-starter"
port = 3000
host = "${main_domain}"

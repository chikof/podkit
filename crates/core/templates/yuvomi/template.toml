id = "yuvomi"
name = "Yuvomi"
description = "Privacy-first, self-hosted family planner: tasks, calendar sync, shopping, meals, budget, health and more in one PWA. No cloud, no subscriptions, no tracking."
category = "productivity"
tags = [
    "open-source",
    "family",
    "productivity",
    "calendar",
    "tasks",
]
version = "2.80.0"
logo = "logo.svg"
website = "https://yuvomi.cloud/"
docs = "https://github.com/ulsklyc/yuvomi#readme"
source = "https://github.com/ulsklyc/yuvomi"
upstream = "Dokploy/templates@6313a2e blueprints/yuvomi"

[variables]
db_encryption_key = "${password:64}"
main_domain = "${domain}"
session_secret = "${password:64}"

[config.env]
DB_ENCRYPTION_KEY = "${db_encryption_key}"
DOCUMENT_STORAGE_LOCAL_ENABLED = "false"
SESSION_SECRET = "${session_secret}"
SESSION_SECURE = "true"
TRUST_PROXY = "1"

[[config.domains]]
serviceName = "yuvomi"
port = 3000
host = "${main_domain}"

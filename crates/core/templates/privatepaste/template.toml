id = "privatepaste"
name = "PrivatePaste"
description = "Self-hosted clipboard sync: copy on one device, paste on your others, with an encrypted, searchable history and apps for Windows, macOS, Linux and Android."
category = "productivity"
tags = [
    "productivity",
    "clipboard",
    "sync",
]
version = "0.5.0"
logo = "logo.svg"
website = "https://github.com/DynamicsNinja/privatepaste"
docs = "https://github.com/DynamicsNinja/privatepaste/blob/main/docs/self-hosting.md"
source = "https://github.com/DynamicsNinja/privatepaste"
upstream = "Dokploy/templates@6313a2e blueprints/privatepaste"
reveal = ["login_password"]

[variables]
db_key = "${base64:32}"
login_password = "${password:24}"
main_domain = "${domain}"

[config.env]
PP_DB_KEY = "${db_key}"
PP_MAX_FILE_MB = "25"
PP_MAX_IMAGE_MB = "20"
PP_MAX_TEXT_KB = "1024"
PP_PASSWORD = "${login_password}"
PP_TRUST_CLOUDFLARE = "false"

[[config.domains]]
serviceName = "privatepaste"
port = 8080
host = "${main_domain}"

id = "automatisch"
name = "Automatisch"
description = "Automatisch is a powerful, self-hosted workflow automation tool designed for connecting your apps and automating repetitive tasks. With Automatisch, you can create workflows to sync data, send notifications, and perform various actions seamlessly across different services."
category = "automation"
tags = [
    "automation",
    "workflow",
    "integration",
]
version = "0.15.0"
logo = "logo.png"
website = "https://automatisch.io/docs"
docs = "https://automatisch.io/docs"
source = "https://github.com/automatisch/automatisch"
upstream = "Dokploy/templates@6313a2e blueprints/automatisch"

[variables]
app_secret_key = "${password:32}"
db_password = "${password:16}"
encryption_key = "${password:32}"
main_domain = "${domain}"
redis_password = "${password:16}"
webhook_secret_key = "${password:32}"

[config.env]
APP_SECRET_KEY = "${app_secret_key}"
DB_PASSWORD = "${db_password}"
DOMAIN = "${main_domain}"
ENCRYPTION_KEY = "${encryption_key}"
REDIS_PASSWORD = "${redis_password}"
WEBHOOK_SECRET_KEY = "${webhook_secret_key}"

[[config.domains]]
serviceName = "automatisch"
port = 3000
host = "${main_domain}"

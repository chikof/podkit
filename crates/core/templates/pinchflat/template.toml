id = "pinchflat"
name = "Pinchflat"
description = "Pinchflat is a self-hosted YouTube downloader that allows you to download videos and playlists with a simple web interface."
category = "media"
tags = [
    "youtube",
    "downloader",
    "media",
]
version = "latest"
logo = "@mono-pinchflat"
website = "https://github.com/kieraneglin/pinchflat"
docs = "https://github.com/kieraneglin/pinchflat"
source = "https://github.com/kieraneglin/pinchflat"
upstream = "Dokploy/templates@6313a2e blueprints/pinchflat"
reveal = ["basic_auth_password"]

[variables]
basic_auth_password = "${password:32}"
main_domain = "${domain}"

[config.env]
BASE_ROUTE_PATH = "/"
BASIC_AUTH_PASSWORD = "${basic_auth_password}"
BASIC_AUTH_USERNAME = ""
ENABLE_IPV6 = "false"
ENABLE_PROMETHEUS = "false"
EXPOSE_FEED_ENDPOINTS = "false"
JOURNAL_MODE = "wal"
LOG_LEVEL = "debug"
TZ = "America/New_York"
TZ_DATA_DIR = "/etc/elixir_tzdata_data"
UMASK = "022"
YT_DLP_WORKER_CONCURRENCY = "2"

[[config.domains]]
serviceName = "pinchflat"
port = 8945
host = "${main_domain}"

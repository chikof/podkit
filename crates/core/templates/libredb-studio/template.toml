id = "libredb-studio"
name = "LibreDB Studio"
description = "The open-source SQL IDE you host yourself. Query PostgreSQL, MySQL, Oracle, SQL Server, MongoDB, Redis, ClickHouse, Cassandra and more from your browser, forty-two drivers reaching sixty-nine named engines."
category = "database"
tags = [
    "database",
    "sql",
]
version = "1.3.0"
logo = "logo.svg"
website = "https://libredb.org/"
docs = "https://libredb.org/"
source = "https://github.com/libredb/libredb-studio"
upstream = "Dokploy/templates@6313a2e blueprints/libredb-studio"
reveal = ["admin_password"]

[variables]
admin_password = "${password:32}"
jwt_secret = "${password:64}"
user_password = "${password:32}"

[config.env]
ADMIN_PASSWORD = "${admin_password}"
JWT_SECRET = "${jwt_secret}"
USER_PASSWORD = "${user_password}"

[[config.domains]]
serviceName = "libredb-studio"
port = 3000

id = "unleash"
name = "Unleash"
description = "Open-source feature management platform"
category = "other"
tags = [
    "feature-flag",
    "feature-management",
    "feature-toggle",
    "remote-configuration",
]
version = "7.4.0"
logo = "logo.png"
website = "https://www.getunleash.io/"
docs = "https://docs.getunleash.io/"
source = "https://github.com/unleash/unleash"
upstream = "Dokploy/templates@6313a2e blueprints/unleash"

[variables]
db_name = "unleash"
db_password = "${password:32}"
db_user = "unleash"
main_domain = "${domain}"

[config.env]
DB_NAME = "${db_name}"
DB_PASSWORD = "${db_password}"
DB_USER = "${db_user}"

[[config.domains]]
serviceName = "unleash"
port = 4242
host = "${main_domain}"

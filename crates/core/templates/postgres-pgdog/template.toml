id = "postgres-pgdog"
name = "PostgreSQL with PgDog"
description = "PostgreSQL database with PgDog connection pooler, load balancer, and horizontal scaling proxy. A modern alternative to PgBouncer with multi-threading support."
category = "database"
tags = [
    "database",
    "postgresql",
    "pooler",
    "proxy",
    "load-balancer",
]
version = "0.1.26"
logo = "logo.png"
website = "https://pgdog.dev"
docs = "https://docs.pgdog.dev"
source = "https://github.com/pgdogdev/pgdog"
upstream = "Dokploy/templates@6313a2e blueprints/postgres-pgdog"

[variables]
pgdog_image = "ghcr.io/pgdogdev/pgdog:v0.1.26"
postgres_db = "postgres"
postgres_image = "postgres:18-alpine"
postgres_password = "${password:32}"
postgres_user = "${username}"

[config.env]
PGDOG_IMAGE = "${pgdog_image}"
POSTGRES_DB = "${postgres_db}"
POSTGRES_IMAGE = "${postgres_image}"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_USER = "${postgres_user}"
RUST_LOG = "info"

[[config.mounts]]
filePath = "pgdog.toml"
content = """
[general]
host = "0.0.0.0"
port = 6432

[[databases]]
name = "${postgres_db}"
host = "postgres"
port = 5432
"""

[[config.mounts]]
filePath = "users.toml"
content = """
[[users]]
name = "${postgres_user}"
database = "${postgres_db}"
password = "${postgres_password}"
"""

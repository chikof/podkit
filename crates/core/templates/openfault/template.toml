id = "openfault"
name = "OpenFault"
description = "Self-hosted, Sentry-compatible error tracker. One container, SQLite inside, built for coding agents."
category = "monitoring"
tags = ["monitoring"]
version = "0.1.0"
logo = "logo.svg"
website = "https://openfault.dev"
docs = "https://openfault.dev/docs/install"
source = "https://github.com/OpenFault/openfault"
upstream = "Dokploy/templates@6313a2e blueprints/openfault"

[variables]
main_domain = "${domain}"
setup_token = "${password:32}"

[config.env]
OPENFAULT_HOST = "${main_domain}"
OPENFAULT_SETUP_TOKEN = "${setup_token}"

[[config.domains]]
serviceName = "openfault"
port = 8080
host = "${main_domain}"

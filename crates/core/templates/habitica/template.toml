id = "habitica"
name = "Habitica"
description = "Habitica is a habit and productivity tracker that works like a role-playing game."
category = "productivity"
tags = [
    "productivity",
    "gamification",
    "habits",
    "self-hosted",
]
version = "latest"
logo = "logo.png"
website = "https://habitica.com/"
docs = "https://habitica.fandom.com/wiki/Setting_up_Habitica_Locally"
source = "https://github.com/HabitRPG/habitica"
upstream = "Dokploy/templates@6313a2e blueprints/habitica"

[variables]
mail_password = "${password:32}"
main_domain = "${domain}"
mongo_admin_password = "${password}"
mongo_habitica_password = "${password}"
mongo_key = "${base64:756}"

[config.env]
ADMIN_EMAIL = "no-reply@${main_domain}"
BASE_URL = "https://habitica.${main_domain}"
EMAIL_SERVER_AUTH_PASSWORD = "${mail_password}"
EMAIL_SERVER_AUTH_USER = "mail_user"
EMAIL_SERVER_PORT = "587"
EMAIL_SERVER_URL = "mail.example.com"
INVITE_ONLY = "false"
MONGO_ADMIN_PASSWORD = "${mongo_admin_password}"
MONGO_ADMIN_USER = "admin"
MONGO_HABITICA_PASSWORD = "${mongo_habitica_password}"
MONGO_HABITICA_USER = "habitica"
MONGO_KEYFILE_CONTENT = "${mongo_key}"

[[config.domains]]
serviceName = "client"
port = 80
host = "habitica.${main_domain}"

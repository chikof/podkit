id = "openobserve"
name = "Openobserve"
description = "OpenObserve (O2) is a cloud-native observability platform that unifies logs, metrics, and traces into one solution."
category = "monitoring"
tags = [
    "apm",
    "logs",
    "metrics",
    "monitoring",
    "observability",
    "opentelemetry",
    "traces",
]
version = "latest"
logo = "logo.svg"
website = "https://openobserve.ai/"
docs = "https://openobserve.ai/docs/"
source = "https://github.com/openobserve/openobserve"
upstream = "Dokploy/templates@6313a2e blueprints/openobserve"

[variables]
main_domain = "${domain}"
root_email = "${email}"
root_password = "${password:32}"

[config.env]
ZO_DATA_DIR = "/data"
ZO_ROOT_USER_EMAIL = "${root_email}"
ZO_ROOT_USER_PASSWORD = "${root_password}"

[[config.domains]]
serviceName = "openobserve"
port = 5080
host = "${main_domain}"

id = "fmd-server"
name = "FMD Server"
description = "A server to communicate with the FMD Android app, to locate and control your devices."
category = "security"
tags = [
    "phone",
    "security",
    "gps",
    "location",
]
version = "0.16.0"
logo = "logo.svg"
website = "https://fmd-foss.org"
docs = "https://fmd-foss.org/docs/fmd-server/overview"
source = "https://gitlab.com/fmd-foss/fmd-server"
upstream = "Dokploy/templates@6313a2e blueprints/fmd-server"

[variables]
main_domain = "${domain}"
registration_token = "${password:32}"

[config.env]
FMD_MAXSAVEDLOC = "1000"
FMD_MAXSAVEDPIC = "10"
FMD_REGISTRATIONTOKEN = "${registration_token}"
FMD_USERIDLENGTH = "5"

[[config.domains]]
serviceName = "fmd-server"
port = 8080
host = "${main_domain}"

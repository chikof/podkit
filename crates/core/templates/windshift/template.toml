id = "windshift"
name = "Windshift"
description = "Self-hosted work management platform with projects, tasks, sprints, and team collaboration."
category = "productivity"
tags = [
    "project-management",
    "collaboration",
    "productivity",
    "self-hosted",
]
version = "v0.9.3"
logo = "@mono-windshift"
website = "https://windshift.sh/"
docs = "https://windshift.sh/docs"
source = "https://github.com/Windshiftapp/core"
upstream = "Dokploy/templates@6313a2e blueprints/windshift"

[variables]
db_password = "${password:32}"
main_domain = "${domain}"
sso_secret = "${hash:64}"

[config.env]
DOMAIN = "${main_domain}"
POSTGRES_DB = "windshift"
POSTGRES_PASSWORD = "${db_password}"
POSTGRES_USER = "windshift"
SSO_SECRET = "${sso_secret}"

[[config.domains]]
serviceName = "windshift"
port = 8080
host = "${main_domain}"

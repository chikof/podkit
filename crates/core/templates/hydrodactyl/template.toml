id = "hydrodactyl"
name = "Hydrodactyl"
description = "Hydrodactyl is a modern, performance-focused game server management panel forked from Pterodactyl with smaller bundles and a reimagined interface."
category = "games"
tags = [
    "gaming",
    "dashboard",
    "self-hosted",
]
version = "v6.4.1"
logo = "logo.png"
website = "https://hydrodactyl.dev"
docs = "https://hydrodactyl.dev/docs/hydrodactyl"
source = "https://github.com/blueprintframework/hydrodactyl"
upstream = "Dokploy/templates@6313a2e blueprints/hydrodactyl"

[variables]
ADMIN_EMAIL = "admin@${domain}"
APP_SECRET = "${base64:32}"
DB_PASSWORD = "${password:24}"
DB_ROOT_PASSWORD = "${password:24}"
DOMAIN = "${domain}"

[config.env]
ADMIN_EMAIL = "${ADMIN_EMAIL}"
APP_SECRET = "${APP_SECRET}"
DB_PASSWORD = "${DB_PASSWORD}"
DB_ROOT_PASSWORD = "${DB_ROOT_PASSWORD}"
DOMAIN = "${DOMAIN}"

[[config.domains]]
serviceName = "panel"
port = 80
host = "${DOMAIN}"

id = "montara-mail"
name = "Montara Mail"
description = "AI mail client for teams: connect Gmail, Outlook, Yahoo, iCloud, Lark, Zoho or any IMAP mailbox and get inbox triage, summaries and suggested replies, with send/reply/forward built in."
category = "communication"
tags = [
    "email",
    "ai",
    "webmail",
]
version = "v1.8.0"
logo = "logo.png"
website = "https://montaramail.web.id"
docs = "https://docs.montaramail.web.id"
source = "https://github.com/montara-project/montara-mail-agent"
upstream = "Dokploy/templates@6313a2e blueprints/montara-mail"
reveal = ["super_user_password"]

[variables]
app_secret = "${base64:32}"
main_domain = "${domain}"
postgres_db = "montara_mail_agent"
postgres_password = "${password:32}"
postgres_user = "montara"
super_user_email = "${email}"
super_user_password = "${password:24}"

[config.env]
ANTHROPIC_API_KEY = ""
APP_SECRET = "${app_secret}"
BASE_URL = "${main_domain}"
FROM_ADDRESS = ""
GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""
OAUTH_GOOGLE_CLIENT_ID = ""
OAUTH_GOOGLE_CLIENT_SECRET = ""
OAUTH_MICROSOFT_CLIENT_ID = ""
OAUTH_MICROSOFT_CLIENT_SECRET = ""
OAUTH_YAHOO_CLIENT_ID = ""
OAUTH_YAHOO_CLIENT_SECRET = ""
OAUTH_ZOHO_CLIENT_ID = ""
OAUTH_ZOHO_CLIENT_SECRET = ""
POSTGRES_DB = "${postgres_db}"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_USER = "${postgres_user}"
RESEND_API_KEY = ""
SENTRY_DSN = ""
SUPER_USER = "${super_user_email}:${super_user_password}"
TRUSTED_PROXIES = "10.0.1.0/24,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"

[[config.domains]]
serviceName = "montara-mail"
port = 8080
host = "${main_domain}"

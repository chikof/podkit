id = "anonupload"
name = "AnonUpload"
description = "AnonUpload is a secure, anonymous file sharing application that does not require a database. It is built with privacy as a priority, ensuring that the direct filename used is not displayed."
category = "storage"
tags = [
    "file-sharing",
    "privacy",
]
version = "1"
logo = "@mono-anonupload"
website = "https://anonupload.com/"
docs = "https://github.com/Supernova3339/anonupload/blob/main/env.md"
source = "https://github.com/supernova3339/anonupload"
upstream = "Dokploy/templates@6313a2e blueprints/anonupload"
reveal = ["admin_password"]

[variables]
admin_email = "${email}"
admin_password = "${password:16}"
contact_email = "${email}"
main_domain = "${domain}"

[config.env]
ADMIN_EMAIL = "${admin_email}"
ADMIN_PASSWORD = "${admin_password}"
CONTACT_EMAIL = "${contact_email}"

[[config.domains]]
serviceName = "anonupload"
port = 80
host = "${main_domain}"

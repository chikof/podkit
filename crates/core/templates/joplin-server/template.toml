id = "joplin-server"
name = "Joplin Server"
description = "Joplin Server is the sync backend for the Joplin note-taking app."
category = "productivity"
tags = [
    "notes",
    "sync",
    "productivity",
]
version = "3.7.1"
logo = "logo.svg"
website = "https://joplinapp.org/"
docs = "https://github.com/laurent22/joplin/tree/dev/packages/server"
source = "https://github.com/laurent22/joplin"
upstream = "Dokploy/templates@6313a2e blueprints/joplin-server"

[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"

[config.env]
APP_BASE_URL = "http://${main_domain}"
APP_PORT = "22300"
POSTGRES_DATABASE = "joplin"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_USER = "joplin"

[[config.domains]]
serviceName = "joplin-server"
port = 22300
host = "${main_domain}"

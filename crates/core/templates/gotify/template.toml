id = "gotify"
name = "Gotify"
description = "Gotify is a simple server for sending and receiving self-hosted push notifications."
category = "other"
tags = [
    "notifications",
    "self-hosted",
    "push",
]
version = "2.9.1"
logo = "logo.svg"
website = "https://gotify.net/"
docs = "https://gotify.net/docs/"
source = "https://github.com/gotify/server"
upstream = "Dokploy/templates@6313a2e blueprints/gotify"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "gotify"
port = 80
host = "${main_domain}"

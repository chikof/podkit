id = "taiga"
name = "Taiga"
description = "Taiga is a free and open-source project management platform for agile developers, designers and project managers."
category = "productivity"
tags = [
    "project-management",
    "agile",
    "scrum",
    "kanban",
]
version = "latest"
logo = "logo.png"
website = "https://taiga.io/"
docs = "https://docs.taiga.io/"
source = "https://github.com/taigaio/taiga-docker"
upstream = "Dokploy/templates@6313a2e blueprints/taiga"

[variables]
main_domain = "${domain}"
postgres_password = "${password:32}"
postgres_user = "taiga"
rabbitmq_erlang_cookie = "${password:32}"
rabbitmq_password = "${password:32}"
rabbitmq_user = "taiga"
secret_key = "${password:64}"

[config.env]
ATTACHMENTS_MAX_AGE = "360"
EMAIL_BACKEND = "console"
EMAIL_DEFAULT_FROM = "changeme@example.com"
EMAIL_HOST = "smtp.example.com"
EMAIL_HOST_PASSWORD = "password"
EMAIL_HOST_USER = "user"
EMAIL_PORT = "587"
EMAIL_USE_SSL = "False"
EMAIL_USE_TLS = "False"
ENABLE_TELEMETRY = "False"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_USER = "${postgres_user}"
PUBLIC_REGISTER_ENABLED = "False"
PUBLIC_REGISTER_ENABLED_FRONT = "false"
RABBITMQ_ERLANG_COOKIE = "${rabbitmq_erlang_cookie}"
RABBITMQ_PASS = "${rabbitmq_password}"
RABBITMQ_USER = "${rabbitmq_user}"
RABBITMQ_VHOST = "taiga"
SECRET_KEY = "${secret_key}"
SUBPATH = ""
TAIGA_DOMAIN = "${main_domain}"
TAIGA_SCHEME = "https"
WEBSOCKETS_SCHEME = "wss"

[[config.domains]]
serviceName = "taiga-gateway"
port = 80
host = "${main_domain}"
path = "/"

[[config.mounts]]
filePath = "/volumes/nginx/taiga.conf"
content = """
server {
    listen 80 default_server;

    client_max_body_size 100M;
    charset utf-8;

    location / {
        proxy_pass http://taiga-front/;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
    }

    location /api/ {
        proxy_pass http://taiga-back:8000/api/;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
    }

    location /admin/ {
        proxy_pass http://taiga-back:8000/admin/;
        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
    }

    location /static/ {
        alias /taiga/static/;
    }

    location /_protected/ {
        internal;
        alias /taiga/media/;
        add_header Content-disposition "attachment";
    }

    location /media/exports/ {
        alias /taiga/media/exports/;
        add_header Content-disposition "attachment";
    }

    location /media/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://taiga-protected:8003/;
        proxy_redirect off;
    }

    location /events {
        proxy_pass http://taiga-events:8888/events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}
"""

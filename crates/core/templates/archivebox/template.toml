id = "archivebox"
name = "ArchiveBox"
description = "ArchiveBox is a self-hosted internet archiving solution for saving websites, media, and documents."
category = "productivity"
tags = [
    "archive",
    "bookmarks",
    "web",
]
version = "latest"
logo = "logo.svg"
website = "https://archivebox.io/"
docs = "https://docs.archivebox.io/"
source = "https://github.com/ArchiveBox/ArchiveBox"
upstream = "Dokploy/templates@6313a2e blueprints/archivebox"

[variables]
main_domain = "${domain}"

[config.env]
ALLOWED_HOSTS = "*"
PUBLIC_INDEX = "True"
PUBLIC_SNAPSHOTS = "True"

[[config.domains]]
serviceName = "archivebox"
port = 8000
host = "${main_domain}"

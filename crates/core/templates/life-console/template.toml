id = "life-console"
name = "Life Console"
description = "Life Console is a keyboard-first planner that shows what to do right now: time-block your week from a backlog, count down deadlines and link each task to the goal it serves. Multi-user, works offline and installs on phones."
category = "productivity"
tags = [
    "productivity",
    "planner",
    "time-blocking",
    "tasks",
]
version = "0.1.0"
logo = "@mono-life-console"
website = "https://life-console.dev"
docs = "https://life-console.dev/docs/self-hosting"
source = "https://github.com/TJ-coding/life-console"
upstream = "Dokploy/templates@6313a2e blueprints/life-console"

[variables]
db_password = "${password:32}"
main_domain = "${domain}"

[config.env]
APP_URL = "http://${main_domain}"
DB_PASSWORD = "${db_password}"

[[config.domains]]
serviceName = "app"
port = 8080
host = "${main_domain}"

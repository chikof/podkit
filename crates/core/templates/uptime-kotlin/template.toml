id = "uptime-kotlin"
name = "Uptime Kotlin"
description = "Uptime Kotlin is an open-source monitoring tool that tracks the uptime of your websites and services."
category = "monitoring"
tags = ["monitoring"]
version = "1.5.0"
logo = "@mono-uptime-kotlin"
website = "https://uptime-kotlin.com/"
docs = "https://uptime-kotlin.com/docs"
source = "https://github.com/TheoMeunier/uptime-kotlin"
upstream = "Dokploy/templates@6313a2e blueprints/uptime-kotlin"

[variables]
db_password = "${password:32}"
encryption_key = "${base64:64}"
main_domain = "${domain}"
timezone = "Europe/Paris"

[config.env]
ENCRYPTION_MASTER_KEY = "${encryption_key}"
MP_JWT_VERIFY_ISSUER = "https://${main_domain}/"
POSTGRES_PASSWORD = "${db_password}"
TZ = "${timezone}"

[[config.domains]]
serviceName = "uptime-kotlin"
port = 8080
host = "${main_domain}"

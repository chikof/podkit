id = "anse"
name = "Anse"
description = "Anse is an open-source alternative to ChatGPT web UI, supporting OpenAI-compatible APIs."
category = "ai"
tags = [
    "ai",
    "chatbot",
    "openai",
    "ui",
]
version = "latest"
logo = "logo.png"
website = "https://anse.app/"
docs = "https://github.com/ddiu8081/anse#readme"
source = "https://github.com/ddiu8081/anse"
upstream = "Dokploy/templates@6313a2e blueprints/anse"

[variables]
main_domain = "${domain}"
secret_key = "${password:32}"
site_password = "${password:16}"

[config.env]
HEAD_SCRIPTS = ""
OPENAI_API_BASE_URL = "https://api.openai.com"
OPENAI_API_KEY = ""
OPENAI_API_MODEL = "gpt-4o-mini"
SECRET_KEY = "${secret_key}"
SITE_PASSWORD = "${site_password}"

[[config.domains]]
serviceName = "anse-demo"
port = 3000
host = "${main_domain}"

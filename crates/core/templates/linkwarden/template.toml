id = "linkwarden"
name = "Linkwarden"
description = "Linkwarden is an open-source bookmark manager for saving, organizing, and archiving links."
category = "productivity"
tags = [
    "bookmarks",
    "link-sharing",
]
version = "2.9.3"
logo = "@mono-linkwarden"
website = "https://linkwarden.app/"
docs = "https://docs.linkwarden.app/"
source = "https://github.com/linkwarden/linkwarden"
upstream = "Dokploy/templates@6313a2e blueprints/linkwarden"

[variables]
main_domain = "${domain}"
next_secret = "${base64:32}"
postgres_password = "${password}"

[config.env]
NEXTAUTH_SECRET = "${next_secret}"
NEXTAUTH_URL = "http://${main_domain}/api/v1/auth"
POSTGRES_PASSWORD = "${postgres_password}"

[[config.domains]]
serviceName = "linkwarden"
port = 3000
host = "${main_domain}"

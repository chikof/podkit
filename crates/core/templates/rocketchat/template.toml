id = "rocketchat"
name = "Rocketchat"
description = "Rocket.Chat is a team communication platform and an open-source alternative to Slack."
category = "communication"
tags = ["chat"]
version = "6.9.2"
logo = "logo.png"
website = "https://rocket.chat/"
docs = "https://rocket.chat/docs/"
source = "https://github.com/RocketChat/Rocket.Chat"
upstream = "Dokploy/templates@6313a2e blueprints/rocketchat"

[variables]
main_domain = "${domain}"

[config.env]
ROCKETCHAT_HOST = "${main_domain}"
ROCKETCHAT_PORT = "3000"

[[config.domains]]
serviceName = "rocketchat"
port = 3000
host = "${main_domain}"

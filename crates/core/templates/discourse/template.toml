id = "discourse"
name = "Discourse"
description = "Discourse is forum software for running online communities."
category = "communication"
tags = [
    "forum",
    "community",
    "discussion",
]
version = "2026.1.4"
logo = "logo.svg"
website = "https://www.discourse.org/"
docs = "https://meta.discourse.org/"
source = "https://github.com/discourse/discourse"
upstream = "Dokploy/templates@6313a2e blueprints/discourse"

[variables]
admin_email = "${email}"
main_domain = "${domain}"
postgres_password = "${password}"
redis_password = "${password}"

[config.env]
DISCOURSE_ADMIN_EMAIL = "${admin_email}"
DISCOURSE_HOST = "${main_domain}"
POSTGRES_PASSWORD = "${postgres_password}"
REDIS_PASSWORD = "${redis_password}"

[[config.domains]]
serviceName = "discourse-app"
port = 80
host = "${main_domain}"

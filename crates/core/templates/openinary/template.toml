id = "openinary"
name = "Openinary"
description = "Openinary is a self-hosted Cloudinary alternative."
category = "media"
tags = [
    "media",
    "images",
    "videos",
    "cloudinary-alternative",
    "developer-tools",
]
version = "latest"
logo = "logo.svg"
website = "https://openinary.dev"
docs = "https://docs.openinary.dev"
source = "https://github.com/openinary/openinary"
upstream = "Dokploy/templates@6313a2e blueprints/openinary"

[variables]
allowed_origin = "http://${main_domain}"
better_auth_secret = "${password:64}"
better_auth_url = "http://${main_domain}"
image_tag = "latest"
main_domain = "${domain}"
next_public_api_base_url = "/api"

[config.env]
ALLOWED_ORIGIN = "${allowed_origin}"
BETTER_AUTH_SECRET = "${better_auth_secret}"
BETTER_AUTH_URL = "${better_auth_url}"
IMAGE_TAG = "${image_tag}"
NEXT_PUBLIC_API_BASE_URL = "${next_public_api_base_url}"

[[config.domains]]
serviceName = "openinary"
port = 3000
host = "${main_domain}"

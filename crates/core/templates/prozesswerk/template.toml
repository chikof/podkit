id = "prozesswerk"
name = "Prozesswerk"
description = "Describe business processes in plain language and get editable BPMN 2.0 diagrams. Self-hosted and model-agnostic — works with any OpenAI-compatible LLM."
category = "ai"
tags = [
    "bpmn",
    "ai",
    "automation",
    "self-hosted",
]
version = "1.0.0"
logo = "logo.svg"
website = ""
docs = "https://github.com/guidoesser/prozesswerk#readme"
source = "https://github.com/guidoesser/prozesswerk"
upstream = "Dokploy/templates@6313a2e blueprints/prozesswerk"

[variables]
llm_api_key = "${password:32}"
main_domain = "${domain}"

[config.env]
LLM_API_KEY = "${llm_api_key}"
LLM_BASE_URL = "https://api.openai.com/v1"
LLM_MODEL = "gpt-4o"

[[config.domains]]
serviceName = "prozesswerk"
port = 8000
host = "${main_domain}"

id = "pairdrop"
name = "PairDrop"
description = "PairDrop is a self-hosted local file sharing web app for sending files and text between nearby devices."
category = "storage"
tags = [
    "file-sharing",
    "p2p",
    "web-app",
    "self-hosted",
]
version = "latest"
logo = "logo.svg"
website = "https://pairdrop.net/"
docs = "https://github.com/schlagmichdoch/PairDrop/blob/master/docs/host-your-own.md"
source = "https://github.com/schlagmichdoch/PairDrop"
upstream = "Dokploy/templates@6313a2e blueprints/pairdrop"

[variables]
timezone = "Etc/UTC"

[config.env]
TZ = "${timezone}"

[[config.domains]]
serviceName = "pairdrop"
port = 3000
host = "${domain}"

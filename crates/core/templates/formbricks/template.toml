id = "formbricks"
name = "Formbricks"
description = "Formbricks is an open-source survey platform for collecting user and customer feedback."
category = "analytics"
tags = [
    "forms",
    "analytics",
]
version = "v3.1.3"
logo = "@formbricks"
website = "https://formbricks.com/"
docs = "https://formbricks.com/docs"
source = "https://github.com/formbricks/formbricks"
upstream = "Dokploy/templates@6313a2e blueprints/formbricks"

[variables]
cron_secret = "${base64:32}"
encryption_key = "${password:32}"
main_domain = "${domain}"
secret_base = "${base64:64}"

[config.env]
CRON_SECRET = "${cron_secret}"
ENCRYPTION_KEY = "${encryption_key}"
NEXTAUTH_SECRET = "${secret_base}"
NEXTAUTH_URL = "http://${main_domain}"
WEBAPP_URL = "http://${main_domain}"

[[config.domains]]
serviceName = "formbricks"
port = 3000
host = "${main_domain}"

id = "open-notebook"
name = "Open Notebook"
description = "Open Notebook with SurrealDB for data storage and AI-powered features."
category = "ai"
tags = [
    "notebook",
    "ai",
    "database",
    "surrealdb",
]
version = "latest"
logo = "logo.svg"
website = "https://www.open-notebook.ai/"
docs = "https://www.open-notebook.ai/get-started.html"
source = "https://github.com/lfnovo/open_notebook"
upstream = "Dokploy/templates@6313a2e blueprints/open_notebook"

[variables]
main_domain = "${domain}"
open_notebook_port = "8502"
surrealdb_port = "8000"

[config.env]
SURREAL_DATABASE = "staging"
SURREAL_NAMESPACE = "open_notebook"
SURREAL_PASSWORD = "root"
SURREAL_URL = "ws://surrealdb:8000/rpc"
SURREAL_USER = "root"

[[config.domains]]
serviceName = "surrealdb"
port = 8000
host = "surrealdb-${main_domain}"

[[config.domains]]
serviceName = "open_notebook"
port = 8502
host = "${main_domain}"

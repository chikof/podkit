id = "flagsmith"
name = "Flagsmith"
description = "Flagsmith is an open-source feature flagging and remote config service."
category = "other"
tags = [
    "feature-flag",
    "feature-management",
    "feature-toggle",
    "remote-configuration",
]
version = "2.177.1"
logo = "logo.png"
website = "https://www.flagsmith.com/"
docs = "https://docs.flagsmith.com/"
source = "https://github.com/Flagsmith/flagsmith"
upstream = "Dokploy/templates@6313a2e blueprints/flagsmith"

[variables]
database_password = "${password:16}"
django_secret_key = "${password:8}"
main_domain = "${domain}"

[config.env]
DATABASE_PASSWORD = "${database_password}"
DJANGO_SECRET_KEY = "${django_secret_key}"
FLAGSMITH_DOMAIN = "${main_domain}"

[[config.domains]]
serviceName = "flagsmith"
port = 8000
host = "${main_domain}"

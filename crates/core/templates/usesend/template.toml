id = "usesend"
name = "useSend"
description = "Open source alternative to Resend, Sendgrid, Postmark etc."
category = "productivity"
tags = [
    "e-mail",
    "marketing",
    "business",
    "self-hosted",
]
version = "latest"
logo = "logo.png"
website = "https://usesend.com/"
docs = "https://docs.usesend.com/introduction"
source = "https://github.com/usesend/usesend"
upstream = "Dokploy/templates@6313a2e blueprints/usesend"

[variables]
main_domain = "${domain}"
secret_base = "${base64:64}"

[config.env]
API_RATE_LIMIT = "1"
AWS_ACCESS_KEY = "'Fill'"
AWS_DEFAULT_REGION = "us-east-1"
AWS_SECRET_KEY = "'Fill'"
DATABASE_URL = "postgresql://postgres:postgres@usesend-db-prod:5432/usesend"
DOCKER_OUTPUT = "1"
GITHUB_ID = "'Fill'"
GITHUB_SECRET = "'Fill'"
NEXTAUTH_SECRET = "${secret_base}"
NEXTAUTH_URL = "http://localhost:3000"
POSTGRES_DB = "usesend"
POSTGRES_PASSWORD = "postgres"
POSTGRES_USER = "postgres"
REDIS_URL = "redis://usesend-redis-prod:6379"

[[config.domains]]
serviceName = "usesend"
port = 3000
host = "${main_domain}"

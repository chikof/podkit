id = "linkding"
name = "Linkding"
description = "Linkding is a self-hosted bookmark manager with a clean and simple interface."
category = "other"
tags = [
    "bookmark-manager",
    "self-hosted",
]
version = "latest"
logo = "logo.svg"
website = "https://linkding.link/"
docs = "https://github.com/sissbruecker/linkding/tree/master/docs"
source = "https://github.com/sissbruecker/linkding"
upstream = "Dokploy/templates@6313a2e blueprints/linkding"
reveal = ["superuser_password"]

[variables]
csrf_trusted_origins = "${domain}"
db_password = "${password:32}"
main_domain = "${domain}"
superuser_password = "${password:32}"

[config.env]
LD_AUTH_PROXY_LOGOUT_URL = ""
LD_AUTH_PROXY_USERNAME_HEADER = ""
LD_CONTEXT_PATH = ""
LD_CSRF_TRUSTED_ORIGINS = "${csrf_trusted_origins}"
LD_DB_DATABASE = ""
LD_DB_ENGINE = ""
LD_DB_HOST = ""
LD_DB_OPTIONS = "{}"
LD_DB_PASSWORD = "${db_password}"
LD_DB_PORT = ""
LD_DB_USER = ""
LD_DISABLE_BACKGROUND_TASKS = "False"
LD_DISABLE_URL_VALIDATION = "False"
LD_ENABLE_AUTH_PROXY = "False"
LD_SUPERUSER_NAME = ""
LD_SUPERUSER_PASSWORD = "${superuser_password}"

[[config.domains]]
serviceName = "linkding"
port = 9090
host = "${main_domain}"

id = "open-design"
name = "Open Design"
description = "Open Design is a local-first, open-source design tool with native desktop apps, a large library of design systems, and an extensible plugin ecosystem that runs across many coding agents."
category = "other"
tags = [
    "design",
    "self-hosted",
]
version = "0.16.1"
logo = "logo.svg"
website = "https://open-design.ai"
docs = "https://open-design.ai"
source = "https://github.com/nexu-io/open-design"
upstream = "Dokploy/templates@6313a2e blueprints/open-design"

[variables]
api_token = "${password:32}"
main_domain = "${domain}"

[config.env]
OD_ALLOWED_ORIGINS = "https://${main_domain},http://${main_domain}"
OD_API_TOKEN = "${api_token}"

[[config.domains]]
serviceName = "open-design"
port = 7456
host = "${main_domain}"

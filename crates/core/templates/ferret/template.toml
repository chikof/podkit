id = "ferret"
name = "Ferret"
description = "Self-hosted home inventory: find anything you own. Photos, barcodes, QR labels, warranties, maintenance and an insurance report, with a REST API, an MCP server and optional AI on your own models."
category = "ai"
tags = [
    "inventory",
    "home",
    "self-hosted",
    "mcp",
]
version = "2026.11.4"
logo = "logo.svg"
website = "https://github.com/ferret-project/ferret"
docs = "https://github.com/ferret-project/ferret/tree/main/apps/docs/hosting"
source = "https://github.com/ferret-project/ferret"
upstream = "Dokploy/templates@6313a2e blueprints/ferret"

[variables]
main_domain = "${domain}"

[config.env]
PUBLIC_URL = "http://${main_domain}"
TRUSTED_PROXIES = "172.16.0.0/12"

[[config.domains]]
serviceName = "ferret"
port = 8787
host = "${main_domain}"

id = "mediafetch"
name = "MediaFetch"
description = "A tiny, self-hosted web wrapper for yt-dlp to download video and audio. Optional basic auth."
category = "tools"
tags = [
    "utilities",
    "media",
    "downloader",
]
version = "1.1.1"
logo = "logo.svg"
website = "https://www.lukedunsmore.com/mediafetch"
docs = "https://docs.lukedunsmore.com/docs/self-hosted/mediafetch/"
source = "https://github.com/lukedunsmoto/mediafetch"
upstream = "Dokploy/templates@6313a2e blueprints/mediafetch"

[variables]
BASIC_AUTH_PASS = "changeme"
BASIC_AUTH_USER = "admin"
JOB_TIMEOUT_MS = "600000"
MAX_CONCURRENT_JOBS = "2"
OUTPUT_DIR = "/data/downloads"
PORT = "3002"
PUBLIC_BASE_URL = "https://${main_domain}"
VERSION_CHECK_TTL_MS = "21600000"
main_domain = "${domain}"

[[config.domains]]
serviceName = "mediafetch"
port = 3002
host = "${main_domain}"

[[config.mounts]]
filePath = "/data/downloads"
content = "mediafetch"

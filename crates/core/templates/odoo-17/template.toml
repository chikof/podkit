id = "odoo-17"
name = "Odoo"
description = "Odoo is a free and open source business management software that helps you manage your company's operations."
category = "productivity"
tags = ["erp"]
version = "17.0"
logo = "@odoo"
website = "https://odoo.com/"
docs = "https://www.odoo.com/documentation/"
source = "https://github.com/odoo/odoo"
upstream = "Dokploy/templates@6313a2e blueprints/odoo_17"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "web"
port = 8069
host = "${main_domain}"

[[config.mounts]]
filePath = "config/odoo.conf"
content = """
[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
proxy_mode = True
"""

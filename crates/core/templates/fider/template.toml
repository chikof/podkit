id = "fider"
name = "Fider"
description = "Fider is an open-source feedback portal for collecting, discussing, and prioritizing feature requests."
category = "other"
tags = [
    "feedback",
    "product",
    "roadmap",
    "self-hosted",
]
version = "0.21.1"
logo = "logo.svg"
website = "https://fider.io/"
docs = "https://docs.fider.io/hosting-instance/"
source = "https://github.com/getfider/fider"
upstream = "Dokploy/templates@6313a2e blueprints/fider"

[variables]
jwt_secret = "${password:64}"
main_domain = "${domain}"
postgres_password = "${password:32}"

[config.env]
BASE_URL = "https://${main_domain}"
DATABASE_URL = "postgres://fider:${postgres_password}@db:5432/fider?sslmode=disable"
EMAIL = "smtp"
EMAIL_NOREPLY = "noreply@${main_domain}"
EMAIL_SMTP_ENABLE_STARTTLS = "true"
EMAIL_SMTP_HOST = "mailhog"
EMAIL_SMTP_PASSWORD = ""
EMAIL_SMTP_PORT = "1025"
EMAIL_SMTP_USERNAME = ""
JWT_SECRET = "${jwt_secret}"
POSTGRES_DB = "fider"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_USER = "fider"

[[config.domains]]
serviceName = "fider"
port = 3000
host = "${main_domain}"

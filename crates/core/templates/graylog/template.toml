id = "graylog"
name = "Graylog"
description = "Graylog Open collects, indexes, and searches logs, with dashboards and alerts. Includes MongoDB and OpenSearch."
category = "monitoring"
tags = [
    "monitoring",
    "logging",
]
version = "7.1.9"
logo = "logo.png"
website = "https://graylog.org/"
docs = "https://go2docs.graylog.org/"
source = "https://github.com/Graylog2/graylog2-server"
upstream = "Dokploy/templates@6313a2e blueprints/graylog"
reveal = ["admin_password"]

[variables]
admin_password = "${password:32}"
main_domain = "${domain}"
password_secret = "${password:96}"

[config.env]
GRAYLOG_ADMIN_PASSWORD = "${admin_password}"
GRAYLOG_HTTP_EXTERNAL_URI = "http://${main_domain}/"
GRAYLOG_PASSWORD_SECRET = "${password_secret}"

[[config.domains]]
serviceName = "graylog"
port = 9000
host = "${main_domain}"

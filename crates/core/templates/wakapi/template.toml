id = "wakapi"
name = "Wakapi"
description = "Wakapi is a self-hosted WakaTime-compatible backend for tracking coding activity and developer statistics."
category = "development"
tags = [
    "developer-tools",
    "analytics",
    "wakatime",
    "self-hosted",
]
version = "latest"
logo = "logo.svg"
website = "https://wakapi.dev/"
docs = "https://github.com/muety/wakapi#-installation"
source = "https://github.com/muety/wakapi"
upstream = "Dokploy/templates@6313a2e blueprints/wakapi"

[variables]
password_salt = "${password:64}"

[config.env]
WAKAPI_PASSWORD_SALT = "${password_salt}"

[[config.domains]]
serviceName = "wakapi"
port = 3000
host = "${domain}"

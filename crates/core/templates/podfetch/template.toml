id = "podfetch"
name = "PodFetch"
description = "PodFetch is a sleek, self-hosted podcast manager that automatically downloads new episodes, offers a web UI for listening and managing podcasts, and provides a GPodder-compatible sync API for mobile apps like AntennaPod."
category = "media"
tags = ["media"]
version = "v5.2.2"
logo = "logo.png"
website = "https://samtv12345.github.io/PodFetch/"
docs = "https://samtv12345.github.io/PodFetch/"
source = "https://github.com/SamTV12345/PodFetch"
upstream = "Dokploy/templates@6313a2e blueprints/podfetch"
reveal = ["admin_password"]

[variables]
admin_password = "${password:24}"
admin_username = "admin"
main_domain = "${domain}"

[config.env]
PASSWORD = "${admin_password}"
USERNAME = "${admin_username}"

[[config.domains]]
serviceName = "podfetch"
port = 8000
host = "${main_domain}"

id = "hoarder"
name = "Hoarder"
description = 'Hoarder is an open source "Bookmark Everything" app that uses AI for automatically tagging the content you throw at it.'
category = "productivity"
tags = [
    "self-hosted",
    "bookmarks",
    "link-sharing",
]
version = "0.22.0"
logo = "logo.svg"
website = "https://hoarder.app/"
docs = "https://docs.hoarder.app/"
source = "https://github.com/hoarder/hoarder"
upstream = "Dokploy/templates@6313a2e blueprints/hoarder"

[variables]
main_domain = "${domain}"
meili_master_key = "${base64:32}"
next_secret = "${base64:32}"
postgres_password = "${password}"

[config.env]
MEILI_MASTER_KEY = "${meili_master_key}"
NEXTAUTH_SECRET = "${next_secret}"
NEXTAUTH_URL = "http://${main_domain}"

[[config.domains]]
serviceName = "web"
port = 3000
host = "${main_domain}"

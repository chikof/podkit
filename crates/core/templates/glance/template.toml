id = "glance"
name = "Glance"
description = "A self-hosted dashboard that puts all your feeds in one place. Features RSS feeds, weather, bookmarks, site monitoring, and more in a minimal, fast interface."
category = "productivity"
tags = [
    "dashboard",
    "monitoring",
    "widgets",
    "rss",
]
version = "latest"
logo = "logo.png"
website = "https://glance.app/"
docs = "https://github.com/glanceapp/glance/blob/main/docs/configuration.md"
source = "https://github.com/glanceapp/glance"
upstream = "Dokploy/templates@6313a2e blueprints/glance"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "glance"
port = 8080
host = "${main_domain}"

[[config.mounts]]
filePath = "/app/config/glance.yml"
content = """
branding:
  hide-footer: true
  logo-text: P

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: calendar

          - type: releases
            show-source-icon: true
            repositories:
              - Dokploy/dokploy
              - n8n-io/n8n
              - Budibase/budibase
              - home-assistant/core
              - tidbyt/pixlet

          - type: twitch-channels
            channels:
              - nmplol
              - extraemily
              - qtcinderella
              - ludwig
              - timthetatman
              - mizkif

      - size: full
        widgets:
          - type: hacker-news

          - type: videos
            style: grid-cards
            channels:
              - UC3GzdWYwUYI1ACxuP9Nm-eg
              - UCGbg3DjQdcqWwqOLHpYHXIg
              - UC24RSoLcjiNZbQcT54j5l7Q
            limit: 3

          - type: rss
            limit: 10
            collapse-after: 3
            cache: 3h
            feeds:
              - url: https://daringfireball.net/feeds/main
                title: Daring Fireball
        
      - size: small
        widgets:
          - type: weather
            location: Gansevoort, New York, United States
            show-area-name: false
            units: imperial
            hour-format: 12h

          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: VOO
                name: Vanguard
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: ETH-USD
                name: Etherium
              - symbol: NVDA
                name: NVIDIA
              - symbol: AAPL
                name: Apple
              - symbol: MSFT
                name: Microsoft
              - symbol: GOOGL
                name: Google
              - symbol: AMD
                name: AMD
              - symbol: TSLA
                name: Tesla 
"""

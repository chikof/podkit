id = "kavel-image-starter"
name = "Kavel Image Starter"
description = "One-page text-to-image web app: type a prompt, pick an aspect ratio, get the image back in about a minute. Runs on Kavel's free tier with nothing configured; set KAVEL_API_KEY to use your own account."
category = "ai"
tags = [
    "ai",
    "image-generation",
    "text-to-image",
]
version = "1.0.1"
logo = "@mono-kavel-image-starter"
website = "https://www.kavel.ai"
docs = "https://kavel.readthedocs.io/"
source = "https://github.com/hanshs474/kavel-image-starter"
upstream = "Dokploy/templates@6313a2e blueprints/kavel-image-starter"

[variables]
main_domain = "${domain}"

[config.env]
KAVEL_API_KEY = ""
KAVEL_MODEL = "kavel-image-v1"

[[config.domains]]
serviceName = "kavel-image-starter"
port = 3000
host = "${main_domain}"

id = "shoutrrr"
name = "Shoutrrr"
description = "Shoutrrr is an open source social media scheduler for drafting, scheduling, and publishing posts across multiple accounts and workspaces."
category = "productivity"
tags = [
    "social-media",
    "marketing",
    "scheduling",
]
version = "1.5.4"
logo = "logo.svg"
website = "https://shoutrrr.com"
docs = "https://shoutrrr.com/docs/getting-started"
source = "https://github.com/coollabsio/shoutrrr"
upstream = "Dokploy/templates@6313a2e blueprints/shoutrrr"

[variables]
app_key = "${base64:32}"
main_domain = "${domain}"

[config.env]
APP_KEY = "base64:${app_key}"
APP_URL = "http://${main_domain}"
INSTANCE_REGISTRATIONS_ENABLED = "false"
MAIL_MAILER = "log"
OCTANE_HTTPS = "false"
SESSION_SECURE_COOKIE = "false"

[[config.domains]]
serviceName = "shoutrrr"
port = 8080
host = "${main_domain}"

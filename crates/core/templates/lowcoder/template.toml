id = "lowcoder"
name = "Lowcoder"
description = "Rapid business App Builder for Everyone"
category = "automation"
tags = [
    "low-code",
    "no-code",
    "development",
]
version = "2.6.4"
logo = "@mono-lowcoder"
website = "https://www.lowcoder.cloud/"
docs = "https://docs.lowcoder.cloud/lowcoder-documentation"
source = "https://github.com/lowcoder-org/lowcoder"
upstream = "Dokploy/templates@6313a2e blueprints/lowcoder"

[variables]
api_secret = "${password:32}"
encryption_password = "${password:32}"
encryption_salt = "${password:32}"
main_domain = "${domain}"

[config.env]
CORS_ALLOWED_DOMAINS = "*"
ENABLE_USER_SIGN_UP = "false"
ENCRYPTION_PASSWORD = "${encryption_password}"
ENCRYPTION_SALT = "${encryption_salt}"
LOWCODER_API_KEY_SECRET = "${api_secret}"

[[config.domains]]
serviceName = "lowcoder-api-service"
port = 3000
host = "${main_domain}"

id = "gitingest"
name = "Gitingest"
description = "Gitingest is an application that supports Prometheus metrics, Sentry integration, and S3-backed storage."
category = "analytics"
tags = [
    "analytics",
    "s3",
    "monitoring",
    "sentry",
    "metrics",
]
version = "latest"
logo = "logo.png"
website = "https://gitingest.com"
docs = "https://github.com/coderamp-labs/gitingest#readme"
source = "https://github.com/coderamp-labs/gitingest"
upstream = "Dokploy/templates@6313a2e blueprints/gitingest"

[variables]
main_domain = "${domain}"

[config.env]
ALLOWED_HOSTS = "${main_domain}"
SOFTWARE_VERSION_TAG = "latest"

[[config.domains]]
serviceName = "gitingest"
port = 8000
host = "${main_domain}"

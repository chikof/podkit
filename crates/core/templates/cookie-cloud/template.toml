id = "cookie-cloud"
name = "CookieCloud"
description = "CookieCloud lets you sync and manage browser cookies across devices securely using a self-hosted backend."
category = "storage"
tags = [
    "cookies",
    "sync",
    "selfhosted",
    "privacy",
]
version = "latest"
logo = "logo.png"
website = "https://github.com/easychen/cookiecloud"
docs = "https://github.com/easychen/cookiecloud#readme"
source = "https://github.com/easychen/cookiecloud"
upstream = "Dokploy/templates@6313a2e blueprints/cookie-cloud"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "cookiecloud"
port = 8088
host = "${main_domain}"

id = "n8n-runner-postgres-ollama"
name = "n8n + Worker + Runner with Redis/Postgres and Ollama"
description = "n8n is an open source low-code platform for automating workflows and integrations with PostgreSQL database and Ollama AI model."
category = "ai"
tags = [
    "ai",
    "automation",
    "workflow",
    "low-code",
    "postgres",
    "ollama",
]
version = "latest"
logo = "logo.png"
website = "https://n8n.io/"
docs = "https://docs.n8n.io/"
source = "https://github.com/n8n-io/n8n"
upstream = "Dokploy/templates@6313a2e blueprints/n8n-runner-postgres-ollama"

[variables]
main_domain = "${domain}"
n8n_encryption_key = "${base64:64}"
n8n_runner_secret = "${base64:64}"
postgres_db = "n8n"
postgres_password = "${password:24}"
postgres_user = "${username}"

[config.env]
ENCRYPTION_KEY = "${n8n_encryption_key}"
GENERIC_TIMEZONE = "Europe/Berlin"
N8N_HOST = "${main_domain}"
N8N_PORT = "5678"
N8N_RUNNERS_SECRET = "${n8n_runner_secret}"
OLLAMA_HOST = "http://ollama:11434"
POSTGRES_DB = "${postgres_db}"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_USER = "${postgres_user}"
PROXY_HOPS = "0"
SMTP_HOST = ""
SMTP_PASS = ""
SMTP_PORT = "587"
SMTP_USER = ""

[[config.domains]]
serviceName = "n8n"
port = 5678
host = "${main_domain}"

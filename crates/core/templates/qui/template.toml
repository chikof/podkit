id = "qui"
name = "qui"
description = "A fast, modern web interface for qBittorrent. Manage multiple qBittorrent instances from a single, lightweight application built by autobrr."
category = "media"
tags = [
    "torrent",
    "qbittorrent",
    "download",
    "media",
    "self-hosted",
]
version = "latest"
logo = "logo.png"
website = "https://getqui.com"
docs = "https://getqui.com"
source = "https://github.com/autobrr/qui"
upstream = "Dokploy/templates@6313a2e blueprints/qui"

[variables]
main_domain = "${domain}"

[[config.domains]]
serviceName = "qui"
port = 7476
host = "${main_domain}"
path = "/"

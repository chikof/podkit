id = "doublezero"
name = "Double Zero"
description = "00 is a self hostable SES dashboard for sending and monitoring emails with AWS"
category = "communication"
tags = ["email"]
version = "v0.2.1"
logo = "logo.svg"
website = ""
docs = "https://github.com/technomancy-dev/00"
source = "https://github.com/technomancy-dev/00"
upstream = "Dokploy/templates@6313a2e blueprints/doublezero"

[variables]
main_domain = "${domain}"
secret_key_base = "${base64:64}"

[config.env]
AWS_ACCESS_KEY_ID = "your-aws-access-key"
AWS_REGION = "your-aws-region"
AWS_SECRET_ACCESS_KEY = "your-aws-secret-key"
DOUBLEZERO_HOST = "${main_domain}"
DOUBLEZERO_PORT = "4000"
SECRET_KEY_BASE = "${secret_key_base}"
SQS_URL = "your-aws-sqs-url"
SYSTEM_EMAIL = ""

[[config.domains]]
serviceName = "doublezero"
port = 4000
host = "${main_domain}"

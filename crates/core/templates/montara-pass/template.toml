id = "montara-pass"
name = "Montara Pass"
description = "Self-hosted password manager with an end-to-end encrypted vault — the server stores ciphertext and wrapped keys only — featuring passkeys, item sharing, folders, and a built-in web app."
category = "security"
tags = [
    "password-manager",
    "security",
    "encryption",
]
version = "v2.12.2"
logo = "logo.png"
website = "https://montarapass.com"
docs = "https://docs.montarapass.com"
source = "https://github.com/montara-project/montara-pass"
upstream = "Dokploy/templates@6313a2e blueprints/montara-pass"
reveal = ["super_user_password"]

[variables]
app_secret = "${base64:32}"
main_domain = "${domain}"
postgres_db = "montara_pass"
postgres_password = "${password:32}"
postgres_user = "montara"
super_user_email = "${email}"
super_user_password = "${password:24}"

[config.env]
APP_SECRET = "${app_secret}"
BASE_URL = "${main_domain}"
FROM_ADDRESS = ""
POSTGRES_DB = "${postgres_db}"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_USER = "${postgres_user}"
RESEND_API_KEY = ""
SUPER_USER = "${super_user_email}:${super_user_password}"
TRUSTED_PROXIES = "10.0.1.0/24,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"

[[config.domains]]
serviceName = "montara-pass"
port = 8080
host = "${main_domain}"

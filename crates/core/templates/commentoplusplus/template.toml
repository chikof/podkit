id = "commentoplusplus"
name = "Commento++"
description = "Commento++ is a free, open-source application designed to provide a fast, lightweight comments box that you can embed in your static website. It offers features like Markdown support, Disqus import, voting, automated spam detection, moderation tools, sticky comments, thread locking, and OAuth login."
category = "cms"
tags = [
    "comments",
    "website",
    "open-source",
]
version = "v1.8.7"
logo = "logo.png"
website = "https://commento.io/"
docs = "https://commento.io/"
source = "https://github.com/souramoo/commentoplusplus"
upstream = "Dokploy/templates@6313a2e blueprints/commentoplusplus"

[variables]
DOMAIN = "${domain}"
POSTGRES_PASSWORD = "${password:16}"

[config.env]
COMMENTO_ENABLE_WILDCARDS = "true"
COMMENTO_ORIGIN = "http://${DOMAIN}"
COMMENTO_POSTGRES = "postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable"
POSTGRES_DB = "postgres"
POSTGRES_PASSWORD = "${POSTGRES_PASSWORD}"
POSTGRES_USER = "postgres"

[[config.domains]]
serviceName = "commentoplusplus"
port = 8080
host = "${DOMAIN}"

id = "dumbassets"
name = "DumbAssets"
description = "DumbAssets is a simple, self-hosted asset tracking service with no database or authentication required."
category = "other"
tags = [
    "asset-tracking",
    "self-hosted",
    "simple",
]
version = "latest"
logo = "logo.svg"
website = "https://dumbware.io/DumbAssets/"
docs = "https://github.com/dumbwareio/dumbassets"
source = "https://github.com/dumbwareio/dumbassets"
upstream = "Dokploy/templates@6313a2e blueprints/dumbassets"

[variables]
default_pin = "${password:4}"
main_domain = "${domain}"

[config.env]
ALLOWED_ORIGINS = "*"
APPRISE_URL = ""
BASE_URL = "https://${main_domain}"
CURRENCY_CODE = "USD"
CURRENCY_LOCALE = "en-US"
DEBUG = "false"
DEMO_MODE = "false"
DUMBASSETS_PIN = "${default_pin}"
NODE_ENV = "production"
SITE_TITLE = "DumbAssets"

[[config.domains]]
serviceName = "dumbassets"
port = 3000
host = "${main_domain}"

id = "versitygw"
name = "VersityGW"
description = "VersityGW is a high-performance S3-compatible gateway that exposes POSIX filesystems, ScoutFS, Azure Blob, or other S3 servers over the S3 API, with a built-in WebUI for bucket and user management."
category = "storage"
tags = [
    "s3",
    "storage",
    "gateway",
    "object-storage",
]
version = "1.8.0"
logo = "logo.svg"
website = "https://www.versity.com/"
docs = "https://github.com/versity/versitygw/wiki"
source = "https://github.com/versity/versitygw"
upstream = "Dokploy/templates@6313a2e blueprints/versitygw"

[variables]
ROOT_ACCESS_KEY = "${hash:16}"
ROOT_SECRET_KEY = "${password:32}"
main_domain = "${domain}"

[config.env]
ROOT_ACCESS_KEY = "${ROOT_ACCESS_KEY}"
ROOT_SECRET_KEY = "${ROOT_SECRET_KEY}"

[[config.domains]]
serviceName = "versitygw"
port = 8080
host = "${main_domain}"

id = "qdrant"
name = "Qdrant"
description = "An open-source vector database designed for high-performance similarity search and storage of embeddings."
category = "database"
tags = [
    "vector-db",
    "database",
    "search",
]
version = "latest"
logo = "logo.svg"
website = "https://qdrant.tech/"
docs = "https://qdrant.tech/documentation/"
source = "https://github.com/qdrant/qdrant"
upstream = "Dokploy/templates@6313a2e blueprints/qdrant"

[variables]
main_domain = "${domain}"

[config.env]
QDRANT_API_KEY = "${password:32}"

[[config.domains]]
serviceName = "qdrant"
port = 6333
host = "${main_domain}"

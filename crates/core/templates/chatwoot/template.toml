id = "chatwoot"
name = "Chatwoot"
description = "Chatwoot is an open-source customer support and engagement platform with a shared inbox and live chat."
category = "communication"
tags = [
    "support",
    "chat",
    "customer-service",
]
version = "v4.12.1"
logo = "logo.svg"
website = "https://www.chatwoot.com"
docs = "https://www.chatwoot.com/docs"
source = "https://github.com/chatwoot/chatwoot"
upstream = "Dokploy/templates@6313a2e blueprints/chatwoot"

[variables]
main_domain = "${domain}"
postgres_password = "${password}"
redis_password = "${password}"
secret_key_base = "${hash:64}"

[config.env]
ACTIVE_STORAGE_SERVICE = "local"
DEFAULT_LOCALE = "en"
ENABLE_ACCOUNT_SIGNUP = "false"
FORCE_SSL = "false"
FRONTEND_URL = "http://${main_domain}"
INSTALLATION_ENV = "docker"
LOG_LEVEL = "info"
NODE_ENV = "production"
POSTGRES_DATABASE = "chatwoot"
POSTGRES_HOST = "postgres"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_PORT = "5432"
POSTGRES_USERNAME = "postgres"
RAILS_ENV = "production"
RAILS_LOG_TO_STDOUT = "true"
REDIS_PASSWORD = "${redis_password}"
REDIS_URL = "redis://:${redis_password}@redis:6379"
SECRET_KEY_BASE = "${secret_key_base}"

[[config.domains]]
serviceName = "chatwoot"
port = 3000
host = "${main_domain}"

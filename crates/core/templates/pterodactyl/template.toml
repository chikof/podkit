id = "pterodactyl"
name = "Pterodactyl"
description = "A free, open-source game server management panel."
category = "other"
tags = [
    "self-hosted",
    "open-source",
    "management",
]
version = "latest"
logo = "logo.png"
website = "https://pterodactyl.io"
docs = "https://pterodactyl.io/project/introduction.html"
source = "https://github.com/pterodactyl/panel"
upstream = "Dokploy/templates@6313a2e blueprints/pterodactyl"

[variables]
db_password = "${password:32}"
db_root_password = "${password:32}"
main_domain = "${domain}"
secret_key = "${base64:48}"

[config.env]
APP_SERVICE_AUTHOR = "noreply@example.com"
APP_TIMEZONE = "UTC"
APP_URL = "{$main_domain}"
CACHE_DRIVER = "redis"
DB_HOST = "database"
DB_PORT = "3306"
Domain = "${main_domain}"
MAIL_DRIVER = "smtp"
MAIL_ENCRYPTION = "true"
MAIL_FROM = "noreply@example.com"
MAIL_HOST = "mail"
MAIL_PASSWORD = ""
MAIL_PORT = "1025"
MAIL_USERNAME = ""
MYSQL_PASSWORD = "${db_password}"
MYSQL_ROOT_PASSWORD = "${db_root_password}"
QUEUE_DRIVER = "redis"
REDIS_HOST = "cache"
SESSION_DRIVER = "redis"

[[config.domains]]
serviceName = "panel"
port = 80
host = "${main_domain}"

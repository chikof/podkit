id = "junctio"
name = "Junctio"
description = "Self-hosted MCP gateway that puts stdio, Docker and remote MCP servers behind one endpoint per client, with API key or OAuth downstream auth and upstream tokens refreshed before they expire."
category = "ai"
tags = [
    "ai",
    "mcp",
    "gateway",
    "oauth",
    "developer-tools",
]
version = "0.2.6"
logo = "logo.png"
website = "https://junctio.org"
docs = "https://junctio.org/docs/"
source = "https://github.com/k2so-dev/junctio"
upstream = "Dokploy/templates@6313a2e blueprints/junctio"

[variables]
junctio_secret = "${hash:64}"
main_domain = "${domain}"

[config.env]
JUNCTIO_BASE_URL = "https://${main_domain}"
JUNCTIO_SECRET = "${junctio_secret}"
JUNCTIO_TRUST_PROXY = "true"

[[config.domains]]
serviceName = "junctio"
port = 3000
host = "${main_domain}"

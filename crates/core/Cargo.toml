[package]
name = "podkit-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
config_file = []
# The hosted offering's billing hooks. Off by default: a self-hosted podkit never builds them.
# See docs/cloud-extension.md.
cloud = ["dep:podkit-cloud"]
# The helpers of `tests` (a test `AppState`, the router over it, SQL fixtures) for the tests
# of the layers above; nothing but a test build turns it on.
testing = ["outbound/test-util", "dep:agent"]

[dependencies]
axum.workspace = true
image.workspace = true
axum-extra.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
time.workspace = true
serde.workspace = true
forgeconf.workspace = true
dirs.workspace = true
tower-cookies.workspace = true
tower-http.workspace = true
zeroize.workspace = true
crypto.workspace = true
sqlx.workspace = true
sha2.workspace = true
bcrypt.workspace = true
hmac.workspace = true
getrandom.workspace = true
proto.workspace = true
outbound.workspace = true
podkit-billing = { path = "../billing" }
podkit-cloud = { path = "../cloud", optional = true }
# Only with `testing`: the stand-in agent of the log search tests has the real log store.
agent = { path = "../../agent", optional = true }
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio-util.workspace = true
bytes.workspace = true
serde_json.workspace = true
toml.workspace = true
reqwest.workspace = true
lettre.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
base64.workspace = true
url.workspace = true
croner.workspace = true
jiff.workspace = true
ssh-key.workspace = true
rsa.workspace = true
rusty-s3.workspace = true
podkit-firewall = { path = "../firewall" }
tempfile.workspace = true
flate2.workspace = true
tar.workspace = true
serde-saphyr = "=2.2.0"
shlex = "=1.3.0"
tower.workspace = true
webauthn-rs = { version = "=0.6.2", features = ["danger-allow-state-serialisation"] }
qrcode = { version = "0.15.0", default-features = false }
sha1 = "0.11.0"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

[lints]
workspace = true

[dev-dependencies]
outbound = { workspace = true, features = ["test-util"] }
# Live model-download test runs the real agent in process.
agent = { path = "../../agent" }
jsonschema = { version = "=0.63.2", default-features = false }
tokio = { workspace = true, features = ["test-util"] }
webauthn-authenticator-rs = { version = "=0.6.2", features = ["softpasskey"] }
